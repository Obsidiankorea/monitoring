<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파견 현황 — 경남 기상지도</title>
<style>
  :root { --bg: #0b1017; --panel: #121a24; --line: #253244; --ink: #e8eef6; --ink-2: #a9b6c7; --ink-3: #7c8a9c; --accent: #6cb4ff;
          --warn: #ffb74d; --bad: #ff6b6b; --ok: #7ad19b; --doing: #6cb4ff; }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 14px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; flex: 1; } header a { color: var(--accent); } header small { color: var(--ink-3); }
  select, button { height: 36px; padding: 0 10px; font-family: inherit; font-size: 13px; color: var(--ink); background: #1b2635; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  :is(select, button, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .sum div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .sum b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; } .sum span { color: var(--ink-2); font-size: 12.5px; }
  .sum .w b { color: var(--bad); } .sum .h b { color: var(--warn); } .sum .d b { color: var(--ok); }
  .sg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .sg.warn { border-color: color-mix(in oklab, var(--bad) 60%, var(--line)); }
  .sg > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; min-height: 52px; }
  .sg > summary::-webkit-details-marker { display: none; }
  .sg h2 { margin: 0; font-size: 16px; }
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #0e151e; }
  .bar i { display: block; height: 100%; } .s0 { background: #4a5568; } .s1 { background: #8a94a6; } .s2 { background: #c9b458; } .s3 { background: var(--doing); } .s4 { background: var(--ok); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); justify-content: flex-end; }
  .tag { padding: 1px 8px; border-radius: 999px; background: #1b2635; } .tag.w { color: #fff; background: color-mix(in oklab, var(--bad) 70%, #000); } .tag.h { color: #1a1206; background: var(--warn); }
  table { width: 100%; border-collapse: collapse; } td, th { padding: 7px 14px; border-top: 1px solid var(--line); text-align: left; font-size: 13px; }
  th { color: var(--ink-3); font-weight: 600; font-size: 12px; }
  .st { display: flex; gap: 4px; flex-wrap: wrap; } .st span { padding: 0 6px; border-radius: 4px; font-size: 12px; background: #1b2635; color: var(--ink-3); }
  .st span.done { background: color-mix(in oklab, var(--ok) 25%, #0e151e); color: var(--ink); } .st span.next { outline: 1px dashed var(--ink-3); }
  td.warn { color: var(--bad); font-weight: 600; }
  .key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); } .key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .empty { padding: 30px; text-align: center; color: var(--ink-2); background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; }
  @media (max-width: 640px) { .sg > summary { grid-template-columns: 56px minmax(0, 1fr); } .tags { grid-column: 1 / -1; justify-content: flex-start; } td:nth-child(3), th:nth-child(3) { display: none; } }
</style>
</head>
<body>
<main>
  <header><h1>파견 현황</h1><small id="at" aria-live="polite"></small>
    <label>기간 <select id="hours"><option value="6">6시간</option><option value="24" selected>24시간</option><option value="72">3일</option></select></label>
    <button id="re" type="button">새로 보기</button><a href="/map.html">지도로</a></header>
  <div class="sum" id="sum"></div>
  <div class="key" aria-hidden="true"><span><i class="s0"></i>요청</span><span><i class="s1"></i>열람</span><span><i class="s2"></i>확인</span><span><i class="s3"></i>조치 중</span><span><i class="s4"></i>조치 완료</span><span>빨간 테두리 = 10분 넘게 확인 없음</span></div>
  <div id="list"></div>
</main>
<script>
  const $ = id => document.getElementById(id), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STEPS = ["요청", "열람", "확인", "조치 중", "조치 완료"], OPEN = new Set();
  async function load() {
    let j;
    try {
      const r = await fetch(`/api/reply/board?hours=${$("hours").value}`);
      if (r.status === 401) return location.replace("/login.html?next=/board.html");
      j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.status);
    } catch (e) { $("at").textContent = `받지 못했다 — ${e.message}`; return; }
    const gs = j.siguns || [], t = k => gs.reduce((a, g) => a + (k(g) || 0), 0);
    $("at").textContent = `${new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })} 기준 · 30초마다 새로`;
    $("sum").innerHTML = [["요청한 지구", t(g => g.n), ""], ["확인 없음(10분↑)", t(g => g.warn), "w"], ["지원 필요", t(g => g.help), "h"],
      ["조치 완료", t(g => g.steps["조치 완료"]), "d"], ["시군", gs.length, ""]].map(([l, v, c]) => `<div class="${c}"><b>${v}</b><span>${l}</span></div>`).join("");
    if (!gs.length) { $("list").innerHTML = `<div class="empty">${j.demo ? "시연 화면에는 파견 기록이 없다" : "이 기간에 현장 요청이 없다 — 상황판단 창에서 지구에 요청을 보내면 여기에 시군별로 모인다"}</div>`; return; }
    $("list").innerHTML = gs.map(g => `<details class="sg${g.warn ? " warn" : ""}" data-sg="${esc(g.sigun)}"${OPEN.has(g.sigun) ? " open" : ""}>
      <summary><h2>${esc(g.sigun)}</h2>
        <div class="bar" role="img" aria-label="${STEPS.map(s => `${s} ${g.steps[s] || 0}`).join(", ")}">${STEPS.map((s, i) => g.steps[s] ? `<i class="s${i}" style="flex:${g.steps[s]}"></i>` : "").join("")}</div>
        <div class="tags"><span class="tag">${g.n}곳</span>${g.warn ? `<span class="tag w">확인 없음 ${g.warn}</span>` : ""}${g.help ? `<span class="tag h">지원 필요 ${g.help}</span>` : ""}<span class="tag">완료 ${g.steps["조치 완료"] || 0}</span></div></summary>
      <table><thead><tr><th>지구</th><th>단계</th><th>요청</th><th>알림</th></tr></thead><tbody>
        ${g.rows.map(r => `<tr><td>${esc(r.name)}</td><td><div class="st">${r.steps.map(s => `<span class="${s.st}">${esc(s.label)}${s.t ? " " + esc(s.t) : ""}</span>`).join("")}</div></td>
          <td>${esc(r.asked.slice(5))}</td><td class="${r.warn ? "warn" : ""}">${esc(r.warn || r.side.join(" · ") || "")}</td></tr>`).join("")}
      </tbody></table></details>`).join("");
  }
  $("list").addEventListener("toggle", e => { const d = e.target.closest("details"); if (d) (d.open ? OPEN.add(d.dataset.sg) : OPEN.delete(d.dataset.sg)); }, true);
  $("hours").addEventListener("change", load); $("re").addEventListener("click", load);
  load(); setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>
