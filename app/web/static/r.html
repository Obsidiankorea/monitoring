<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>현장 회신</title>
<!-- 지구 하나의 현장 페이지(app/reply.py) — 담당자 등록 · 교대, 조치 상황 올리기, 지금까지의 기록.
     비 오는 밖에서 한 손으로 — 밝은 바탕 · 큰 단추 · 바깥 자원 없음(글꼴 · 스크립트를 받지 않는다) -->
<style>
:root { --ground: #EEF2F7; --panel: #FFFFFF; --line: #C9D4E1; --ink: #101821; --ink-2: #47596D; --accent: #1B6FA8; --on: #FFFFFF; --ok: #12805A; --bad: #B4401A; --warn: #8A5A00; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
h1 { font-size: 22px; margin: 4px 0 0; }
.addr { color: var(--ink-2); margin: 0 0 16px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 0 0 16px; }
h2 { font-size: 17px; margin: 0 0 12px; }
.hint { color: var(--ink-2); font-size: 14px; margin: 8px 0 0; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; }
legend, .lab { font-weight: 600; font-size: 15px; padding: 0; margin: 0 0 8px; display: block; }
.opt { font-weight: 400; color: var(--ink-2); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: flex; align-items: center; justify-content: center; min-height: 52px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel); font-weight: 600; text-align: center; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on); }
.seg input:focus-visible + span, .shot:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
.shot { display: flex; align-items: center; justify-content: center; min-height: 52px; border: 1.5px dashed var(--accent); border-radius: 10px; color: var(--accent); font-weight: 600; }
.shot input { position: absolute; opacity: 0; width: 1px; height: 1px; }
img { display: block; width: 100%; border-radius: 10px; margin: 8px 0; }
img[hidden] { display: none; }
input[type=text], input[type=tel], textarea { width: 100%; min-height: 48px; font: inherit; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; margin-top: 6px; }
textarea { min-height: 72px; }
button { min-height: 48px; padding: 0 14px; font: inherit; font-weight: 600; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
button.go { width: 100%; min-height: 56px; border: 0; background: var(--ink); color: var(--on); font-weight: 700; }
button:disabled { opacity: .5; }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.who:first-of-type { border-top: 0; padding-top: 0; }
.who b { flex: 1 1 100%; } .who a { color: var(--accent); font-weight: 600; flex: 1; min-height: 48px; display: flex; align-items: center; }
.me { font-size: 13px; font-weight: 600; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
.state { margin: 10px 0 0; font-weight: 600; min-height: 1.45em; }
.state.ok { color: var(--ok); } .state.bad { color: var(--bad); }
ol { list-style: none; margin: 0; padding: 0; }
ol li { padding: 10px 0; border-top: 1px solid var(--line); }
ol li:first-child { border-top: 0; padding-top: 0; }
.at { color: var(--ink-2); font-size: 14px; }
.ask { color: var(--warn); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
</style>
<main>
  <h1 id="name">불러오는 중…</h1>
  <p class="addr" id="addr"></p>

  <section>
    <h2>지금 담당자</h2>
    <div id="people"></div>
    <form id="join" hidden>
      <h3 id="joinhead" style="font-size:15px;margin:16px 0 8px"></h3>
      <div class="grid2">
        <label class="lab">직급<input type="text" name="rank" maxlength="20" autocomplete="organization-title"></label>
        <label class="lab">성명<input type="text" name="name" maxlength="20" autocomplete="name" required></label>
      </div>
      <label class="lab" style="margin-top:12px">휴대폰 번호<input type="tel" name="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" required></label>
      <button class="go" style="margin-top:12px">담당자로 등록</button>
    </form>
    <p class="state" id="pstate" role="status"></p>
    <button id="share" style="width:100%">이 링크를 다른 담당자에게 넘기기</button>
    <p class="hint">담당자는 2명까지입니다. 여기 넣은 직급 · 성명 · 번호는 이 링크를 가진 사람과 재난상황실에 보입니다.</p>
  </section>

  <section>
    <h2>지금 상황 올리기</h2>
    <form id="reply">
      <div style="margin:0 0 16px">
        <span class="lab">현장 사진 <span class="opt">(없어도 됩니다)</span></span>
        <img id="shotimg" alt="보낼 현장 사진" hidden>
        <label class="shot"><input type="file" id="shot" accept="image/*" capture="environment"><span id="shotlab">사진 찍기</span></label>
      </div>
      <fieldset><legend>조치 여부</legend>
        <div class="seg">
          <label><input type="radio" name="action" value="done"><span>조치함</span></label>
          <label><input type="radio" name="action" value="doing"><span>조치 중</span></label>
          <label><input type="radio" name="action" value="not"><span>아직</span></label>
          <label><input type="radio" name="action" value="na"><span>해당 없음</span></label>
        </div>
      </fieldset>
      <fieldset><legend>인력 · 장비 추가 배치</legend>
        <div class="seg">
          <label><input type="radio" name="more" value="yes"><span>필요함</span></label>
          <label><input type="radio" name="more" value="no"><span>필요 없음</span></label>
        </div>
      </fieldset>
      <label class="lab">덧붙일 말 <span class="opt">(없어도 됩니다)</span><textarea name="memo" maxlength="500" style="font-weight:400"></textarea></label>
      <button class="go" style="margin-top:16px">상황 올리기</button>
      <p class="state" id="rstate" role="status"></p>
    </form>
  </section>

  <section><h2>진행 기록</h2><ol id="log"></ol></section>
  <section id="pastbox" hidden><h2>지난 담당자</h2><ol id="past"></ol></section>
</main>
<script>
const base = location.pathname.replace(/\/$/, ""), KEY = "me:" + base;
const $ = s => document.querySelector(s);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const say = (id, cls, text) => { $(id).className = "state " + cls; $(id).textContent = text; };
const ACT = { done: "조치함", doing: "조치 중", not: "아직", na: "해당 없음" };
const day = s => `${+s.slice(5, 7)}.${+s.slice(8, 10)}. ${s.slice(11)}`;
let me = null, photo = null;
try { me = +localStorage.getItem(KEY) || null; } catch {}
const setMe = id => { me = id; try { id ? localStorage.setItem(KEY, id) : localStorage.removeItem(KEY); } catch {} };

async function post(path, body) {
  const r = await fetch(base + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "연결을 확인하고 다시 눌러 주세요");
  return r.json();
}

function draw(d) {
  document.title = d.name + " — 현장 회신";
  $("#name").textContent = d.name; $("#addr").textContent = d.addr;
  if (!d.people.some(p => p.id === me)) setMe(null);            // 내가 빠졌거나 다른 휴대폰
  $("#people").replaceChildren(...(d.people.length ? d.people.map(p => {
    const row = el("div", null, "who"), b = el("b", `${p.rank} ${p.name}`.trim()), tel = el("a", p.tel.replace(/^(\d{3})(\d{3,4})(\d{4})$/, "$1-$2-$3"));
    tel.href = "tel:" + p.tel;
    if (p.id === me) b.append(el("span", "나", "me"));
    const out = el("button", p.id === me ? "담당에서 빠지기" : "이 사람 빼기(교대)");
    out.onclick = async () => {
      if (!confirm(`${p.rank} ${p.name} 님을 담당에서 뺄까요? 지난 담당자로 남습니다.`)) return;
      try { await post("/leave", { id: p.id }); await load(); say("#pstate", "ok", "뺐습니다."); } catch (e) { say("#pstate", "bad", `빼지 못했습니다. ${e.message}`); }
    };
    row.append(b, tel);
    if (p.id !== me) { const mine = el("button", "이게 나입니다"); mine.onclick = () => { setMe(p.id); draw(d); }; row.append(mine); }
    row.append(out);
    return row;
  }) : [el("p", "아직 등록한 담당자가 없습니다. 아래에 본인을 등록해 주세요.", "hint")]));
  $("#join").hidden = d.people.length >= d.max;
  $("#joinhead").textContent = d.people.length ? "함께 맡는 사람 한 명 더 등록" : "본인 등록";
  $("#reply").querySelector("button").disabled = !me;
  if (!me) say("#rstate", "", d.people.length ? "위에서 본인을 고르거나 담당자로 등록하면 올릴 수 있습니다." : "담당자로 등록하면 올릴 수 있습니다.");
  else if ($("#rstate").className === "state ") say("#rstate", "", "");
  $("#log").replaceChildren(...(d.log.length ? d.log.map(x => {
    const li = el("li"), head = el("div", `${day(x.at)} · ${x.who}`, "at");
    li.append(head);
    if (x.kind === "ask") li.append(el("div", `상황실 요청: ${x.memo || "현장 조치 여부를 알려 주세요"}`, "ask"));
    else if (x.kind === "on") li.append(el("div", "담당자로 등록"));
    else if (x.kind === "off") li.append(el("div", "담당에서 빠짐"));
    else {
      li.append(el("div", `${ACT[x.action]} · 추가 배치 ${x.more === "yes" ? "필요함" : "필요 없음"}`));
      if (x.memo) li.append(el("div", x.memo));
      if (x.photo) { const im = el("img"); im.src = `${base}/photo/${x.id}`; im.alt = `${day(x.at)} 현장 사진`; im.loading = "lazy"; li.append(im); }
    }
    return li;
  }) : [el("li", "아직 기록이 없습니다.", "at")]));
  $("#pastbox").hidden = !d.past.length;
  $("#past").replaceChildren(...d.past.map(p => el("li", `${p.rank} ${p.name}`.trim() + ` · ${day(p.since)} ~ ${day(p.until)}`)));
}

async function load() {
  const r = await fetch(base + "/data");
  if (!r.ok) throw new Error();
  draw(await r.json());
}

$("#join").onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  try {
    setMe((await post("/join", { rank: f.rank.value, name: f.name.value, tel: f.tel.value })).id);
    f.reset(); await load(); say("#pstate", "ok", "등록했습니다.");
  } catch (err) { say("#pstate", "bad", `등록하지 못했습니다. ${err.message}`); }
};

$("#share").onclick = async () => {
  try {
    if (navigator.share) await navigator.share({ title: document.title, url: location.href });
    else { await navigator.clipboard.writeText(location.href); say("#pstate", "ok", "링크를 복사했습니다. 문자나 메신저에 붙여 보내세요."); }
  } catch {}
};

// 휴대폰 사진은 3~8MB — 긴 변 1600 으로 줄여 보낸다(데이터 · 시간 아끼기)
$("#shot").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    photo = c.toDataURL("image/jpeg", .8);
    $("#shotimg").src = photo; $("#shotimg").hidden = false; $("#shotlab").textContent = "사진 다시 찍기";
  } catch { say("#rstate", "bad", "사진을 읽지 못했습니다. 다시 찍어 주세요."); }
};

$("#reply").onsubmit = async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector("button"), action = f.action.value, more = f.more.value;
  if (!action || !more) return say("#rstate", "bad", !action ? "조치 여부를 골라 주세요." : "추가 배치가 필요한지 골라 주세요.");
  btn.disabled = true; say("#rstate", "", "올리는 중…");
  try {
    await post("", { id: me, action, more, memo: f.memo.value, photo });
    photo = null; f.reset(); $("#shotimg").hidden = true; $("#shotlab").textContent = "사진 찍기";
    await load(); say("#rstate", "ok", "올렸습니다. 상황이 바뀌면 다시 올려 주세요.");
  } catch (err) { say("#rstate", "bad", `올리지 못했습니다. ${err.message}`); }   // 고른 것 · 찍은 사진은 그대로 둔다
  btn.disabled = !me;
};

load().catch(() => { $("#name").textContent = "화면을 불러오지 못했습니다"; $("#addr").textContent = "연결을 확인하고 다시 열어 주세요."; });
</script>
</html>
