<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>현장 회신</title>
<!-- 지구 하나의 현장 페이지(app/reply.py) — 아래 탭 셋: 조치(강수 카드 · 단계 아이콘 · 상황실 요청 · 단계 단추 · 최근 기록) · 현재상황(비 숫자 · 앞으로 6시간 · 기준 · 지구 카드) · 인수인계(진행 전체 · 담당 교대).
     등록 없이 바로 누른다 — 문자를 받은 사람이 그 지구 담당자(?p= 받는 사람 자리). 오른쪽 위 이름표로 직급 · 성명을 고친다.
     ⚠️ 휴대폰 번호는 이 화면 어디에도 안 보인다(링크는 넘겨질 수 있다 — 번호는 상황실에서만).
     숫자는 서버(/data · /gauge — 상황판단과 같은 판정 줄)가 준 것을 그리기만 한다. 그림은 대시보드 읍면동 카드(막대 = 지금까지 + 앞으로 빗금, 꺾은선 = 지난 → 지금 → 예보)를 본떴다.
     비 오는 밖에서 한 손 · 장갑으로 — 밝은 바탕 · 터치 44px↑ · 바깥 자원 없음(글꼴 · 스크립트 · 그림을 받지 않는다, 그림은 인라인 SVG).
     ?pv=1 — 상황판단 미리보기 · 상황실 현황에서 연 것. 열람을 찍지 않고 단추도 안 눌린다. 미리보기는 부모 창이 보내는 요청 한 줄(postMessage)을 카드로 -->
<style>
:root { --ground: #EEF2F7; --panel: #FFFFFF; --line: #C9D4E1; --ink: #101821; --ink-2: #47596D; --accent: #1B6FA8; --on: #FFFFFF; --ok: #12805A; --bad: #B4401A; --warn: #8A5A00; --fc: #7FA9C9; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; overflow-x: hidden; }
main { max-width: 560px; margin: 0 auto; padding: 12px 12px calc(84px + env(safe-area-inset-bottom)); }
h1 { font-size: 22px; margin: 4px 0 0; }
h2 { font-size: 17px; margin: 0 0 10px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 0 12px; }
.hint { color: var(--ink-2); font-size: 16px; margin: 8px 0 0; }
.lab { font-weight: 600; font-size: 16px; padding: 0; margin: 0 0 8px; display: block; }
.opt { font-weight: 400; color: var(--ink-2); }
.at { color: var(--ink-2); font-size: 16px; }
button { min-height: 44px; padding: 0 14px; font: inherit; font-weight: 600; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button.go { width: 100%; min-height: 56px; border: 0; background: var(--ink); color: var(--on); font-weight: 700; }
button:disabled { opacity: .5; }
button.link { min-height: 44px; padding: 0; border: 0; background: none; color: var(--accent); font-weight: 600; text-decoration: underline; text-align: left; }
input[type=text], input[type=tel], textarea { width: 100%; min-height: 48px; font: inherit; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; margin-top: 6px; }
textarea { min-height: 72px; }
img { display: block; width: 100%; border-radius: 10px; margin: 8px 0; }
img[hidden] { display: none; }
details { margin-top: 8px; } summary { min-height: 44px; display: flex; align-items: center; color: var(--accent); font-weight: 600; cursor: pointer; }
.state { margin: 8px 0 0; font-weight: 700; min-height: 1.45em; }
.state.ok { color: var(--ok); } .state.bad { color: var(--bad); }
ol { list-style: none; margin: 0; padding: 0; }
/* 머리 — 지구 이름 · 주소(누르면 지도) · 오른쪽 이름표 */
.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.top > div { min-width: 0; }
#addr { font-size: 16px; color: var(--ink-2); text-decoration-color: var(--line); }
#mechip { flex: none; max-width: 46%; min-height: 48px; padding: 6px 12px; border-radius: 999px; font-size: 16px; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
#mechip small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.whoami { border: 2px solid var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
/* 탭 — 엄지가 닿는 아래에 고정 */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs button { min-height: 56px; border: 0; border-radius: 0; background: none; color: var(--ink-2); font-size: 16px; border-top: 3px solid transparent; }
.tabs button[aria-selected=true] { color: var(--accent); border-top-color: var(--accent); font-weight: 800; }
/* 강수 카드 — 대시보드 읍면동 카드 모양: 막대(지금까지 + 앞으로 빗금) · 꺾은선(지난 → 지금 → 예보) */
#rain { cursor: pointer; }
.rh { display: flex; align-items: center; gap: 10px; }
.rh svg.ic { flex: none; width: 48px; height: 48px; }
.rh .big { font-size: 34px; font-weight: 800; line-height: 1; } .rh .big small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.rh .sub { font-size: 12px; color: var(--ink-2); }
.rh .q { margin-left: auto; text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; }
.rh .q b { display: block; font-size: 20px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge { font-size: 14px; font-weight: 700; padding: 2px 8px; border-radius: 6px; border: 1.5px solid var(--bad); color: var(--bad); }
.badge.w { background: var(--bad); color: var(--on); }
.rb { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.rb .tr { position: relative; flex: 1; height: 14px; border-radius: 4px; background: var(--ground); overflow: hidden; }
.rb .tr i { position: absolute; top: 0; bottom: 0; }
.rb .tr i.a { left: 0; background: var(--accent); }
.rb .tr i.f { background: repeating-linear-gradient(135deg, var(--fc) 0 3px, transparent 3px 6px); border: 1px solid var(--fc); }
.rb b { font-size: 16px; white-space: nowrap; } .rb b small { color: var(--accent); font-weight: 700; }
.rl2 { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
svg.sp { display: block; width: 100%; height: 86px; margin-top: 8px; overflow: visible; }
/* 단계 아이콘 — 넘은 단계는 채운 색 + '필요' 글자 */
.stg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.stg div { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 4px; text-align: center; min-width: 0; }
.stg svg { width: 28px; height: 28px; display: block; margin: 0 auto 2px; }
.stg b { display: block; font-size: 16px; } .stg span { display: block; font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.stg .need { background: var(--bad); border-color: var(--bad); color: var(--on); } .stg .need span { color: var(--on); font-weight: 800; font-size: 16px; }
.stg .soon { border-color: var(--warn); } .stg .soon span { color: var(--warn); font-weight: 700; }
/* 상황실 요청 · 단추 */
.req { border: 2px solid var(--warn); }
.req .lab { color: var(--warn); font-weight: 700; margin: 0 0 4px; }
.req p { margin: 0; } .req .msg { font-size: 20px; font-weight: 700; line-height: 1.35; }
.req .at { margin-top: 4px; }
.stp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stp button { min-height: 56px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.stp button.next { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 800; }
.stp button.done { border-color: var(--ok); color: var(--ok); }
.stp small { font-size: 12px; font-weight: 500; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.mini button { min-height: 44px; padding: 0 2px; font-size: 16px; font-weight: 500; color: var(--ink-2); }
.shot { position: relative; display: flex; align-items: center; justify-content: center; min-height: 56px; border: 1.5px dashed var(--accent); border-radius: 10px; color: var(--accent); font-weight: 600; }
.shot input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.shot:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
#recent li { padding: 4px 0; font-size: 16px; border-top: 1px solid var(--line); } #recent li:first-child { border-top: 0; }
/* 현재상황 */
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nums div { text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; }
.nums b { display: block; font-size: 20px; } .nums span { font-size: 12px; color: var(--ink-2); }
svg.hb { display: block; width: 100%; height: 120px; }
.gs { margin: 10px 0 4px; }
.gs .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.gs .h em { font-style: normal; font-weight: 600; color: var(--ink-2); } .gs .h em.met { color: var(--bad); }
.gs .rl { color: var(--ink-2); font-size: 14px; margin: 2px 0 4px; }
.bar { position: relative; height: 12px; border-radius: 6px; background: var(--ground); border: 1px solid var(--line); margin-right: 16.6%; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); }
.bar i.met { background: var(--bad); }
.bar::after { content: "100%"; position: absolute; left: 100%; top: -4px; padding-left: 4px; font-size: 11px; color: var(--ink-2); border-left: 2px solid var(--ink); height: 18px; }
details.gs > summary { display: block; min-height: 44px; cursor: pointer; list-style: none; color: inherit; font-weight: inherit; }
details.gs > summary::-webkit-details-marker { display: none; }
details.gs > summary .h::after { content: "▾"; margin-left: 6px; color: var(--ink-2); } details.gs[open] > summary .h::after { content: "▴"; }
.gp { font-size: 14px; color: var(--ink-2); margin: 4px 0 0; }
.gsv { display: block; width: 100%; height: 64px; margin-top: 6px; }
.gm { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; }
.card dl { margin: 0; } .card dl div { display: grid; grid-template-columns: 76px 1fr; gap: 8px; padding: 4px 0; font-size: 16px; }
.card dt { color: var(--ink-2); } .card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.card dd.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card dd button.link { display: inline-flex; align-items: center; margin-right: 10px; }
.card > button { margin-top: 4px; color: var(--accent); border-color: var(--accent); }
#wxl p { margin: 0 0 4px; font-size: 14px; color: var(--ink-2); } #wxl p.al { color: var(--ink); font-weight: 700; font-size: 16px; }
/* 인수인계 */
.tl li { position: relative; padding: 0 0 14px 30px; }
.tl li::before { content: ""; position: absolute; left: 7px; top: 4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); }
.tl li::after { content: ""; position: absolute; left: 14px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.tl li:last-child::after { display: none; }
.tl li.done::before { background: var(--ok); border-color: var(--ok); }
.tl li.skip::before { border-style: dashed; }
.tl li.next::before { border-color: var(--accent); border-width: 4px; }
.tl li.next b { color: var(--accent); }
.tl b { display: block; } .tl span { color: var(--ink-2); font-size: 16px; }
.ev { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.ev li { padding: 6px 0; font-size: 16px; }
.ev li.x { text-decoration: line-through; color: var(--ink-2); }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.who:first-of-type { border-top: 0; padding-top: 0; }
.who b { flex: 1 1 100%; }
.me { font-size: 14px; font-weight: 600; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
.foot { color: var(--ink-2); font-size: 14px; text-align: center; margin: 8px 0 0; }
/* 지도 고르기 — 아래에서 올라오는 작은 판 */
#maps { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; margin: 0; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(16, 24, 33, .18); }
#maps a { display: flex; align-items: center; justify-content: center; min-height: 48px; margin: 6px 0; border: 1.5px solid var(--accent); border-radius: 10px; color: var(--accent); font-weight: 700; text-decoration: none; }
#maps p { margin: 0 0 6px; font-size: 16px; overflow-wrap: anywhere; }
#maps button { width: 100%; margin-top: 4px; }
</style>
<main>
  <header class="top"><div><h1 id="name">불러오는 중…</h1>
    <button type="button" class="link" id="addr" aria-label="지구 위치 — 지도 앱에서 보기"></button></div>
    <button type="button" id="mechip" hidden></button></header>
  <section class="whoami" id="whoami" hidden>
    <div class="line" id="wholine"></div>
    <form id="join" hidden>
      <h3 id="joinhead" style="font-size:16px;margin:0 0 8px"></h3>
      <div class="grid2">
        <label class="lab">직급<input type="text" name="rank" maxlength="20" autocomplete="organization-title"></label>
        <label class="lab">성명<input type="text" name="name" maxlength="20" autocomplete="name" required></label>
      </div>
      <label class="lab" style="margin-top:12px">휴대폰 번호 <span class="opt">(없어도 됩니다 — 비우면 문자를 받은 번호로)</span><input type="tel" name="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000"></label>
      <button class="go" style="margin-top:12px">이 이름으로 기록</button>
    </form>
    <p class="state" id="wstate" role="status"></p>
  </section>

  <div id="t-act" role="tabpanel" aria-labelledby="tb-act">
    <section id="rain" hidden role="link" tabindex="0" aria-label="지금 비 — 누르면 현재상황"></section>
    <section id="stg" hidden aria-label="지금 필요한 조치"></section>
    <section class="req" id="req" hidden></section>
    <section id="act">
      <div id="btns"></div>
      <p class="state" id="astate" role="status"></p>
      <details id="notebox"><summary>사진 · 메모 덧붙이기</summary>
      <form id="note">
        <span class="lab">방금 누른 것에 덧붙이기 <span class="opt">(없어도 됩니다)</span></span>
        <img id="shotimg" alt="보낼 현장 사진" hidden>
        <label class="shot"><input type="file" id="shot" accept="image/*" capture="environment"><span id="shotlab">사진 찍기</span></label>
        <label class="lab" style="margin-top:12px">덧붙일 말<textarea name="memo" maxlength="500" style="font-weight:400"></textarea></label>
        <button class="go" style="margin-top:8px">덧붙이기</button>
        <p class="state" id="nstate" role="status"></p>
      </form></details>
    </section>
    <section id="recentbox" hidden><h2>최근 기록</h2><ol id="recent"></ol><button type="button" class="link" id="allrec">전체 보기</button></section>
  </div>

  <div id="t-now" role="tabpanel" aria-labelledby="tb-now" hidden>
    <section id="nums" hidden></section>
    <section id="hours" hidden></section>
    <section id="std" hidden></section>
    <section class="card" id="card" hidden></section>
    <div id="wxl"></div>
  </div>

  <div id="t-log" role="tabpanel" aria-labelledby="tb-log" hidden>
    <section><h2>진행</h2><div id="tl"></div></section>
    <section id="people-box">
      <h2>등록한 담당자</h2>
      <div id="people"></div>
      <button id="add" style="width:100%;margin-top:8px">함께 맡는 사람 한 명 더 등록</button>
      <p class="state" id="pstate" role="status"></p>
      <button id="share" style="width:100%">이 링크를 다른 담당자에게 넘기기</button>
      <p class="hint">담당자는 2명까지입니다. 직급 · 성명은 이 링크를 가진 사람에게 보이고, 휴대폰 번호는 재난상황실에만 보입니다.</p>
    </section>
    <section id="pastbox" hidden><h2>지난 담당자</h2><ol id="past"></ol></section>
    <p class="foot">이 링크를 받은 분이 담당자로 기록됩니다.</p>
  </div>

  <section id="maps" hidden role="dialog" aria-modal="true" aria-label="지도 앱 고르기"></section>
</main>
<nav class="tabs" role="tablist" aria-label="화면 고르기">
  <button type="button" role="tab" id="tb-act" data-t="act" aria-controls="t-act">조치</button>
  <button type="button" role="tab" id="tb-now" data-t="now" aria-controls="t-now">현재상황</button>
  <button type="button" role="tab" id="tb-log" data-t="log" aria-controls="t-log">인수인계</button>
</nav>
<script>
const Q = new URLSearchParams(location.search), base = location.pathname.replace(/\/$/, ""), KEY = "me:" + base, PV = Q.has("pv"), P = Q.get("p") || "";
const $ = s => document.querySelector(s);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const svgEl = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };   // 숫자만 넣은 인라인 그림
const say = (id, cls, text) => { $(id).className = "state " + cls; $(id).textContent = text; };
const day = s => `${+s.slice(5, 7)}.${+s.slice(8, 10)}. ${s.slice(11)}`;
const ago = s => { const m = Math.max(0, Math.round((Date.now() - new Date(s.replace(" ", "T"))) / 60000)); return m < 60 ? `${m}분 전` : `${Math.floor(m / 60)}시간 ${m % 60}분 전`; };
const num = v => (v == null ? "—" : +(+v).toFixed(v >= 10 ? 0 : 1));
const LAB = { ack: "확인했습니다", doing: "조치 중", done: "조치 완료", na: "해당 없음", help: "지원 필요" };
let me = null, photo = null, D = null, G = null, PVNOTE = null, CARDOPEN = false, FORM = null;   // FORM — 이름 칸: fix(다시 입력) · add(한 명 더) · null
try { me = +localStorage.getItem(KEY) || null; } catch {}
const setMe = id => { me = id; try { id ? localStorage.setItem(KEY, id) : localStorage.removeItem(KEY); } catch {} };
const okKey = () => (me ? `u${me}` : P);
const setOk = () => { try { localStorage.setItem(KEY + ":ok", okKey()); } catch {} };

/* 탭 — 고른 것은 이 세션 동안만 기억 */
function tab(t) {
  document.querySelectorAll(".tabs [role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.t === t));
  for (const k of ["act", "now", "log"]) $(`#t-${k}`).hidden = k !== t;
  try { sessionStorage.setItem("tab:" + base, t); } catch {}
}
document.querySelectorAll(".tabs [role=tab]").forEach(b => { b.onclick = () => { tab(b.dataset.t); scrollTo(0, 0); }; });
tab((() => { try { return sessionStorage.getItem("tab:" + base) || "act"; } catch { return "act"; } })());

/* 지도 앱으로 — 웹 주소만(앱 전용 스킴은 앱이 없으면 죽는다). 좌표가 정확하면 좌표, 아니면 지명 검색. 개인정보는 넣지 않는다(지명 · 좌표만) */
function mapLinks(q, pos, name) {
  const e = encodeURIComponent;
  return [["카카오맵", pos ? `https://map.kakao.com/link/map/${e(name)},${pos[0]},${pos[1]}` : `https://map.kakao.com/link/search/${e(q)}`],
    ["네이버 지도", `https://map.naver.com/p/search/${e(q)}`],

/* 그림 — 서버(/gauge — 판정 줄)가 준 숫자만 */
const ICN = ["비 없음", "약한 비", "비", "강한 비"];

function spark(g) {                                              // 지난(실선) → 지금(세로 점선 · 점 · 값) → 예보(점선), 기준선(가로 점선 · 값)

  const top = Math.max(10, g.hline || 0, ...v) * 1.15, x = i => 4 + (i / (v.length - 1)) * (W - 8), y = p => T + (H - T) * (1 - p / top);
  const pts = (a, b) => v.slice(a, b + 1).map((p, k) => `${x(a + k).toFixed(1)},${y(p).toFixed(1)}`).join(" ");
  const tick = (i, t) => `<text x="${x(i)}" y="10" font-size="11" fill="#47596D" text-anchor="${i === 0 ? "start" : i === v.length - 1 ? "end" : "middle"}">${t}</text>`;
  return `<svg class="sp" viewBox="0 0 ${W} ${H}" role="img" aria-label="시간당 비 — 지난 ${past.length}시간, 지금 ${num(now)}㎜, 앞으로 ${nx.length}시간 예보${g.hline ? `, 기준 ${g.hline}㎜` : ""}">`

const STG_IC = {                                                 // 통제 = 막는 줄 · 사전대피 = 걷는 사람 · 긴급대피 = 느낌표 세모

function drawGauge(g) {

  const has = !!G;

/* 현재상황 탭 — 숫자 칸 · 앞으로 6시간 막대 · 기준 막대 · 특보 문장 */

      const w2 = el("details", null, "gs"), sm = el("summary"), h = el("div", null, "h"), bar = el("div", null, "bar"), i = el("i", null, c.met ? "met" : "");
      w2.open = GOPEN.has(name); w2.ontoggle = () => (w2.open ? GOPEN.add(name) : GOPEN.delete(name));   /* 처음에는 이름 · % · 막대만 — 누르면 기준 문구 · 조건별 값 */
      i.style.width = `${Math.min(100, c.unk ? 0 : c.pct)}%`;
      bar.append(i); bar.setAttribute("role", "img"); bar.setAttribute("aria-label", `${name} ${pc(c)}`);
      h.append(el("span", `${name} ${pc(c)}`), el("em", c.met ? "넘음" : note || "", c.met ? "met" : ""));
      sm.append(h, bar);
      w2.append(sm, el("div", rule, "rl"), ...parts.filter(q => q.now != null || q.need != null).map(q =>
        el("p", `${q.label || ""} ${q.now ?? "모름"} / ${q.need ?? "—"}${q.unit || ""}${q.pct != null ? ` (${q.pct}%)` : ""}`, "gp")));
      return w2;
    };
    const body = [el("h2", "기준까지")];
    body.push(...SG.map(k => one(k, g.st[k], g.st[k].rule, g.st[k].parts || [], g.st[k].eta ? `${g.st[k].eta}시쯤 닿음` : "")));
    if (g.site != null) body.push(one("지구 자체 기준", { pct: g.site, met: g.site >= 100 }, g.rule, g.site_slide ? [] : g.site_parts, g.site_slide ? (g.site >= 100 ? "산사태 예보 발령 중" : "발령 없음") : ""));
    const more = el("details", null, "gs"), msm = el("summary");
    msm.append(el("div", "앞으로 추이 · 계산 기준", "h"));
    more.open = GOPEN.has("more"); more.ontoggle = () => (more.open ? GOPEN.add("more") : GOPEN.delete("more"));
    more.append(msm);
    const tail = [];
    if (g.series.v.length > 1) {                                 // 앞으로 시간마다 가장 높은 단계 % — 작은 꺾은선, 100% 점선
      const v = g.series.v, top = Math.max(100, ...v) * 1.1, W = 300, H = 64, x = i => (i / (v.length - 1)) * W, y = p => H - (p / top) * H;
      tail.push(el("p", `앞으로 — ${g.series.t[0]}시 ${v[0]}% → ${g.series.t[v.length - 1]}시 ${v[v.length - 1]}% (점선 100%)`, "gp"),
        svgEl(`<svg class="gsv" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="앞으로 ${v.length}시간 — 가장 높은 단계 % ${v[0]}%에서 ${v[v.length - 1]}%">`
          + `<line x1="0" x2="${W}" y1="${y(100)}" y2="${y(100)}" stroke="#101821" stroke-dasharray="4 3" stroke-width="1"/>`
          + `<polyline fill="none" stroke="#1B6FA8" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${v.map((p, i) => `${x(i).toFixed(1)},${y(p).toFixed(1)}`).join(" ")}"/></svg>`));
    }
    tail.push(el("p", `${g.basis} 기준 · ${g.where === "지구" ? "이 지구 자리 비" : "읍면동에서 가장 많이 온 칸"} · ${g.at ? g.at.slice(11, 16) + " 계산" : ""} — 예보로 닿는 시각은 예보대로 올 때`, "gm"));
    more.append(...tail); body.push(more);
    box.replaceChildren(...body);
  }
  const hm = t => (t ? `${t.slice(8, 10)}:${t.slice(10, 12)}` : "");   // 특보 · 날씨 문장(서버 reply.weather) — 작은 글
  $("#wxl").replaceChildren(...(w.lines || []).map((t, i) => el("p", t, i === 0 && w.alerts?.length ? "al" : "")),
    ...(w.lines?.length ? [el("p", ["실황", w.tm && hm(w.tm), w.tmfc && `· 예보 ${hm(w.tmfc)} 발표`].filter(Boolean).join(" "))] : []));
}
const loadGauge = () => fetch(base + "/gauge").then(r => (r.ok ? r.json() : null)).then(drawGauge, () => drawGauge(null));
$("#rain").onclick = () => { tab("now"); scrollTo(0, 0); };
$("#rain").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#rain").click(); } };
$("#allrec").onclick = () => { tab("log"); scrollTo(0, 0); };

async function load() {
  const r = await fetch(base + "/data" + (P ? `?p=${encodeURIComponent(P)}` : ""));
  if (!r.ok) throw new Error();
  draw(await r.json());
}

$("#join").onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  try {
    const id = (await post("/join", { rank: f.rank.value, name: f.name.value, tel: f.tel.value, p: P, fix: FORM === "fix" })).id;
    if (FORM !== "add") { setMe(id); setOk(); }                     // 한 명 더는 이 휴대폰의 '나'를 바꾸지 않는다
    FORM = null; f.reset(); await load(); say("#wstate", "ok", "기록했습니다. 이제 이 이름으로 남습니다.");
  } catch (err) { say("#wstate", "bad", `기록하지 못했습니다. ${err.message}`); }
};

$("#add").onclick = () => { FORM = "add"; draw(D); scrollTo(0, 0); };

$("#share").onclick = async () => {
  const url = location.origin + base;                           // 미리보기 표시(?pv) · 받는 사람 자리(?p)는 넘기지 않는다
  try {
    if (navigator.share) await navigator.share({ title: document.title, url });
    else { await navigator.clipboard.writeText(url); say("#pstate", "ok", "링크를 복사했습니다. 문자나 메신저에 붙여 보내세요."); }
  } catch {}
};

// 휴대폰 사진은 3~8MB — 긴 변 1600 으로 줄여 보낸다(데이터 · 시간 아끼기)
$("#shot").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    photo = c.toDataURL("image/jpeg", .8);
    $("#shotimg").src = photo; $("#shotimg").hidden = false; $("#shotlab").textContent = "사진 다시 찍기";
  } catch { say("#nstate", "bad", "사진을 읽지 못했습니다. 다시 찍어 주세요."); }
};

$("#note").onsubmit = async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector("button");
  if (!f.memo.value.trim() && !photo) return say("#nstate", "bad", "덧붙일 말을 쓰거나 사진을 찍어 주세요.");
  btn.disabled = true; say("#nstate", "", "보내는 중…");
  try {
    await post("/note", { id: me, p: P, memo: f.memo.value, photo });
    photo = null; f.reset(); $("#shotimg").hidden = true; $("#shotlab").textContent = "사진 찍기";
    await load(); say("#nstate", "ok", "덧붙였습니다.");
  } catch (err) { say("#nstate", "bad", `보내지 못했습니다. ${err.message}`); }   // 쓴 말 · 찍은 사진은 그대로 둔다
  btn.disabled = false;
};

// 미리보기 — 부모 창(상황판단, 같은 출처)이 지금 쓰는 요청 한 줄을 보낸다. 기록은 남지 않는다
if (PV) addEventListener("message", ev => {
  if (ev.origin !== location.origin || ev.data?.type !== "gn-rp-note") return;
  PVNOTE = String(ev.data.note || "");
  if (D) draw(D);
});
(PV ? Promise.resolve() : post("/seen", {}).catch(() => {}))      // 열람 — 요청마다 한 번(서버가 가린다)
  .then(() => { loadGauge(); return load(); }).catch(() => { $("#name").textContent = "화면을 불러오지 못했습니다"; $("#addr").textContent = "연결을 확인하고 다시 열어 주세요."; });
setInterval(() => { if (D && !document.hidden) { load().catch(() => {}); loadGauge(); } }, 60000);   // 지난 시간 · 다른 담당자가 누른 것
</script>
</html>
