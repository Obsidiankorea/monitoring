<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>현장 회신</title>
<!-- 지구 하나의 현장 페이지(app/reply.py) — 지구 카드, 상황실 요청, 단계 단추(확인 → 조치 중 → 조치 완료, 한 번 = 스탬프 하나), 진행 단계 표.
     등록 없이 바로 누른다 — 문자를 받은 사람이 그 지구 담당자(?p= 받는 사람 자리로 누가 눌렀는지 안다). 등록 · 교대는 맨 아래 접어 둔다.
     비 오는 밖에서 한 손 · 장갑으로 — 밝은 바탕 · 큰 단추(56px↑) · 바깥 자원 없음(글꼴 · 스크립트를 받지 않는다).
     ?pv=1 — 상황판단 미리보기 · 상황실 현황에서 연 것. 열람을 찍지 않고 단추도 안 눌린다. 미리보기는 부모 창이 보내는 요청 한 줄(postMessage)을 카드로 -->
<style>
:root { --ground: #EEF2F7; --panel: #FFFFFF; --line: #C9D4E1; --ink: #101821; --ink-2: #47596D; --accent: #1B6FA8; --on: #FFFFFF; --ok: #12805A; --bad: #B4401A; --warn: #8A5A00; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
h1 { font-size: 22px; margin: 4px 0 0; }
.addr { color: var(--ink-2); margin: 0 0 16px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 0 0 16px; }
h2 { font-size: 17px; margin: 0 0 12px; }
.hint { color: var(--ink-2); font-size: 16px; margin: 8px 0 0; }
.req { border: 2px solid var(--warn); }
.req .lab { color: var(--warn); font-weight: 700; font-size: 16px; margin: 0 0 4px; }
.req p { margin: 0; } .req .msg { font-size: 21px; font-weight: 700; line-height: 1.35; }
.req .at { margin-top: 6px; }
.lab { font-weight: 600; font-size: 16px; padding: 0; margin: 0 0 8px; display: block; }
.opt { font-weight: 400; color: var(--ink-2); }
.shot { position: relative; display: flex; align-items: center; justify-content: center; min-height: 56px; border: 1.5px dashed var(--accent); border-radius: 10px; color: var(--accent); font-weight: 600; }
.shot input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.shot:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
img { display: block; width: 100%; border-radius: 10px; margin: 8px 0; }
img[hidden] { display: none; }
input[type=text], input[type=tel], textarea { width: 100%; min-height: 48px; font: inherit; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; margin-top: 6px; }
textarea { min-height: 72px; }
button { min-height: 56px; padding: 0 14px; font: inherit; font-weight: 600; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button.go { width: 100%; min-height: 56px; border: 0; background: var(--ink); color: var(--on); font-weight: 700; }
button.big { width: 100%; min-height: 76px; font-size: 22px; border: 0; background: var(--accent); color: var(--on); font-weight: 800; }
button:disabled { opacity: .5; }
.steps2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.side { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.side .undo { grid-column: 1 / -1; color: var(--ink-2); font-weight: 500; }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.who:first-of-type { border-top: 0; padding-top: 0; }
.who b { flex: 1 1 100%; } .who a { color: var(--accent); font-weight: 600; flex: 1; min-height: 48px; display: flex; align-items: center; }
.me { font-size: 14px; font-weight: 600; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
.state { margin: 10px 0 0; font-weight: 700; min-height: 1.45em; }
.state.ok { color: var(--ok); } .state.bad { color: var(--bad); }
ol { list-style: none; margin: 0; padding: 0; }
.at { color: var(--ink-2); font-size: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
/* 단계 표 — 지난 단계는 시각과 함께 채우고, 다음 단계를 강조 */
.tl li { position: relative; padding: 0 0 14px 30px; }
.tl li::before { content: ""; position: absolute; left: 7px; top: 4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); }
.tl li::after { content: ""; position: absolute; left: 14px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.tl li:last-child::after { display: none; }
.tl li.done::before { background: var(--ok); border-color: var(--ok); }
.tl li.skip::before { border-style: dashed; }
.tl li.next::before { border-color: var(--accent); border-width: 4px; }
.tl li.next b { color: var(--accent); }
.tl b { display: block; } .tl span { color: var(--ink-2); font-size: 16px; }
.ev { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.ev li { padding: 6px 0; font-size: 16px; }
.ev li.x { text-decoration: line-through; color: var(--ink-2); }
.card { margin: 0 0 16px; padding: 12px 16px; }
.card dl { margin: 0; } .card div { display: grid; grid-template-columns: 76px 1fr; gap: 8px; padding: 4px 0; font-size: 16px; }
.card dt { color: var(--ink-2); } .card dd { margin: 0; }
.card dd.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card button { min-height: 44px; margin-top: 4px; color: var(--accent); border-color: var(--accent); }
.foot { color: var(--ink-2); font-size: 14px; text-align: center; margin: 8px 0 0; }
details { margin-top: 12px; } summary { min-height: 48px; display: flex; align-items: center; color: var(--accent); font-weight: 600; cursor: pointer; }
</style>
<main>
  <h1 id="name">불러오는 중…</h1>
  <p class="addr" id="addr"></p>
  <section class="card" id="card" hidden></section>

  <section class="req" id="req" hidden></section>

  <section id="act">
    <h2>지금 상황 누르기</h2>
    <div id="btns"></div>
    <p class="state" id="astate" role="status"></p>
    <form id="note" hidden>
      <span class="lab">방금 누른 것에 덧붙이기 <span class="opt">(없어도 됩니다)</span></span>
      <img id="shotimg" alt="보낼 현장 사진" hidden>
      <label class="shot"><input type="file" id="shot" accept="image/*" capture="environment"><span id="shotlab">사진 찍기</span></label>
      <label class="lab" style="margin-top:12px">덧붙일 말<textarea name="memo" maxlength="500" style="font-weight:400"></textarea></label>
      <button class="go" style="margin-top:8px">덧붙이기</button>
      <p class="state" id="nstate" role="status"></p>
    </form>
  </section>

  <section><h2>진행</h2><div id="tl"></div></section>

  <details id="duty"><summary>담당이 바뀌었나요? — 담당자 등록 · 교대 · 링크 넘기기</summary>
  <section id="people-box">
    <h2>지금 담당자 <span class="opt">(등록은 교대 때만 — 안 해도 누를 수 있습니다)</span></h2>
    <div id="people"></div>
    <form id="join" hidden>
      <h3 id="joinhead" style="font-size:16px;margin:16px 0 8px"></h3>
      <div class="grid2">
        <label class="lab">직급<input type="text" name="rank" maxlength="20" autocomplete="organization-title"></label>
        <label class="lab">성명<input type="text" name="name" maxlength="20" autocomplete="name" required></label>
      </div>
      <label class="lab" style="margin-top:12px">휴대폰 번호<input type="tel" name="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" required></label>
      <button class="go" style="margin-top:12px">담당자로 등록</button>
    </form>
    <p class="state" id="pstate" role="status"></p>
    <button id="share" style="width:100%">이 링크를 다른 담당자에게 넘기기</button>
    <p class="hint">담당자는 2명까지입니다. 여기 넣은 직급 · 성명 · 번호는 이 링크를 가진 사람과 재난상황실에 보입니다.</p>
  </section>

  <section id="pastbox" hidden><h2>지난 담당자</h2><ol id="past"></ol></section>
  </details>
  <p class="foot">이 링크를 받은 분이 담당자로 기록됩니다.</p>
</main>
<script>
const Q = new URLSearchParams(location.search), base = location.pathname.replace(/\/$/, ""), KEY = "me:" + base, PV = Q.has("pv"), P = Q.get("p") || "";
const $ = s => document.querySelector(s);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const say = (id, cls, text) => { $(id).className = "state " + cls; $(id).textContent = text; };
const day = s => `${+s.slice(5, 7)}.${+s.slice(8, 10)}. ${s.slice(11)}`;
const ago = s => { const m = Math.max(0, Math.round((Date.now() - new Date(s.replace(" ", "T"))) / 60000)); return m < 60 ? `${m}분 전` : `${Math.floor(m / 60)}시간 ${m % 60}분 전`; };
const LAB = { ack: "확인했습니다", doing: "조치 중", done: "조치 완료", na: "해당 없음", help: "지원 필요" };
let me = null, photo = null, D = null, PVNOTE = null, CARDOPEN = false;
try { me = +localStorage.getItem(KEY) || null; } catch {}
const setMe = id => { me = id; try { id ? localStorage.setItem(KEY, id) : localStorage.removeItem(KEY); } catch {} };

async function post(path, body) {
  const r = await fetch(base + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "연결을 확인하고 다시 눌러 주세요");
  return r.json();
}

/* 단계 표 — 서버(reply.rounds)가 센 것을 그리기만 한다(상황판단 · 현황 화면도 같은 목록) */
function tlList(r) {
  const ol = el("ol", null, "tl");
  for (const s of r.steps) {
    const li = el("li", null, s.st);
    li.append(el("b", s.label), el("span", s.st === "done" ? [s.t, s.who, s.plus ? `+${s.plus}분` : ""].filter(Boolean).join(" · ")
      : s.st === "skip" ? "건너뜀" : s.st === "next" ? "다음 단계" : ""));
    ol.append(li);
  }
  const ev = el("ol", null, "ev");
  for (const x of r.ev) {
    if (x.k === "view") continue;
    const li = el("li", `${x.t} · ${x.who ? x.who + " · " : ""}${x.label}${x.x ? " (취소됨)" : ""}${x.memo ? " — " + x.memo : ""}`, x.x ? "x" : "");
    if (x.photo) { const im = el("img"); im.src = `${base}/photo/${x.id}`; im.alt = `${x.t} 현장 사진`; im.loading = "lazy"; li.append(im); }
    ev.append(li);
  }
  const box = el("div");
  box.append(ol);
  if (ev.children.length) box.append(ev);
  return box;
}

function draw(d) {
  D = d;
  document.title = d.name + " — 현장 회신";
  $("#name").textContent = d.name; $("#addr").textContent = d.addr;
  if (!d.people.some(p => p.id === me)) setMe(null);            // 내가 빠졌거나 다른 휴대폰
  // 지구 카드 — 위키 우려지역 표(공개 자료). 긴 대피기준은 두 줄까지, 펼치기
  const c = d.card || {}, rows = [["유형", c.kind], ["대피기준", c.rule], ["대피장소", c.shelter]].filter(x => x[1]);
  $("#card").hidden = !rows.length;
  const dl = el("dl");
  dl.append(...rows.map(([k, v]) => {
    const div = el("div"), dd = el("dd", v, k === "대피기준" ? (CARDOPEN ? "rule" : "rule clip") : "");
    div.append(el("dt", k), dd);
    return div;
  }));
  $("#card").replaceChildren(dl);
  const clip = $("#card dd.rule");
  if (clip && (CARDOPEN || clip.scrollHeight > clip.clientHeight + 2)) {
    const more = el("button", CARDOPEN ? "접기" : "펼치기");
    more.onclick = () => { CARDOPEN = !CARDOPEN; draw(D); };
    $("#card").append(more);
  }
  const r = d.rounds[0], a = r?.ask;
  $("#req").hidden = !a && PVNOTE == null;
  if (PVNOTE != null) $("#req").replaceChildren(el("p", "상황실 요청 — 보내기 전 미리보기", "lab"), el("p", PVNOTE, "msg"), el("p", "보내면 이 글이 요청으로 남습니다", "at"));
  else if (a) $("#req").replaceChildren(el("p", "상황실 요청", "lab"), el("p", a.memo, "msg"), el("p", `요청 ${day(a.at)} · ${ago(a.at)}`, "at"));
  // 단추 — 다음 단계가 가장 크게. 한 번 = 기록 한 줄
  const nx = r?.steps.find(s => s.st === "next")?.k, main = LAB[nx] ? nx : null, rest = ["ack", "doing", "done"].filter(k => k !== main);
  const btn = (k, cls) => { const b = el("button", LAB[k], cls); b.disabled = PV; b.onclick = () => press(k); return b; };   // 등록 없이 바로 — 미리보기만 막는다
  const two = el("div", null, "steps2"), side = el("div", null, "side");
  two.append(...rest.map(k => btn(k)));
  const un = el("button", "방금 누른 것 취소", "undo"); un.disabled = PV; un.onclick = () => press("undo");
  side.append(btn("na"), btn("help"), un);
  $("#btns").replaceChildren(...(main ? [btn(main, "big")] : [el("p", r?.now === "조치 완료" ? "조치 완료로 기록되어 있습니다. 상황이 바뀌면 다시 누르세요." : "", "hint")]), two, side);
  $("#tl").replaceChildren(...(d.rounds.length ? [tlList(r), ...d.rounds.slice(1).map(x => {
    const dt = el("details");
    dt.append(el("summary", `지난 요청 ${x.ask ? day(x.ask.at) : "요청 없이"} — ${x.now}`), tlList(x));
    return dt;
  })] : [el("p", "아직 기록이 없습니다.", "at")]));
  $("#people").replaceChildren(...(d.people.length ? d.people.map(p => {
    const row = el("div", null, "who"), b = el("b", `${p.rank} ${p.name}`.trim()), tel = el("a", p.tel.replace(/^(\d{3})(\d{3,4})(\d{4})$/, "$1-$2-$3"));
    tel.href = "tel:" + p.tel;
    if (p.id === me) b.append(el("span", "나", "me"));
    const out = el("button", p.id === me ? "담당에서 빠지기" : "이 사람 빼기(교대)");
    out.onclick = async () => {
      if (!confirm(`${p.rank} ${p.name} 님을 담당에서 뺄까요? 지난 담당자로 남습니다.`)) return;
      try { await post("/leave", { id: p.id }); await load(); say("#pstate", "ok", "뺐습니다."); } catch (e) { say("#pstate", "bad", `빼지 못했습니다. ${e.message}`); }
    };
    row.append(b, tel);
    if (p.id !== me) { const mine = el("button", "이게 나입니다"); mine.onclick = () => { setMe(p.id); draw(d); }; row.append(mine); }
    row.append(out);
    return row;
  }) : [el("p", "등록한 담당자가 없습니다 — 문자를 받은 분이 담당자로 기록됩니다. 담당이 바뀌었을 때만 아래에 등록하세요.", "hint")]));
  $("#join").hidden = d.people.length >= d.max;
  $("#joinhead").textContent = d.people.length ? "함께 맡는 사람 한 명 더 등록" : "본인 등록";
  $("#pastbox").hidden = !d.past.length;
  $("#past").replaceChildren(...d.past.map(p => el("li", `${p.rank} ${p.name}`.trim() + ` · ${day(p.since)} ~ ${day(p.until)}`)));
}

async function press(step) {
  try {
    const j = await post("/stamp", { id: me, p: P, step });
    await load();
    const as = { ack: "확인으로", doing: "조치 중으로", done: "조치 완료로", na: "해당 없음으로", help: "지원 필요로", undo: "방금 누른 것 취소로" };
    say("#astate", "ok", `${j.at.slice(11)} ${as[step]} 기록했습니다.`);
    $("#note").hidden = step === "undo";
  } catch (e) { say("#astate", "bad", `기록하지 못했습니다. ${e.message}`); }
}

async function load() {
  const r = await fetch(base + "/data");
  if (!r.ok) throw new Error();
  draw(await r.json());
}

$("#join").onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  try {
    setMe((await post("/join", { rank: f.rank.value, name: f.name.value, tel: f.tel.value })).id);
    f.reset(); await load(); say("#pstate", "ok", "등록했습니다. 이 휴대폰에서 누르면 이 이름으로 기록됩니다.");
  } catch (err) { say("#pstate", "bad", `등록하지 못했습니다. ${err.message}`); }
};

$("#share").onclick = async () => {
  const url = location.origin + base;                           // 미리보기 표시(?pv)는 넘기지 않는다
  try {
    if (navigator.share) await navigator.share({ title: document.title, url });
    else { await navigator.clipboard.writeText(url); say("#pstate", "ok", "링크를 복사했습니다. 문자나 메신저에 붙여 보내세요."); }
  } catch {}
};

// 휴대폰 사진은 3~8MB — 긴 변 1600 으로 줄여 보낸다(데이터 · 시간 아끼기)
$("#shot").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    photo = c.toDataURL("image/jpeg", .8);
    $("#shotimg").src = photo; $("#shotimg").hidden = false; $("#shotlab").textContent = "사진 다시 찍기";
  } catch { say("#nstate", "bad", "사진을 읽지 못했습니다. 다시 찍어 주세요."); }
};

$("#note").onsubmit = async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector("button");
  if (!f.memo.value.trim() && !photo) return say("#nstate", "bad", "덧붙일 말을 쓰거나 사진을 찍어 주세요.");
  btn.disabled = true; say("#nstate", "", "보내는 중…");
  try {
    await post("/note", { id: me, p: P, memo: f.memo.value, photo });
    photo = null; f.reset(); $("#shotimg").hidden = true; $("#shotlab").textContent = "사진 찍기";
    await load(); say("#nstate", "ok", "덧붙였습니다.");
  } catch (err) { say("#nstate", "bad", `보내지 못했습니다. ${err.message}`); }   // 쓴 말 · 찍은 사진은 그대로 둔다
  btn.disabled = false;
};

// 미리보기 — 부모 창(상황판단, 같은 출처)이 지금 쓰는 요청 한 줄을 보낸다. 기록은 남지 않는다
if (PV) addEventListener("message", ev => {
  if (ev.origin !== location.origin || ev.data?.type !== "gn-rp-note") return;
  PVNOTE = String(ev.data.note || "");
  if (D) draw(D);
});
(PV ? Promise.resolve() : post("/seen", {}).catch(() => {}))      // 열람 — 요청마다 한 번(서버가 가린다)
