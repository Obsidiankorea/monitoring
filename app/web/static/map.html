    <dt>누적 날짜 지정</dt><dd>누적 구간(카드 설명을 누르거나 설정 › 오른쪽 패널)에서 날짜(오늘 · 어제 · 그제 … — 처음엔 어제)와 몇 시부터를 고르고 '부터' — 예 어제 18시부터 지금까지. 오늘부터 7일 앞까지</dd>
    <dt>패널 가득</dt><dd>위 카드 머리의 네 귀 단추 · <code>G</code> — 지금 오는 비 · 예측 상위를 감추고 위 카드가 패널을 다 쓴다. 다시 누르면 돌아온다</dd>
    <dt>줄에 마우스</dt><dd>지도에 그 시군 · 지점 · 칸까지 선이 그어진다</dd>
    <dt>관측소에 마우스</dt><dd>실측과 그 칸 격자 값, 차이(격자 − 관측)</dd>
    <dt>관측소 오른쪽 클릭</dt><dd>비활성화 — 주변과 동떨어진 AWS(고장 · 막힘)를 계산에서 뺀다. AWS 면은 둘레 관측소로 다시 메우고 강수 누적 카드 ·
      지금 오는 비에서도 빠진다(종합 화면도). 점은 회색 · 빨간 빗금. 다시 오른쪽 클릭하거나 설정 › 관측소 목록에서 다시 켠다</dd>
    <dt>왼쪽 위 제목</dt><dd>누르면 층 메뉴 — 실측(15분 · 1시간 · 누적) · 예측(초단기 · 단기 오늘/내일). ↑↓ · Enter, 숫자 <code>1</code>~<code>6</code> 도 된다.
      실측 머리의 <b>자료</b>(격자 500m | AWS, <code>B</code>)가 1시간 · 누적 층과 오른쪽 '강수 누적' 카드를 같이 바꾼다. 1시간 줄의 '5km 실황'은 동네예보 실황</dd>
    <dt>지도 위치 <code>C</code></dt><dd>오른쪽 위 십자 단추 — 판 위를 끌어 옮기고 휠로 키우고 줄인다(두 번 누르기 · <code>0</code> = 처음대로, <code>Enter</code> · <code>Esc</code> = 끝).
      이 화면(브라우저)에 기억한다 — 바다 위젯 · 패널을 두고 경남을 어디에 놓을지. 시군을 골라 확대하면 그 틀이 먼저, 풀면 이 틀로</dd>
    <dt>특보 줄</dt><dd>왼쪽 특보 아이콘 — 아이콘들 밑에 얇게 세로로 펼친다(지도 왼쪽 빈자리, 지도가 그 오른쪽으로 비켜 선다). 바다 · 예비(태풍 등, 발효 예상 날짜 · 시간대) · 예정까지.
      같은 종류는 한 줄 — 어디는 관제순, 나뉜 군의 세부구역은 윗첨자(함양<sup>서북부</sup>). 머리 밑 <b>예비</b> 체크를 끄면 예비특보를 숨긴다.
      머리를 끌어 옮긴다(위로 올려 아이콘을 덮어도 된다 — 불투명, 두 번 누르면 제자리). ✕ 나 아이콘을 누르면 접힌다</dd>
    <dt>화면 재생 <code>P</code></dt><dd>오른쪽 위 화면 단추 — 여러 화면을 차례로(화면보호기처럼). 재생목록 창에서 화면(누적 지난 N시간(7일까지) · N시부터 · 날짜 지정(며칠 전 몇 시부터) · 오늘/어제 0시부터 · 1시간 · 15분 · 흐름 재생 · 초단기 · 오늘/내일 24시까지)을
      누르거나 끌어 넣고, 끌어서 차례, 줄마다 값과 시간. 같은 종류도 여럿. 누적 · 단기는 줄마다 <b>범례</b>를 체크하면 그 화면만 따로 끝 눈금(30~800㎜) —
      72시간 누적과 내일 24시까지를 같은 자로. 저장하면 어느 화면에서나 불러온다. 재생 중엔 아래 점 — 누르면 그 화면, 올리면 멈춤 · 고치기 · 끝(<code>Esc</code>).
      재생 중 바꾸는 층 · 구간은 이 화면에서만(다른 화면 설정은 그대로)</dd>
    <dt>바다 위젯 <code>W</code></dt><dd>지도 위 반투명 판 — 예측 상위(초단기 6시간) · 지금 오는 비 · 시군 평균을 머리 탭으로 고른다(<code>W</code> 는 차례로, 끝은 끔). 특보는 왼쪽 특보 줄에.
      <b>시군 평균</b>은 지금 지도 층(그 구간 · 그 시각)의 18개 시군 면 평균 — 넓은 판은 경남 모양 타일 지도와 경남 평균, 길쭉한 판은 많은 순. 색은 지도 범례.
      자리는 스스로 찾는다 — 경남 땅을 가장 적게 덮는 빈자리, 좁고 길면 세로로 길쭉한 꼴로. 머리를 끌어 옮기면 마지막으로 놓은 자리가 이 화면의 기본 자리(두 번 누르면 다시 자동),
      <code>⇔</code> · <code>⇕</code> 로 꼴을 바꾼다. 두 탭은 같은 크기 — 지금 오는 비는 장소 + 60분 시우량 칩(테두리가 시우량 색).
      머리의 <code>⟳</code> 은 세 탭을 저절로 차례로(화면 재생과 따로, 머리 밑 가는 줄이 다음 탭까지) · 오른쪽 클릭은 돌리기 간격 · 예측 상위 시군당 1곳/2곳</dd>
    <dt>강수 누적 막대 누르기</dt><dd>막대 색이 바뀐다 — 한 색 ↔ <b>지도 범례 색조</b>(값마다 메인 지도의 그 범주 색 — 자동 · 고정 눈금, 청색 · 기상청 · 다양한 색조 그대로).
      줄의 이름 · 선 그래프를 누르면 전처럼 시군 고르기. 모든 화면이 같이(서버 설정)</dd>
    <dt>강수 누적 1h</dt><dd>줄 맨 오른쪽 — 최근 1시간 강수량. 바탕 없이 왼쪽 막대만 시우량 색, 많이 올수록 글자가 밝고 굵다(20㎜ 넘으면 흰 글자). 0 이면 흐리게. 막대 빗금과 같이 <code>H</code> 로 켜고 끈다</dd>
    <dt>색 — 약한 비는 바탕에 가깝게</dt><dd>0.1 · 1㎜ 처럼 거의 안 온 곳은 땅(바탕) 색에 가깝게 칠해 묻히고, 오는 곳만 밝게 솟는다(청색 · 기상청 색 둘 다).
      기상청 색으로 보면 누적은 눈금을 열 칸 남짓으로 잘게 나눠 하늘 · 파랑 · 초록 · 노랑 · 주황 · 빨강 · 보라가 다 나온다</dd>
    <dt>오른쪽 위 아이콘</dt><dd>십자 = 지도 위치(<code>C</code>) · 창 = 오른쪽 패널(<code>L</code>) · ? = 이 창 · 톱니 = 설정. 설정 › 화면에서 항상 · 마우스를 움직이면 · 숨김(제목 메뉴 아래에도 있다)</dd>
    <dt>데모</dt><dd>설정 › 데모 — 실황 · 테스트(합성, <code>T</code>) · 재현 사례(지난 호우).
      테스트에서 시군을 누르면 내부망(경남 AWS)에서 보일 지점 목록 모양을 합성 지점으로 미리 본다</dd>
    <dt>ⓘ</dt><dd>레이어 · 범례 옆 <code>i</code> 에 올리거나 누르면 설명이 뜬다(누르면 고정, 밖을 누르면 닫힘)</dd>
    <dt>누적 눈금은 자동</dt><dd>누적(격자 · AWS)은 자료 크기에 맞춰 일곱 자(끝 15 · 30 · 60 · 120 · 250 · 500 · 800㎜) 중 하나를 고른다 —
      경남 시군 최대 중 가장 큰 값이 끝 눈금 근처에 오게. 커지면 곧바로, 작아지면 다 들 때 바뀐다. 범례 밑 '자동 눈금 · 최대'. 재현 사례는 고정</dd>
    <dt>범례 색 띠 누르기 · 오른쪽 클릭</dt><dd>청색 → 기상청 색 → 다양한 색조 차례로(오른쪽 클릭 메뉴 '지도 색' · 설정 › 화면에서 바로 고른다).
      시간 강수(60분 · 실황 · 초단기, 15분은 ×4)는 기상청 색 · 다양한 색조 모두 레이더와 같은 ㎜/h 경계.
      누적은 기상청 색이 열 칸 남짓, <b>다양한 색조</b>는 QPF 범례 색을 다 써(한 색에 서너 색조) 스무 칸 남짓 · 끝 눈금이 자료를 바짝 따른다.
      레이더 색의 노랑 · 빨강 · 보라는 특보 선 색과 겹친다. <code>?pal=kma</code> · <code>?pal=rich</code> 로 고정</dd>
    <dt>레이어</dt><dd>왼쪽 위. 기상특보 <code>A</code> · 관측소 <code>S</code> · 지점 강수량 글자 <code>V</code>(관측소를 켰을 때, 기본은 끔 — 점 색만으로도 단계가 읽힌다)</dd>
    <dt>층 · 재생</dt><dd><code>1</code>~<code>6</code> 층 · <code>B</code> 자료(격자 ↔ AWS) · <code>Space</code> 재생 · <code>←</code><code>→</code> 한 장씩 · <code>L</code> 패널 · <code>G</code> 위 카드 가득 · <code>R</code> AWS 실시간 감시 · <code>Q</code> 아래에 초단기예측 이미지 · <code>W</code> 바다 위젯 · <code>C</code> 지도 위치 · <code>P</code> 화면 재생 · <code>T</code> 테스트.
      AWS 로 재생하면 지난 시간은 AWS 1시간 면(정시마다), 지금 뒤는 초단기</dd>
    <dt>주소로 고정</dt><dd><code>?layer=obs60</code> · <code>?ov=alerts,stations</code> · <code>?sig=창원</code> · <code>?basis=grid</code> · <code>?pal=kma</code> · <code>?case=geoje-20260816</code> — 벽면 화면을 한 상태로 둘 때</dd>
    <dt>설정 · 도움말</dt><dd><code>Ctrl</code>+<code>,</code> 설정 · <code>?</code> 이 창</dd></dl>`;
  return tab === "terms" ? terms : tab === "how" ? how : src;
}

/* ⓘ — 올리면 설명이 뜨고, 누르면 고정(다시 누르거나 밖을 누르면 닫힌다). 벽면 터치에서도 읽히게.
   ⚠️ #pop 에 zoom(--k)이 걸려 있어 left·top 도 그만큼 곱해진다 — 나눠 둔다(재생 막대와 같다). */
let POP_PIN = null;
function showPop(el, pin) {
  const html = TIPS.get(el.dataset.tip);
  if (!html) return;
  const p = $("pop"), k = V?.k || 1, r = el.getBoundingClientRect();
  p.innerHTML = html;
  p.classList.toggle("pin", !!pin);
  p.hidden = false;
  p.style.left = (r.right + 10) / k + "px"; p.style.top = (r.top - 4) / k + "px";
  const pr = p.getBoundingClientRect();
  if (pr.right > innerWidth - 8) p.style.left = Math.max(8, r.left - 10 - pr.width) / k + "px";
  if (pr.bottom > innerHeight - 8) p.style.top = Math.max(8, innerHeight - 8 - pr.height) / k + "px";
  document.querySelectorAll(".inf.pin").forEach(x => x.classList.remove("pin"));
  if (pin) el.classList.add("pin");
  POP_PIN = pin ? el : null;
}
function hidePop() {
  $("pop").hidden = true; POP_PIN = null;
  document.querySelectorAll(".inf.pin").forEach(x => x.classList.remove("pin"));
}
document.addEventListener("mouseover", ev => { const el = ev.target.closest?.(".inf"); if (el && !POP_PIN) showPop(el, false); });
document.addEventListener("mouseout", ev => {
  const el = ev.target.closest?.(".inf");
  if (el && !POP_PIN && !el.contains(ev.relatedTarget)) hidePop();
});
// 잡는 단계에서 — ⓘ 가 레이어 줄(label) 안에 있어 누르면 체크가 바뀌고, 범례 머리에 있으면 접힌다. 그걸 막는다
document.addEventListener("click", ev => {
  const el = ev.target.closest?.(".inf");
  if (el) { ev.preventDefault(); ev.stopPropagation(); POP_PIN === el ? hidePop() : showPop(el, true); return; }
  if (POP_PIN && !ev.target.closest?.("#pop")) hidePop();
}, true);

/* ── 설정(Ctrl+,) — 서버에 둔다(어느 PC 에서 열어도 같게) ─────────────────── */
/* 설정을 탭으로 — 머리글(h4)마다 한 탭. 길어서 화면 밖으로 잘리던 것을 나눈다. 고른 탭은 기억한다 */
let PF_TAB = 0;
function prefTabs() {
  const box = $("prefs").querySelector(".box"), top = box.querySelector(".top");
  const panes = [];
  let cur = null;
  for (const el of [...box.children]) {
    if (el === top) continue;
    if (el.tagName === "H4") { cur = document.createElement("div"); cur.className = "pane"; panes.push([el.textContent, cur]); el.remove(); continue; }
    if (cur) cur.appendChild(el);
  }
  if (PF_TAB >= panes.length) PF_TAB = 0;
  const bar = document.createElement("div");
  bar.className = "tabs";
  bar.innerHTML = panes.map(([t], i) => `<button data-tab="${i}" class="${i === PF_TAB ? "on" : ""}">${t}</button>`).join("");
  const body = document.createElement("div");
  body.className = "panes";
  panes.forEach(([, el], i) => { el.hidden = i !== PF_TAB; body.appendChild(el); });
  top.after(bar, body);
  bar.onclick = ev => {
    const b = ev.target.closest("[data-tab]");
    if (!b) return;
    PF_TAB = +b.dataset.tab;
    bar.querySelectorAll("button").forEach((x, i) => x.classList.toggle("on", i === PF_TAB));
    panes.forEach(([, el], i) => { el.hidden = i !== PF_TAB; });
    if (panes[PF_TAB][0] === "업데이트") loadUpd(true);   // 탭을 열 때마다 GitHub 를 다시 본다(종합 화면과 같다)
  };
  // 업데이트 탭에서 다시 열면 — 처음이면 확인, 아니면 기억해 둔 것을 그대로(설정을 바꿀 때마다 GitHub 를 부르지 않게)
  if (panes[PF_TAB]?.[0] === "업데이트" && !UPD.pc && !UPD.loading) loadUpd(true);
}
function openPrefs() {

  $("prefs").innerHTML = `<div class="box" role="dialog" aria-label="설정">

    <div class="row"><span class="k"></span><span class="note">예측(초단기)은 1시간 간격뿐이다 — 10분 대상시각을 주면 가까운 정시 격자가 온다.
      자료가 AWS 면 실측도 정시마다(경남 AWS 가 정시 자료다) — 이 간격은 격자에만 걸린다.</span></div>

/* 오른쪽 위 도구 — 이 화면(브라우저)마다 기억. 기본은 '마우스를 움직이면'(벽면 화면이 깔끔하게) */
let TOOLS = "auto", TOOLS_T = null;
try { TOOLS = localStorage.getItem("gn-map-tools") || "auto"; } catch {}
function setTools(v) {
  TOOLS = v;
  try { localStorage.setItem("gn-map-tools", v); } catch {}
  document.body.classList.toggle("tools-hide", v === "hide");
  document.body.classList.toggle("tools-auto", v === "auto");
}
setTools(TOOLS);
function toolsWake() {                    // 잠깐(2.5초) 보였다가 다시 숨는다
  if (TOOLS !== "auto") return;
  document.body.classList.add("moving");
  clearTimeout(TOOLS_T);
  TOOLS_T = setTimeout(() => document.body.classList.remove("moving"), 2500);
}
document.addEventListener("pointermove", toolsWake);
toolsWake();                               // 처음 뜰 때 한 번 보여 준다 — 거기 있다는 걸 알게
function closePrefs() { $("prefs").hidden = true; }
$("prefs").addEventListener("click", ev => { if (ev.target.id === "prefs") closePrefs(); });

/* ── 업데이트 — 종합 화면 설정 › 업데이트와 같은 API(app/update.py · app/serverupdate.py) ──
   이 PC: /api/update(git fetch) → /api/update/pull(--ff-only) → 화면만이면 새로고침, 파이썬이면 /api/update/restart(run.bat 이 다시 띄운다).
   서버(언레이드 도커): /api/server-update 에 부탁만 한다(state/update/request) — 1분마다 도는 예약 작업이 deploy.sh 로 갱신.
   ⚠️ 확인 실패를 '최신'으로 읽지 않는다 — 인터넷이 막힌 PC 에서 '최신이다'라고 적으면 거짓말이 된다.
   ⚠️ 설정창은 무엇을 누를 때마다 통째로 다시 그린다(openPrefs) — 그래서 상태를 UPD 에 두고 updHtml 이 거기서 그린다 */
const UPD = { srv: null, pc: null, loading: false, msg: "", smsg: "", wait: null };
const escH = t => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
function updHtml() {
  const row = (k, v) => `<div class="row"><span class="k">${k}</span><span class="uv">${v}</span></div>`;
  let h = "";
  const s = UPD.srv;
  if (s?.available) {
    const busy = s.deploying || s.requested, L = s.last;
    h += `<div class="usub">서버(언레이드)</div>`
      + row("지금 판", `<code>${escH(s.version || s.running || "—")}</code>`)
      + row("GitHub", s.remote ? `<code>${escH(s.remote)}</code> <span class="hint">${escH(s.checked_at || "")} 확인</span>` : `<span class="warnx">확인 못 함</span>`)
      + (s.behind ? row("새 판", `<b>${s.behind}개</b> 밀려 있다<div class="hint">${(s.commits || []).map(c =>
          `<div>· <code>${escH(c.h)}</code> ${escH(c.at)} ${escH(c.s)}</div>`).join("")}</div>`)
        : s.remote ? row("상태", "최신이다") : "")
      + (s.updater_stale ? row("주의", `<span class="warnx">갱신 장치가 ${Math.round(s.updater_age_s / 60)}분째 조용하다</span>
          <div class="hint">언레이드 예약 작업이 안 돈다 — <code>bash …/deploy/unraid/updater.sh --install</code></div>`) : "")
      + (busy ? row("진행", `<b>${s.deploying ? "갱신 중… (1~2분, 화면이 잠깐 끊긴다)" : "부탁함 — 1분 안에 시작한다"}</b>`) : "")
      + (L ? row("마지막 갱신", `${L.ok ? "" : `<span class="warnx">실패</span> `}${escH(L.done || L.at)} → <code>${escH(L.version)}</code>
          <details><summary class="hint">기록</summary><pre class="hint">${escH(L.log)}</pre></details>`) : "")
      + row("", `<button class="ubtn" data-upd="srv-check"${busy ? " disabled" : ""}>다시 확인</button><button class="ubtn pri" data-upd="srv-go"${
          busy || s.updater_stale ? " disabled" : ""}>서버 갱신</button><span class="hint">${escH(UPD.smsg || "GitHub 최신 판으로 다시 빌드해 띄운다(시연 :8001 도)")}</span>`);
  }
  const u = UPD.pc;
  if (!u) return h + row("", `<span class="note">${UPD.loading ? "확인하는 중…" : "—"}</span>`);

function valueAt(gx, gy) {
  if (!CUR) return undefined;
  const g = META.grids;
  let c, r;
  if (CUR.grid === "hr") { c = Math.round(gx) - g.hr.i0; r = Math.round(gy) - g.hr.j0; }
  else {
    const [A, B, C] = g.dfs_to_hr.col, [Dd, E, F] = g.dfs_to_hr.row, det = A * E - B * Dd;
    const x = gx - C, y = gy - F;
    c = Math.round((E * x - B * y) / det) - g.dfs.i0;
    r = Math.round((A * y - Dd * x) / det) - g.dfs.j0;
  }
  if (c < 0 || r < 0 || c >= CUR.w || r >= CUR.h) return undefined;
  return CUR.u[r * CUR.w + c];
}

  const inHr = c >= 0 && r >= 0 && c < hb.w && r < hb.h;

  tip.hidden = false;

const QPF_R = 950 / 800;                                  // 서버가 잘라 둔 그림 비율(경남 광역)

function qzApply(save) {
  const b = $("qpf-box"), W = b.clientWidth || 1, H = b.clientHeight || 1;
  if (QZ.z == null) { QZ.z = qzCover(); QZ.fx = (1 - QZ.z) / 2; QZ.fy = (1 - QZ.z) / 2; }
  QZ.z = Math.max(1, Math.min(8, QZ.z));
  QZ.fx = Math.min(0, Math.max(1 - QZ.z, QZ.fx));         // 판 밖으로 끌려 나가지 않게
  QZ.fy = Math.min(0, Math.max(1 - QZ.z, QZ.fy));

{
  const view = $("qpf-view"), box = $("qpf-box");
  box.addEventListener("wheel", ev => {
    ev.preventDefault(); ev.stopPropagation();
    if (QZ.z == null) qzApply();
    const r = box.getBoundingClientRect(), cx = (ev.clientX - r.left) / r.width, cy = (ev.clientY - r.top) / r.height;
    const z1 = Math.max(1, Math.min(8, QZ.z * (ev.deltaY < 0 ? 1.15 : 1 / 1.15)));
    QZ.fx = cx - (cx - QZ.fx) * z1 / QZ.z;                // 커서 밑 자리가 그대로 남게
    QZ.fy = cy - (cy - QZ.fy) * z1 / QZ.z;
    QZ.z = z1;

    if (ev.button !== 0) return;

    if (o.mode === "server") ORIGIN_BADGE = `<span class="badge srv" title="자료를 서버(${o.url})에서 받는 중 — 종합 화면 설정 › 자료">서버</span>`;
  } catch {}
}
let ORIGIN_BADGE = "";
async function boot() {
  applyTheme();
  await originBadge();
  try {
    [META, TOPO, GEO, SITES] = await Promise.all([getJson("/api/grid/meta"),
      getJson("/api/grid/geo/gyeongnam.topo.json"), getJson("/api/grid/geo/grids.json"),
      getJson("/api/grid/geo/stations.json").catch(() => null)]);    // 없어도 지도는 뜬다(관측소 층만 빈다)
    SITEBY = new Map((SITES?.stations || []).map(s => [s.stn, s]));
    MSIG = new Uint8Array(await (await fetch("/api/grid/geo/mask_sigun.u8.gz")).arrayBuffer());
  } catch (e) {
    $("empty").innerHTML = `지도를 띄울 수 없다<small>${e.message}</small>`;
    $("empty").className = "fail"; $("empty").hidden = false;
    return;
  }
  FEAT = topojson.feature(TOPO, TOPO.objects.sigun).features;
  SET = { ...SET_DEFAULT, ...(META.setting || {}) };
  if (CASE) {
    try { await loadCase(); }
    catch (e) {
      $("empty").innerHTML = `사례를 띄울 수 없다<small>${e.message}</small>`;
      $("empty").className = "fail"; $("empty").hidden = false;
      return;
    }
    // 끝(전부 쌓인 모습)에서 연다 — 재생하면 처음부터 쌓여 간다. ?tm= 이면 그 시각(봉우리 등)
    OBS_TM = CASEM.frames.includes(Q.get("tm")) ? Q.get("tm") : CASEM.end;
  }
  // 누적 카드 기준 — 실황은 서버 설정(기본 AWS), 사례는 격자에서 연다. ?basis= 가 먼저
  ACC_BASIS = ["aws", "grid"].includes(Q.get("basis")) ? Q.get("basis") : CASE ? "grid" : (SET.acc_basis || "aws");
  SELS = (Q.get("sig") || "").split(",").filter(x => ORDER_GN().includes(x)).slice(0, SEL_MAX);   // ?sig=함양,거창 — 고른 채로
  OV = new Set(Q.has("ov") ? Q.get("ov").split(",").filter(Boolean)
               : CASE ? ["alerts"] : (SET.overlays || []));
  renderLayers();
  vsrtN = +SET.vsrt_n || 1; x4 = !!SET.x4;
  applyAccFull(); applyHdrPin();
  // 색 — ?pal=kma|blue 가 서버 설정보다 먼저(벽면 화면 고정용). 기상청 색은 서버가 뽑아 둔 범례를 받아 와야 쓴다
  PAL = ["kma", "blue", "rich"].includes(Q.get("pal")) ? Q.get("pal") : ["kma", "rich"].includes(SET.pal) ? SET.pal : "blue";
  if (PAL !== "blue") await loadKmaLegend();
  tlOn = Q.has("tl") ? Q.get("tl") === "1" : (CASE || selOn()) ? true : !!SET.tl_on;
  let want = Q.get("layer") || (CASE ? "acc" : SET.layer) || "obs60";   // URL 이 서버 설정보다 먼저다(화면 고정용)
  if (want === "obsday" && !CASE) want = "acc";                          // 예전 '오늘 누적' — 이제 카드 구간을 따르는 누적
  if (want.startsWith("vsrt")) { kind = "vsrt"; const n = +want.replace(/\D/g, ""); if (n >= 1 && n <= 6) vsrtN = n; }
  else kind = KINDS.includes(want) ? want : "obs60";
  if (!CASE) {
    if (Q.get("layer") && !Q.get("basis") && SRC_OF[kind]) ACC_BASIS = SRC_OF[kind];   // ?layer=aws60 → AWS
    else kind = normKind(kind);
  }
  GNB = gnBounds();
  layout();
  await show();
  applyTL(false);                       // 범례가 그려진 뒤에 지도 비켜설 자리를 다시 잰다
  await loadFlow();
  setInterval(refreshMeta, 30000);
  // 카드·특보는 종합 화면처럼 1분마다 다시 읽는다(DB 만 읽는다 — 기상청 호출은 늘지 않는다)
  setInterval(() => { if (!test) { loadCards(); loadAlerts(); } if (qpfOn() && !SET.acc_full) loadQpf(); }, 60000);
  loadAlerts();
  if (!CASE) showResume();               // 화면 재생 — 이 브라우저가 돌리던 목록을 이어서
  // 웹 글꼴이 늦게 오면 카드 높이가 바뀐다 — 다 오면 한 번 더 잰다(누적 카드가 아래를 비운 채 굳지 않게)
  document.fonts?.ready?.then(() => { if (CARDS && !CARDS.err && tlOn && SET.panel !== "timeline") renderCards(); });
  if (Q.has("help")) openHelp(["src", "terms", "how"].includes(Q.get("help")) ? Q.get("help") : "src");   // ?help= — 도움말을 연 채로(안내용 링크)
}
boot();
</script>
