}

/* ── 머리 ─────────────────────────────────────────────────────────── */
const hm = t => t ? `${t.slice(8, 10)}:${t.slice(10, 12)}` : "—";
const md = t => t ? `${+t.slice(4, 6)}.${+t.slice(6, 8)}.` : "";
function when(gr) {
  if (!gr || !gr.tm) return "";
  const t = gr.tm;
  switch (kind) {
    case "acc": {
      // 첫 칸은 그 앞 한 시간 몫이다(01:00 = 00~01시) — 시작은 한 시간 앞으로 적는다
      const f0 = gr.from ? new Date(tOf(gr.from) - 3600e3) : null;
      const fs = f0 ? `${f0.getMonth() + 1}.${f0.getDate()}. ${String(f0.getHours()).padStart(2, "0")}:00` : "";
      return `${fs}부터 ${md(t)} ${hm(t)}까지`;
    }
    case "obs15": return `${md(t)} ${hm(t)} · 15분`;
    case "obs60": return `${md(t)} ${hm(t)} · 60분`;
    case "obsday": return `${md(t)} 00:00~${hm(t)}`;
    case "odam": return `${md(t)} ${hm(t)} · 1시간`;
    case "vsrt": return `${hm(gr.tmfc)} 발표 → ${+t.slice(8, 10)}시까지 1시간 (+${vsrtN}h)`;
    default: {
      const [a, b] = gr.hours || [];
      const from = a ? +a.slice(8, 10) - 1 : "", to = b ? (+b.slice(8, 10) || 24) : "";
      return `${gr.tmfc ? +gr.tmfc.slice(8, 10) + "시 발표 · " : ""}${md(t)} ${from}~${to}시 합`;
    }
  }
}
function isPast() {                     // 일부러 지난 시각을 보는 중 — 지연이 아니다
  return !CASE && (pinned(kind) || (kind === "obs60" && OBS_TM && OBS_TM !== metaOf("obs60").tm));
}
function paintHead() {
  const L = metaOf(kind);
  $("lname").textContent = L.label || kind;
  $("ltime").textContent = when(CUR);
  $("lsrc").textContent = test ? "합성 격자 — 실제 자료 아님" : (L.src || "");
  const b = [];
  const past = isPast();
  if (CASE) b.push(`<span class="badge past">재현 · ${CASEM?.title || CASE}</span>`);
  else if (test) b.push(`<span class="badge test">테스트</span>`);
  else if (pinned(kind)) b.push(`<span class="badge past">지난 시각 보기 (tm=${PIN_TM})</span>`);
  else if (past) b.push(`<span class="badge past">지난 시각</span>`);
  else {
    const col = META?.collect?.[COLLECT_OF[kind]];
    if (col && !col.ok) b.push(`<span class="badge warn" title="${(col.detail || "").replace(/"/g, "'")}">수집 실패 · 마지막 정상 ${col.ok_at ? col.ok_at.slice(11, 16) : "없음"}</span>`);
    if (L.stale) b.push(`<span class="badge warn">자료 지연${L.age_min != null ? ` · ${Math.round(L.age_min)}분 전` : ""}</span>`);
    if (CUR && +CUR.capped > 0) b.push(`<span class="badge" title="단기예보 PCP 는 30 에서 막힌다 — 30㎜ 이상">30㎜ 이상 든 칸 ${CUR.capped} · 합계는 하한</span>`);
  }
  if (kind === "obs15" && x4) b.push(`<span class="badge">×4 환산</span>`);
  $("badges").innerHTML = b.join(" ");
  $("stage").classList.toggle("late", !test && !past && !!L.stale);
  $("testrib").hidden = !test;
  $("stage").classList.toggle("test", test);
  $("b-test").classList.toggle("on", test);
  $("b-tl").classList.toggle("on", tlOn);
}

/* ── 메뉴 ─────────────────────────────────────────────────────────── */
function buildMenu() {
  const grp = (label, ks) => `<div class="grp"><span class="gl">${label}</span>${ks.map(k => {
    const L = metaOf(k);
    const cls = [k === kind ? "on" : "", !L.tm ? "none" : "", L.stale ? "late" : ""].join(" ");
    const tip = `${L.label || k} — ${L.src || ""}${L.stale ? " · 자료 지연" : ""}${!L.tm ? " · 아직 없음" : ""}`;
    return `<button data-k="${k}" class="${cls}" title="${tip}">${L.short || k}</button>`;
  }).join("")}</div>`;
  $("menu").innerHTML = CASE ? grp("재현", KINDS) : grp("실측", KINDS.slice(0, 4)) + grp("예측", KINDS.slice(4));
  for (const b of $("menu").querySelectorAll("button"))
    b.onclick = () => { stopPlay(); choose(b.dataset.k, true); };
}

function saveSetting(body) {
  if (CASE) return;                       // 재현을 보는 동안 고른 것은 실황 설정에 남기지 않는다
  fetch("/api/settings/map", { method: "PUT", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body) }).catch(() => {});
}

/* ── 자료 ─────────────────────────────────────────────────────────── */
/* ?tm=YYYYMMDDHHMI — 실측 층을 그 시각으로 본다(점검용. 남아 있는 사흘 안에서만). */
const PIN_TM = !CASE && /^\d{12}$/.test(Q.get("tm") || "") ? Q.get("tm") : null;
const pinned = key => PIN_TM && !test && ["obs15", "obs60", "obsday", "odam"].includes(key);
function reqTm(key) {
  if (CASE) return OBS_TM || CASEM?.end || null;
  if (key === "obs60" && OBS_TM) return OBS_TM;
  return pinned(key) ? PIN_TM : null;
}
function qs(key, tm) {
  const p = new URLSearchParams();
  if (tm) p.set("tm", tm);
  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  const s = p.toString();
  return s ? "?" + s : "";
}
function wantTm(key) {
  if (CASE) return "case:" + CASE;
  const k = key.startsWith("vsrt") ? "vsrt" : key;
  return metaOf(k).tm || "";
}
const ckOf = (key, tm) => key + "|" + (tm || "") + "|" + (test ? "test" : wantTm(key));
async function fetchGrid(key, tm) {
  const ck = ckOf(key, tm);
  if (GRIDS.has(ck)) return GRIDS.get(ck);
  const r = await fetch(`/api/grid/${encodeURIComponent(key)}${qs(key, tm)}`, { cache: "no-cache" });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
  const buf = await r.arrayBuffer();
  const [h, w] = r.headers.get("X-Grid-Shape").split(",").map(Number);
  const hd = n => r.headers.get("X-Grid-" + n);
  const gr = { ck, key, u: new Uint16Array(buf), h, w, grid: r.headers.get("X-Grid"),
               tm: hd("Tm"), tmfc: hd("Tmfc"), capped: hd("Capped"), from: hd("From"),
               hours: hd("Hours") ? hd("Hours").split(",") : null };
  if (gr.u.length !== h * w) throw new Error("격자 크기가 맞지 않는다");
  if (GRIDS.size > 200) GRIDS.delete(GRIDS.keys().next().value);
  GRIDS.set(ck, gr);
  return gr;
}
async function fetchStat(key, tm) {
  const ck = ckOf(key, tm);
  if (STATS.has(ck)) return STATS.get(ck);
  const p = new URLSearchParams({ layer: key });
  if (tm) p.set("tm", tm);
  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  const j = await getJson(`/api/grid/sigun?${p}`);
  if (STATS.size > 200) STATS.delete(STATS.keys().next().value);
  STATS.set(ck, j);
  return j;
}

let SEQ = 0, SWITCH_MS = 0;
async function show(fade = false) {
  const my = ++SEQ, t0 = performance.now(), key = layerKey(), tm = reqTm(kind);
  buildMenu(); buildLegend();
  try {
    const [gr, st] = await Promise.all([fetchGrid(key, tm), fetchStat(key, tm)]);
    if (my !== SEQ) return;                     // 그새 다른 층을 골랐다
    CUR = gr; CURSTAT = st;
    $("empty").hidden = true;
  } catch (e) {
    if (my !== SEQ) return;
    CUR = null; CURSTAT = null;
    const col = META?.collect?.[COLLECT_OF[kind]];
    const fail = col && !col.ok;
    $("empty").className = fail ? "fail" : "";
    $("empty").innerHTML = (fail ? "조회 실패" : "아직 받은 격자가 없다")
      + `<small>${e.message}${col ? ` · 수집 ${col.tried_at ? col.tried_at.slice(11, 16) : "—"} ${col.detail || ""}` : ""}</small>`;
    $("empty").hidden = false;
  }
  if (CASE && CASEM && CUR) {
    // 사례는 시각마다 특보(산출)·카드 내용이 바뀐다 — 프레임과 함께 다시 그린다
    if (OV.has("alerts")) { ALERTS = caseAlerts(); drawAlerts(); renderAlertLegend(); }
  }
  loadStations();                        // 기억해 둔 시각이면 곧바로(같은 틱에) 바뀐다 — 격자와 함께 넘어간다
  draw(fade);
  paintHead();
  buildPlay();
  tlPlayhead();
  if (CASE && CASEM && CUR && tlOn && SET.panel !== "timeline") loadCards();
  cardsPlayhead();
  SWITCH_MS = performance.now() - t0;
  if (Q.get("debug") === "1") {
    $("dbg").hidden = false;
    $("dbg").textContent = `전환 ${SWITCH_MS.toFixed(1)}ms · 그리기 ${RENDER_MS.toFixed(1)}ms · ${V.W}×${V.H} dpr ${V.dpr} · 칸 ${V.s.toFixed(2)}px`;
  }
  window.__mapPerf = { switch: SWITCH_MS, render: RENDER_MS };
}

function choose(k, save) {
  kind = k;
  if (!CASE) OBS_TM = null;              // 메뉴로 고르면 늘 '지금'(사례는 보던 시각 그대로)
  if (save) saveSetting(k === "vsrt" ? { layer: "vsrt", vsrt_n: vsrtN } : { layer: k });
  show();
}

/* ── 재생 흐름 ────────────────────────────────────────────────────── */
async function loadFlow() {
  const p = new URLSearchParams({ hours: SET.flow_hours, step: SET.flow_step });
  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  try { FLOW = await getJson(`/api/grid/flow?${p}`); }
  catch { FLOW = null; }
  if (FLOW) {
    FLOW.tt = FLOW.frames.map(f => tOf(f.t));
    FLOW.t0 = Math.min(tOf(FLOW.start), ...FLOW.tt);
    FLOW.t1 = Math.max(tOf(FLOW.now), ...FLOW.tt);
    FLOW.tn = tOf(FLOW.now);
  }
  buildPlay(); buildTL(); tlPlayhead();
  if (test) loadCards();                 // 테스트 카드는 합성 흐름에서 뽑는다 — 지도와 같은 값
  preloadFlow();
}
/* 지금 보는 프레임의 시각(ms) — 흐름 밖 층이면 null */
function headT() {
  if (!FLOWK.has(kind) || !CUR || !CUR.tm) return null;
  return tOf(CUR.tm);
}
function nearestFrame(t) {
  if (!FLOW || !FLOW.frames.length) return -1;
  let best = 0, bd = Infinity;
  FLOW.tt.forEach((x, i) => {
    // 같은 거리면 '지금' 앞은 실측, 뒤는 예측을 고른다
    const d = Math.abs(x - t) + (FLOW.frames[i].kind === "fcst" ? (t <= FLOW.tn ? 1 : -1) : 0);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function curFrame() {
  const t = headT();
  if (t == null || !FLOW) return -1;
  // 같은 시각이라도 층이 맞는 프레임을 고른다(사례는 실측뿐이다)
  const i = FLOW.frames.findIndex(f => (CASE || kind === "obs60" ? f.kind === "obs" : f.kind === "fcst" && f.n === vsrtN)
    && tOf(f.t) === t);
  return i >= 0 ? i : nearestFrame(t);
}
function seek(i, fade = true) {
  if (!FLOW || i < 0 || i >= FLOW.frames.length) return;
  const f = FLOW.frames[i];
  if (CASE) {
    OBS_TM = f.t;                         // 사례는 고른 층(1시간/누적) 그대로 시각만 옮긴다
  } else if (f.kind === "obs") {
    kind = "obs60";
    OBS_TM = f.t === metaOf("obs60").tm ? null : f.t;
  } else {
    kind = "vsrt"; vsrtN = f.n; OBS_TM = null;
  }
  show(fade);
}
function startPlay() {
  if (!FLOW || !FLOW.frames.length) return;
  stopPlay(true);
  let i = curFrame();
  playing = setInterval(() => {
    i = (i + 1) % FLOW.frames.length;
    seek(i);
  }, SET.play_ms);
  buildPlay();
}
function stopPlay(quiet) {
  if (playing) { clearInterval(playing); playing = null; if (!quiet) buildPlay(); }
}
async function preloadFlow() {
  if (!FLOW) return;
  for (const f of FLOW.frames) {
    const key = CASE ? kind : f.kind === "obs" ? "obs60" : f.layer;
    const tm = CASE ? f.t : f.kind === "obs" && f.t !== metaOf("obs60").tm ? f.t : null;
    try { await Promise.all([fetchGrid(key, tm), fetchStat(key, tm)]); } catch {}
  }
}

/* 재생 막대 — 지난 실측(틱마다 한 장) │지금│ 예측(시간마다 한 장). 끌어서 옮긴다.
   막대는 흐름이 바뀔 때만 새로 그리고, 재생 중에는 손잡이와 글자만 옮긴다(그래야 미끄러진다). */
const fmtH = t => String(new Date(t).getHours()).padStart(2, "0");
const TRK = { Wt: 640, Ht: 46, padX: 10 };
const trkX = t => TRK.padX + (t - FLOW.t0) / Math.max(1, FLOW.t1 - FLOW.t0) * (TRK.Wt - 2 * TRK.padX);
function playHead() {
  const p = $("play");
  if (p.hidden || !FLOW) return;
  const ht = headT(), i = curFrame(), f = i >= 0 ? FLOW.frames[i] : null;
  const x = ht != null ? trkX(ht) : -40;
  for (const el of p.querySelectorAll(".trk-head, .trk-knob")) el.style.transform = `translateX(${x.toFixed(1)}px)`;
  p.querySelector(".lab").innerHTML = !f ? `<b>—</b><small>흐름 밖</small>`
    : CASE ? `<b>${md(f.t)} ${hm(f.t)}</b><small>재현 · ${kind === "acc" ? "처음부터 누적" : "지난 1시간"}</small>`
    : f.kind === "obs" ? `<b>${hm(f.t)}</b><small>실측 · 지난 1시간</small>`
    : `<b>+${f.n}h ${fmtH(tOf(f.t))}시</b><small class="fc">예측 · 초단기</small>`;
  $("b-pp").textContent = playing ? "❚❚" : "▶";
}
function buildPlay() {
  const p = $("play");
  if (!FLOWK.has(kind) || !FLOW || !FLOW.frames.length) { p.hidden = true; p.dataset.sig = ""; return; }
  p.hidden = false;
  const sig = `${FLOW.now}|${FLOW.frames.length}|${FLOW.step}|${FLOW.hours}|${document.documentElement.dataset.theme}`;
  if (p.dataset.sig === sig) { playHead(); return; }
  p.dataset.sig = sig;
  const { Wt, Ht } = TRK, x = trkX;
  const xn = x(FLOW.tn);
  const ticks = FLOW.tt.map((t, i) => `<line class="trk-tick" x1="${x(t)}" x2="${x(t)}" y1="${FLOW.frames[i].kind === "obs" ? 14 : 12}" y2="24"/>`).join("");
  let hours = "";
  const h0 = new Date(FLOW.t0); h0.setMinutes(0, 0, 0);
  const span = (FLOW.t1 - FLOW.t0) / 3600e3, every = span > 14 ? 3 : span > 8 ? 2 : 1;
  for (let t = h0.getTime() + 3600e3; t <= FLOW.t1; t += 3600e3)
    if (new Date(t).getHours() % every === 0 && Math.abs(x(t) - xn) > 18)
      hours += `<text class="trk-hour" x="${x(t)}" y="40">${fmtH(t)}</text>`;
  const padX = TRK.padX;
  p.innerHTML = `<button class="pp" id="b-pp" title="재생 (Space)">▶</button>
    <svg id="trk" class="noanim" width="${Wt}" height="${Ht}" viewBox="0 0 ${Wt} ${Ht}">
      <defs><pattern id="fc-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="6" height="6" style="fill:color-mix(in oklab, var(--accent) 10%, transparent)"/>
        <line x1="0" y1="0" x2="0" y2="6" style="stroke:color-mix(in oklab, var(--accent) 40%, transparent)" stroke-width="2"/></pattern></defs>
      <rect class="trk-past" x="${padX}" y="14" width="${Math.max(0, xn - padX)}" height="10" rx="3"/>
      <rect class="trk-fc" x="${xn}" y="14" width="${Math.max(0, Wt - padX - xn)}" height="10" rx="3"/>
      ${ticks}
      <line class="trk-now" x1="${xn}" x2="${xn}" y1="4" y2="30"/>
      <text class="trk-nowl" x="${xn}" y="42">${NOWL}</text>
      ${hours}
      <line class="trk-head" x1="0" x2="0" y1="6" y2="30"/><circle class="trk-knob" cx="0" cy="19" r="7"/>
    </svg>
    <div class="lab"></div>`;
  $("b-pp").onclick = () => playing ? stopPlay() : startPlay();
  playHead();
  requestAnimationFrame(() => requestAnimationFrame(() => $("trk") && $("trk").classList.remove("noanim")));
  const trk = $("trk");
  const at = ev => {
    const r = trk.getBoundingClientRect();
    const xx = (ev.clientX - r.left) / r.width * Wt;
    return FLOW.t0 + (xx - padX) / (Wt - 2 * padX) * (FLOW.t1 - FLOW.t0);
  };
  let drag = false, last = -1;
  const go = ev => { const i2 = nearestFrame(at(ev)); if (i2 !== last) { last = i2; seek(i2); } };
  trk.onpointerdown = ev => { drag = true; stopPlay(); trk.setPointerCapture(ev.pointerId); last = -1; go(ev); };
  trk.onpointermove = ev => { if (drag) go(ev); };
  trk.onpointerup = () => { drag = false; };
}

/* ── 강수 타임라인(오른쪽 사이드바) ────────────────────────────────────
   시군마다 한 줄: 지난 실측(실선·면) │지금│ 예측(점선) — 지도와 같은 프레임, 같은 값.
   세로선(재생 위치)과 줄마다 점·오른쪽 값이 지도와 함께 움직인다. 점 색은 지도의 색 단계 그대로. */
let TLG = null;                          // 그린 틀(재생 위치만 바꿀 때 쓴다)
function tlWidth() {
  return Math.round(Math.min(Math.max(560 * V.k, V.W * 0.34), V.W * 0.46));
}
function applyTL(animate = true) {
  if (!V) return;
  const w = tlWidth();
  document.documentElement.style.setProperty("--tlw", w + "px");
  document.body.classList.toggle("tl-on", tlOn);
  const cards = SET.panel !== "timeline";
  document.body.classList.toggle("panel-cards", cards);
  document.body.classList.toggle("panel-tl", !cards);
  let tx = 0, ty = 0, sc = 1;
  if (tlOn) {
    // 지도가 비켜설 자리: 범례 오른쪽 ~ 사이드바 왼쪽. 모자라면 살짝 줄인다
    const lg = $("legend").getBoundingClientRect(), st = $("stage").getBoundingClientRect();
    const left = Math.max(16, lg.right - st.left + 10), right = V.W - w - 16;
    const mw = (V.X1 - V.X0) * V.s, avail = right - left;
    sc = Math.min(1, avail / mw);
    tx = left + (avail - mw * sc) / 2 - sc * V.ox;
    ty = (1 - sc) * V.H / 2;
  }
  MT = { tx, ty, sc };
  const mw = $("mapwrap");
  if (!animate) mw.style.transition = "none";
  mw.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${sc.toFixed(4)})`;
  if (!animate) { void mw.offsetWidth; mw.style.transition = ""; }
  // 재생 막대는 지도 가운데 아래로. ⚠️ 막대에 zoom(--k)이 걸려 있어 left 도 그만큼 곱해진다 — 나눠 둔다
  const cx = tlOn ? (V.W - w) / 2 : V.W / 2;
  $("stage").style.setProperty("--playx", (cx / V.k).toFixed(0) + "px");
  if (tlOn && !cards) buildTL();
  if (tlOn && cards) { if (CARDS) renderCards(); else loadCards(); }
  drawRanks();
  link(null);
}
function setTL(on, save = true) {
  tlOn = on;
  if (save) saveSetting({ tl_on: on });
  applyTL(true);
  paintHead();
}

function buildTL() {
  const svg = $("tl-svg");
  $("tl-stat").textContent = SET.tl_stat === "mean" ? "평균" : "최대";
  $("tl-sub").textContent = `시군 ${SET.tl_stat === "mean" ? "평균" : "최대"} 1시간 강수량 · 지난 ${SET.flow_hours}시간 → +6시간`;
  if (!tlOn || !V) return;
  const box = svg.getBoundingClientRect();
  const W = box.width, H = box.height;
  if (!W || !H) return;
  const k = V.k;
  if (!FLOW || !FLOW.frames.length) {
    svg.innerHTML = `<text class="tl-empty" x="${W / 2}" y="${H / 2}" style="font-size:${15 * k}px">재생할 자료가 아직 없다 — 수집이 쌓이면 나타난다</text>`;
    TLG = null; return;
  }
  const stat = SET.tl_stat === "mean" ? "mean" : "max";
  const rowsD = [{ name: "경남", tot: true, v: FLOW.total[stat] }]
    .concat(FLOW.series.map(s => ({ name: s.sigun, v: s[stat] })));
  const nameW = 66 * k, valW = 78 * k, axisH = 30 * k, padR = 14 * k;
  const x0 = nameW + 14 * k, x1 = W - valW - padR;
  const rh = (H - axisH - 8 * k) / rowsD.length;
  const xT = t => x0 + (t - FLOW.t0) / Math.max(1, FLOW.t1 - FLOW.t0) * (x1 - x0);
  let vmax = 10;
  for (const r of rowsD) for (const v of r.v) if (v != null && v > vmax) vmax = v;
  const xn = xT(FLOW.tn);
  const out = [];
  // 예측 쪽 바탕, 시각 눈금, '지금'
  out.push(`<rect class="tl-fczone" x="${xn}" y="${axisH - 6 * k}" width="${x1 - xn + padR / 2}" height="${H - axisH}"/>`);
  const h0 = new Date(FLOW.t0); h0.setMinutes(0, 0, 0);
  const span = (FLOW.t1 - FLOW.t0) / 3600e3, every = span > 14 ? 3 : span > 8 ? 2 : 1;
  for (let t = h0.getTime() + 3600e3; t <= FLOW.t1; t += 3600e3) {
    const xx = xT(t);
    // '지금'·'실측'·'예측' 글자와 겹치는 눈금은 뺀다
    if (new Date(t).getHours() % every === 0 && Math.abs(xx - xn) > 22 * k
        && xx - x0 > 34 * k && x1 - xx > 34 * k)
      out.push(`<text class="tl-hour" x="${xx}" y="${axisH - 12 * k}" style="font-size:${12 * k}px">${fmtH(t)}</text>`);
  }
  out.push(`<text class="tl-zl" x="${x0}" y="${axisH - 12 * k}" style="font-size:${11 * k}px" text-anchor="start">실측</text>`);
  out.push(`<text class="tl-zl" x="${x1}" y="${axisH - 12 * k}" style="font-size:${11 * k}px" text-anchor="end">예측</text>`);
  out.push(`<text class="tl-nowl" x="${xn}" y="${axisH - 12 * k}" style="font-size:${12 * k}px">${NOWL}</text>`);
  out.push(`<line class="tl-now" x1="${xn}" x2="${xn}" y1="${axisH - 4 * k}" y2="${H}"/>`);
  // 실측이 앞쪽까지 다 차 있지 않으면(막 수집을 시작했거나 끊겼다) 비어 있는 까닭을 적는다
  const firstObs = FLOW.frames.findIndex(f => f.kind === "obs");
  const gapTo = firstObs >= 0 ? FLOW.tt[firstObs] : FLOW.tn;
  if (gapTo - FLOW.t0 > FLOW.step * 2 * 60e3 && xT(gapTo) - x0 > 120 * k)
    out.push(`<text class="tl-empty" x="${(x0 + xT(gapTo)) / 2}" y="${axisH + 22 * k}" style="font-size:${12 * k}px">`
      + (firstObs >= 0 ? `실측 ${hm(FLOW.frames[firstObs].t)}부터 — 쌓이는 중` : "실측 없음") + `</text>`);

  const fs = Math.min(18 * k, rh * 0.42);
  rowsD.forEach((r, ri) => {
    const top = axisH + ri * rh, base = top + rh - 5 * k, ph = rh - 12 * k;
    const y = v => base - Math.min(v, vmax) / vmax * ph;
    const seg = sel => {
      // 결측(null)은 끊는다 — 0 으로 잇지 않는다
      let d = "", a = "", run = [];
      const flush = () => {
        if (run.length) {
          d += "M" + run.map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join("L");
          a += `M${run[0][0].toFixed(1)},${base}L` + run.map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join("L")
             + `L${run[run.length - 1][0].toFixed(1)},${base}Z`;
        }
        run = [];
      };
      FLOW.frames.forEach((f, i) => {
        if (!sel(f)) return;
        const v = r.v[i];
        if (v == null) { flush(); return; }
        run.push([xT(FLOW.tt[i]), y(v)]);
      });
      flush();
      return { d, a };
    };
    const po = seg(f => f.kind === "obs"), pf = seg(f => f.kind === "fcst");
    // 기간 최고 — 1㎜ 넘을 때만 숫자를 단다
    let pi = -1, pv = 0;
    r.v.forEach((v, i) => { if (v != null && v > pv) { pv = v; pi = i; } });
    const peak = pi >= 0 && pv >= 1
      ? `<text class="tl-peak" x="${xT(FLOW.tt[pi])}" y="${Math.max(top + fs * 0.9, y(pv) - 4 * k)}" style="font-size:${11.5 * k}px">${pv.toFixed(pv >= 10 ? 0 : 1)}</text>` : "";
    out.push(`<g class="tl-row ${r.tot ? "tot" : ""}" data-s="${r.tot ? "" : r.name}" data-i="${ri}">
      <rect class="tl-bg" x="0" y="${top}" width="${W}" height="${rh}"/>
      <line class="tl-sep" x1="${8 * k}" x2="${W - 8 * k}" y1="${top + rh}" y2="${top + rh}"/>
      <text class="tl-name ${r.tot ? "tot" : ""}" x="${12 * k}" y="${top + rh / 2}" style="font-size:${fs}px">${r.tot ? "경남" : r.name}</text>
      <path class="tl-area" d="${po.a}"/><path class="tl-line" d="${po.d}"/>
      <path class="tl-farea" d="${pf.a}"/><path class="tl-fline" d="${pf.d}"/>
      ${peak}
      <circle class="tl-dot" r="${5 * k}" cx="-99" cy="-99"/>
      <text class="tl-val" x="${W - padR}" y="${top + rh / 2}" style="font-size:${Math.min(20 * k, rh * 0.48)}px"></text>
    </g>`);
  });
  out.push(`<line class="tl-head" id="tl-head" x1="0" x2="0" y1="${axisH - 6 * k}" y2="${H}" style="transform:translateX(-9px)"/>`);
  svg.innerHTML = out.join("");
  TLG = { xT, y0: axisH, rh, vmax, rowsD, k, base: ri => axisH + ri * rh + rh - 5 * k, ph: rh - 12 * k, x0, x1 };
  for (const g of svg.querySelectorAll(".tl-row")) {
    g.onmouseenter = () => highlight(g.dataset.s || null);
    g.onmouseleave = () => highlight(null);
  }
  // 그래프를 누르거나 끌면 그 시각으로 — 지도가 따라온다
  let drag = false, last = -1;
  const go = ev => {
    const r = svg.getBoundingClientRect(), xx = ev.clientX - r.left;
    if (xx < TLG.x0 - 6 || xx > TLG.x1 + 6) return;
    const t = FLOW.t0 + (xx - TLG.x0) / (TLG.x1 - TLG.x0) * (FLOW.t1 - FLOW.t0);
    const i = nearestFrame(t);
    if (i !== last) { last = i; seek(i); }
  };
  svg.onpointerdown = ev => { drag = true; stopPlay(); svg.setPointerCapture(ev.pointerId); last = -1; go(ev); };
  svg.onpointermove = ev => { if (drag) go(ev); };
  svg.onpointerup = () => { drag = false; };
  // 처음 놓을 때는 미끄러지지 않게 — 화면 밖(-99)에서 날아 들어오는 것처럼 보인다
  svg.classList.add("noanim");
  tlPlayhead();
  requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove("noanim")));
}

/* 재생 위치만 바꾼다 — 줄을 다시 그리지 않는다(재생 중 매 프레임 부른다) */
function tlPlayhead() {
  if (!TLG || !tlOn || !FLOW) return;
  const stat = SET.tl_stat === "mean" ? "mean" : "max";
  const ht = headT();
  const i = curFrame();
  const head = $("tl-head");
  if (head) head.style.transform = `translateX(${(ht != null ? TLG.xT(ht) : -9).toFixed(1)}px)`;
  // 값은 지도와 **같은 숫자**여야 한다 — 지금 그린 격자의 시군 통계(CURSTAT)를 먼저 쓴다
  const live = FLOWK.has(kind) && CURSTAT ? Object.fromEntries(CURSTAT.rows.map(r => [r.sigun, r[stat]])) : null;
  let topName = null, topV = 0;
  const rows = document.querySelectorAll(".tl-row");
  rows.forEach((g, ri) => {
    const r = TLG.rowsD[ri];
    let v = null;
    if (live && !r.tot) v = live[r.name];
    else if (i >= 0) v = r.v[i];
    else v = r.v[FLOW.frames.findLastIndex ? FLOW.frames.findLastIndex(f => f.kind === "obs") : -1];
    if (live && r.tot) v = i >= 0 ? r.v[i] : null;
    const dot = g.querySelector(".tl-dot"), txt = g.querySelector(".tl-val");
    const k = stepIdx(v, STEPS.m60);
    // cx·cy 를 style 로 줘야 CSS 전환이 걸린다(속성으로 바꾸면 순간이동한다)
    if (ht != null && v != null) {
      dot.style.cx = TLG.xT(ht).toFixed(1) + "px";
      dot.style.cy = (TLG.base(ri) - Math.min(v, TLG.vmax) / TLG.vmax * TLG.ph).toFixed(1) + "px";
      dot.style.fill = k ? `var(--rain-${Math.max(3, k)})` : "var(--ink-3)";
      dot.style.opacity = "1";
    } else { dot.style.opacity = "0"; }
    txt.textContent = v == null ? "—" : v.toFixed(1);
    txt.classList.toggle("zero", !v);
    if (!r.tot && v != null && v > topV) { topV = v; topName = r.name; }
  });
  rows.forEach(g => g.classList.toggle("top", !!topName && g.dataset.s === topName && topV >= 0.1));
}

/* ── 오른쪽 카드 — 종합 화면(강수 모니터링)의 세 판을 작게 ─────────────────────
   실제 자료는 종합 화면과 **같은 API·같은 규칙**이다 — 숫자가 두 화면에서 같아야 한다.
     강수 누적  /api/rain(스방 → 비면 기상청) 시군마다 다우지점(자료 있는 지점 중 합계 최대)
                + /api/forecast 시군 6시간을 0·5·10·20·30·50 으로 맞춘 합(빗금). 합으로 줄 세운다
     지금 오는 비 /api/minute — 15분·60분 상위
     예측 상위  /api/forecast 시군 — 6시간 합 순
   테스트 모드는 합성 흐름(/api/grid/flow?test=1)에서 뽑는다 — 지도와 같은 값이 나오게. */
let CARDS = null;
const qRN1 = v => [0, 5, 10, 20, 30, 50].reduce((a, b) => (Math.abs(b - v) < Math.abs(a - v) ? b : a));
const ORDER_GN = () => GEO.sigun.filter(s => s.kind === "gn").map(s => s.name);
const sumv = a => a.reduce((x, v) => x + (typeof v === "number" ? v : 0), 0);

/* 시각 글자('12', '13', …, '23:36') → 시각(ms). 끝에서부터 거슬러 올라가며 날을 넘긴다 */
function labelTimes(labels, lastHM) {
  const out = new Array(labels.length), now = new Date();
  const [lh, lm] = (lastHM || `${now.getHours()}:00`).split(":").map(Number);
  const t = new Date(now); t.setHours(lh, lm || 0, 0, 0);
  if (t - now > 3600e3) t.setDate(t.getDate() - 1);
  out[labels.length - 1] = t.getTime();
  for (let i = labels.length - 2; i >= 0; i--) {
    const c = new Date(out[i + 1]);
    c.setHours(+labels[i].slice(0, 2), labels[i].length > 2 ? +labels[i].slice(3, 5) : 0, 0, 0);
    if (c.getTime() >= out[i + 1]) c.setDate(c.getDate() - 1);
    out[i] = c.getTime();
  }
  return out;
}
function nextHours(labels, after) {          // 예측 '00','01',… → after 뒤의 시각들
  const out = [];
  let prev = after;
  for (const l of labels) {
    const c = new Date(prev); c.setHours(+l.slice(0, 2), 0, 0, 0);
    if (c.getTime() <= prev) c.setDate(c.getDate() + 1);
    out.push(c.getTime()); prev = c.getTime();
  }
  return out;
}

async function cardsFromApi() {
  const H = SET.acc_hours;
  const fq = SEL ? `&sigun=${encodeURIComponent(SEL)}` : "";
  const [fc, mn] = await Promise.all([getJson(`/api/forecast?hours=6${fq}`), getJson(`/api/minute?n=${SEL ? 20 : 6}`)]);
  const acc = ACC_BASIS === "grid" ? await accGrid(H, fc) : await accAws(H, fc);
  // 시군을 골랐으면 '지금 오는 비'는 그 시군 지점만, '예측 상위'는 그 시군 읍면동
  const mine = l => (l || []).filter(x => !SEL || x.sigun === SEL).slice(0, 6).map(x => ({ sig: x.sigun, name: x.name, mm: x.mm }));
  return {
    acc,
    now: { r15: mine(mn.r15), r60: mine(mn.r60), tm: mn.tm, sub: SEL ? `기상청 매분자료 · ${SEL} 지점` : null },
    fc: { det: !!SEL, labels: fc.labels || [], ft: acc.ft || [], bt: fc.tmfc ? `${hm(fc.tmfc)} 발표` : "—",
          rows: SEL ? (fc.emd_sigun || []).map(e => ({ sig: e.sigun, label: e.emd, d: e.d.slice(0, 6), sum: e.sum }))
                    : (fc.sigun || []).map(s => ({ sig: s.sigun, emd: s.emd, d: s.d.slice(0, 6), sum: s.sum })) },
  };
}
const fcMaps = fc => [Object.fromEntries((fc.sigun || []).map(s => [s.sigun, s])),
                      Object.fromEntries((fc.emd_sigun || []).map(e => [e.emd, e]))];
const sitePos = stn => { const s = SITEBY.get(stn); return s ? { x: s.x, y: s.y } : null; };

/* AWS 기준 — 스방 265(내부망) → 비면 기상청 56. 시군 줄은 다우지점, 시군을 고르면 그 시군 지점 전부.
   지점 줄의 예상(빗금)은 그 지점이 든 읍면동 예측 — 위치를 아는 지점(기상청 지점)만 붙인다. */
async function accAws(H, fc) {
  let rain = await getJson(`/api/rain?hours=${H}&src=bangjae`), fell = false;
  // 스방이 멈췄거나 계정이 없으면 빈 응답이다 — 기상청으로 물러서고, 물러섰다고 적는다(종합 화면과 같다)
  if (!(rain.rows || []).length) { rain = await getJson(`/api/rain?hours=${H}&src=kma`); fell = true; }
  const lastHM = rain.labels.at(-1).includes(":") ? rain.labels.at(-1) : rain.base_hour;
  const dt = labelTimes(rain.labels, lastHM), ft = nextHours(fc.labels || [], dt.at(-1));
  const [FC, FE] = fcMaps(fc);
  const live = r => r.bad < r.d.length;              // 자료를 아예 안 주는 지점이 0으로 1등이 되지 않게
  const base = { H, ft, basis: "aws", fell, bt: `${lastHM} 실측`,
                 src: fell ? "스방 안 됨→기상청" : rain.src === "bangjae" ? "스방 265" : "기상청 56" };
  if (!SEL) {
    const by = {};
    for (const r of rain.rows) (by[r.sigun] ||= []).push(r);
    const rows = ORDER_GN().filter(s => by[s]).map(s => {
      const st = by[s].slice().sort((a, b) => (live(b) - live(a)) || (b.sum - a.sum))[0];
      const fcd = (FC[s]?.d || []).slice(0, 6).map(qRN1);
      return { sig: s, stn: st.name, d: st.d, dt, fcd, ft, sum: st.sum, fc: sumv(fcd), bad: st.bad, pos: sitePos(st.stn) };
    });
    return { ...base, rows, sub: `다우지점 · 지난 ${H}시간 + 예상 6시간` };
  }
  const rows = rain.rows.filter(r => r.sigun === SEL).map(r => {
    const site = SITEBY.get(r.stn), e = site?.emd ? FE[site.emd] : null;
    const fcd = e ? e.d.slice(0, 6).map(qRN1) : [];
    return { sig: SEL, tag: site?.emd || "", stn: r.name, d: r.d, dt, fcd, ft: fcd.length ? ft : [], sum: r.sum,
             fc: sumv(fcd), bad: r.bad, dead: !live(r), pos: sitePos(r.stn), det: true };
  });
  return { ...base, rows, sel: SEL,
    sub: `${SEL} AWS ${rows.length}곳 · 지난 ${H}시간${rows.some(r => r.fcd.length) ? " + 그 읍면동 예상" : ""}`,
    note: rows.some(r => !r.pos) ? "위치를 모르는 지점(스방 자체 AWS 등)은 지도에 짚지 못하고 예상도 붙이지 않는다" : "" };
}

/* 격자 기준 — 매시 정각 60분 격자를 칸마다 더한 누적. 시군 줄은 시군 누적 최대 칸(+읍면동),
   시군을 고르면 읍면동 줄(그 읍면동 누적 최대 칸). 선 그래프는 그 칸의 매시 값이다. */
async function accGrid(H, fc) {
  const p = new URLSearchParams({ hours: H });
  if (SEL) p.set("sigun", SEL);
  if (test) p.set("test", "1");
  const j = await getJson(`/api/grid/acctable?${p}`);
  const dt = j.frames.map(tOf), ft = nextHours(fc.labels || [], dt.at(-1));
  const [FC, FE] = fcMaps(fc);
  const rows = j.rows.map(r => {
    const fcd = ((SEL ? FE[r.name] : FC[r.sig])?.d || []).slice(0, 6).map(qRN1);
    return { sig: r.sig, tag: SEL ? "" : r.sig, stn: SEL ? r.name : (r.name || "—"), d: r.d, dt, fcd,
             ft: fcd.length ? ft : [], sum: r.sum ?? 0, fc: sumv(fcd), det: !!SEL,
             pos: r.col != null ? { x: r.col, y: r.row } : null };
  });
  return { rows, H, ft, basis: "grid", fell: false, sel: SEL, src: j.test ? "테스트" : "격자 500m",
    bt: `${hm(j.tm)} 정각까지`,
    sub: SEL ? `${SEL} 읍면동 ${rows.length} · 누적 최대 칸 · 지난 ${H}시간` : `시군 누적 최대 칸 · 지난 ${H}시간 + 예상 6시간`,
    note: j.missing ? `정시 격자 ${j.missing}시간 빠짐 — 합은 하한이다(수집기가 한 번에 4장씩 메운다)` : "" };
}

async function cardsFromTest() {
  if (!FLOW) return null;
  const obsI = [], fcI = [];
  FLOW.frames.forEach((f, i) => {
    if (f.kind === "obs" && f.t.endsWith("00")) obsI.push(i);
    if (f.kind === "fcst") fcI.push(i);
  });
  const lastObs = FLOW.frames.reduce((a, f, i) => (f.kind === "obs" ? i : a), -1);
  const dt = obsI.map(i => FLOW.tt[i]), ft = fcI.map(i => FLOW.tt[i]);
  const rows = FLOW.series.map(s => {
    const d = obsI.map(i => s.max[i]), fcd = fcI.map(i => qRN1(s.max[i] ?? 0));
    return { sig: s.sigun, stn: "격자", d, dt, fcd, ft, sum: Math.round(sumv(d) * 10) / 10, fc: sumv(fcd) };
  });
  let s15 = null;
  try { s15 = await getJson("/api/grid/sigun?layer=obs15&test=1"); } catch {}
  const top = (arr) => arr.sort((a, b) => b.mm - a.mm).slice(0, 6);
  const r60 = top(FLOW.series.map(s => ({ sig: s.sigun, name: "격자", mm: lastObs >= 0 ? (s.max[lastObs] ?? 0) : 0 })));
  const r15 = s15 ? top(s15.rows.filter(r => r.kind === "gn").map(r => ({ sig: r.sigun, name: r.where?.emd || "격자", mm: r.max ?? 0 }))) : [];
  let acc = { rows, H: dt.length, src: "테스트", fell: false, basis: "aws", bt: lastObs >= 0 ? `${hm(FLOW.frames[lastObs].t)} 실측` : "—" };
  if (ACC_BASIS === "grid" || SEL) {
    try {
      acc = await accGrid(SET.acc_hours, { labels: [], sigun: [] });
      if (ACC_BASIS === "aws") { acc.basis = "aws"; acc.note = "테스트에는 관측소 시계열이 없어 격자 누적으로 보인다"; }
    } catch (e) { acc.note = e.message; }
  }
  return {
    acc,
    now: { r15, r60, tm: lastObs >= 0 ? hm(FLOW.frames[lastObs].t) : "—" },
    fc: { rows: FLOW.series.map(s => { const d = fcI.map(i => s.max[i] ?? 0); return { sig: s.sigun, emd: "", d, sum: sumv(d) }; }),
          labels: ft.map(fmtH), ft, bt: FLOW.tmfc ? `${hm(FLOW.tmfc)} 발표` : "—" },
  };
}

let CARD_SEQ = 0;
async function loadCards() {
  if (!tlOn || SET.panel === "timeline") return;
  const my = ++CARD_SEQ;
  let c;
  try { c = CASE ? (CASEM ? await cardsFromCase() : null) : test ? await cardsFromTest() : await cardsFromApi(); }
  catch (e) { c = { err: e.message }; }
  if (my !== CARD_SEQ) return;
  CARDS = c;
  renderCards();
}

const rampVar = (v, steps) => { const k = stepIdx(v, steps); return k ? `var(--rain-${k})` : null; };
function rowEvents(el) {
  for (const r of el.querySelectorAll("[data-s]")) {
    const pt = r.dataset.x ? { x: +r.dataset.x, y: +r.dataset.y } : null;
    r.onmouseenter = () => { highlight(r.dataset.s); link(r, r.dataset.s, pt); hot(pt); };
    r.onmouseleave = () => { highlight(null); link(null); hot(null); };
    // 시군 줄을 누르면 그 시군을 고른다(오른쪽 패널이 그 시군 읍면동·지점으로 바뀐다)
    r.onclick = r.classList.contains("det") ? null : () => selectSig(r.dataset.s === SEL ? null : r.dataset.s);
  }
}

function renderCards() {
  if (!CARDS || !V) return;
  if (CARDS.err) {
    $("acc-b").innerHTML = `<div class="empty-note">불러오지 못했다 — ${CARDS.err}</div>`;
    return;
  }
  $("fc-h").textContent = CASE ? "호우 기준" : "예측 상위";
  $("fc-sub").textContent = CASE ? "산출 — 격자 3시간·12시간 합" : CARDS.fc?.det ? `${SEL} 읍면동 · 초단기 6시간` : "초단기 · 앞으로 6시간";
  $("now-sub").textContent = CARDS.now.sub || "기상청 매분자료";
  // 누적 카드는 남는 높이를 다 쓴다 — 다른 둘을 먼저 채운 뒤에 재야 줄 수가 맞는다
  renderNow(); CASE ? renderCrit() : renderFc(); renderAcc();
  drawRanks();
  cardsPlayhead();
}

/* 강수 누적 — 종합 화면 '강수 타임라인'을 한 줄짜리로 */
function renderAcc() {
  const A = CARDS.acc, k = V.k, body = $("acc-b");
  for (const b of $("acc-h").querySelectorAll(".bs b")) b.classList.toggle("on", b.dataset.b === (A.basis || ACC_BASIS));
  $("acc-sel").hidden = !A.sel;
  $("acc-sel").textContent = A.sel ? `${A.sel} ✕` : "";
  $("acc-sub").textContent = A.sub || `다우지점 · 지난 ${A.H}시간 + 예상 6시간`;
  $("acc-src").textContent = A.src; $("acc-src").classList.toggle("fell", !!A.fell);
  $("acc-bt").textContent = A.bt;
  const rows = A.rows.slice().sort((a, b) => (b.sum + b.fc) - (a.sum + a.fc));
  if (!rows.length || !rows[0].dt.length) {
    body.innerHTML = `<div class="empty-note">${A.sel ? `${A.sel} — ${A.basis === "grid" ? "읍면동" : "지점"} 자료가 없다` : "강수 자료가 아직 없다"}</div>`
      + (A.note ? `<div class="case-note">${A.note}</div>` : "");
    A.sp = null; return;
  }
  const bh = body.clientHeight - 10 * k - (A.note ? 40 * k : 0);
  const rh = Math.max(26 * k, Math.min(44 * k, bh / Math.max(1, rows.length)));   // 카드를 꽉 채운다
  const n = Math.max(1, Math.min(rows.length, Math.floor(bh / rh)));
  body.style.setProperty("--rh", rh + "px");
  const bmax = Math.max(1, ...rows.map(r => r.sum + r.fc));
  let smax = 5;
  for (const r of rows) for (const v of [...r.d, ...r.fcd]) if (typeof v === "number" && v > smax) smax = v;
  // 축 끝은 줄들 가운데 예상이 가장 멀리 간 데까지(예상이 없는 줄이 맨 위여도 다른 줄이 밖으로 새지 않게)
  const t0 = Math.min(...rows[0].dt) - 1800e3, t1 = Math.max(rows[0].dt.at(-1), ...rows.flatMap(r => r.ft));
  const SW = 124 * k, SH = rh * 0.82;
  const sx = t => (t - t0) / Math.max(1, t1 - t0) * SW, sy = v => SH - Math.min(v, smax) / smax * (SH - 3);
  A.sp = { t0, t1, SW };
  const sline = (ts, vs, from) => {
    let pts = ts.map((t, i) => [t, vs[i]]).filter(([, v]) => typeof v === "number");
    if (from) pts = [from, ...pts];
    if (!pts.length) return { d: "", a: "" };
    const p = pts.map(([t, v]) => `${sx(t).toFixed(1)},${sy(v).toFixed(1)}`);
    return { d: "M" + p.join("L"), a: `M${sx(pts[0][0]).toFixed(1)},${SH}L${p.join("L")}L${sx(pts.at(-1)[0]).toFixed(1)},${SH}Z` };
  };
  const xn = sx(rows[0].dt.at(-1));
  body.innerHTML = rows.slice(0, n).map((r, i) => {
    const tot = r.sum + r.fc, o = r.sum / bmax * 100, f = r.fc / bmax * 100;
    const inside = o + f > 62;
    const vpos = inside ? `right:calc(${(100 - o - f).toFixed(1)}% + 6px)` : `left:calc(${(o + f).toFixed(1)}% + 6px)`;
    const lastObs = r.d.reduce((a, v, j) => (typeof v === "number" ? [r.dt[j], v] : a), null);
    const po = sline(r.dt, r.d), pf = sline(r.ft, r.fcd, lastObs);
    const rank = i < 3 && tot >= 0.1 ? `<span class="rk">${i + 1}</span>` : "";
    const ge = r.part ? "≥" : "";
    const at = r.pos ? ` data-x="${r.pos.x}" data-y="${r.pos.y}"` : "";
    return `<div class="ar${r.det ? " det" : ""}" data-s="${r.sig}"${at} title="${r.det ? "" : `${r.sig} — 눌러서 이 시군 ${A.basis === "grid" ? "읍면동" : "지점"} 보기`}">
      <div class="nm2">${rank}<small>${r.tag ?? r.sig}</small>${r.stn}</div>
      <div class="abar"><div class="o" style="width:${o.toFixed(1)}%"></div>
        ${r.fc ? `<div class="f" style="left:${o.toFixed(1)}%;width:${f.toFixed(1)}%"></div>` : ""}
        <span class="v" style="${vpos}">${ge}${r.sum.toFixed(1)}${r.fc ? `<i>+${r.fc}</i>` : ""}</span></div>
      <svg viewBox="0 0 ${SW.toFixed(0)} ${SH.toFixed(0)}" preserveAspectRatio="none">
        <path class="sp-a" d="${po.a}"/><path class="sp-l" d="${po.d}"/>
        <path class="sp-fa" d="${pf.a}"/><path class="sp-fl" d="${pf.d}"/>
        <line class="sp-now" x1="${xn}" x2="${xn}" y1="0" y2="${SH}"/>
        <line class="sp-head" x1="0" x2="0" y1="-2" y2="${SH + 2}" style="transform:translateX(-99px)"/></svg>
      <div class="tot ${tot && !r.dead ? "" : "z"}">${r.dead ? "결측" : ge + tot.toFixed(1)}</div></div>`;
  }).join("") + (n < rows.length ? `<div class="case-note">외 ${rows.length - n}${A.basis === "grid" && A.sel ? "개 읍면동" : "곳"} — 적은 순이라 생략</div>` : "")
    + (A.note ? `<div class="case-note">${A.note}</div>` : "");
  rowEvents(body);
}

/* 지금 오는 비 — 15분 │ 60분 상위. 단계는 종합 화면과 같다(15분과 60분이 다른 자) */
const MN_STEPS = { 15: [0.5, 2, 5, 8, 12, 18, 25], 60: [1, 5, 10, 20, 30, 50, 70] };
function renderNow() {
  const N = CARDS.now;
  $("now-bt").textContent = N.tm || "—";
  const col = (list, kk) => {
    const mx = Math.max(...list.map(x => x.mm), 0.1);
    if (!list.length || mx <= 0.1 && !list.some(x => x.mm > 0))
      return `<div class="empty-note">비 없음</div>`;
    return list.slice(0, 6).map(x => {
      const c = rampVar(x.mm, MN_STEPS[kk]) || "var(--ink-3)";
      return `<div class="mr" data-s="${x.sig}"><span class="bg" style="width:${(x.mm / mx * 100).toFixed(0)}%;background:${c}"></span>
        <span class="nm2">${x.name && x.name !== x.sig ? `<small>${x.sig}</small>${x.name}` : x.sig}</span><b>${x.mm.toFixed(1)}</b></div>`;
    }).join("");
  };
  const colSteps = (list, steps) => {                 // 사례: 1시간·3시간 (단계를 직접 준다)
    const saved = MN_STEPS.x; MN_STEPS.x = steps;
    const h = col(list, "x"); MN_STEPS.x = saved;
    return h;
  };
  $("now-b").innerHTML = N.cols
    ? `<div class="mn">${N.cols.map(c => `<div><h4>${c.title}<span>㎜</span></h4>${colSteps(c.list, c.steps)}</div>`).join("")}</div>`
    : `<div class="mn"><div><h4>15분<span>㎜</span></h4>${col(N.r15, 15)}</div>
    <div><h4>60분<span>㎜</span></h4>${col(N.r60, 60)}</div></div>`;
  rowEvents($("now-b"));
}

/* 예측 상위 — 6시간 합 순. 칸은 지도와 같은 색 단계 */
function renderFc() {
  const F = CARDS.fc;
  $("fc-bt").textContent = F.bt;
  const rows = F.rows.slice().sort((a, b) => b.sum - a.sum).slice(0, 6);
  if (!rows.length || rows[0].sum <= 0) {
    $("fc-b").innerHTML = `<div class="empty-note">앞으로 6시간 예상 강수 없음</div>`;
    return;
  }
  const cell = v => {
    const k = stepIdx(v, STEPS.m60);
    const txt = v >= 1 ? (Number.isInteger(v) ? v : v.toFixed(1)) : "";
    return `<i style="${k ? `background:var(--rain-${k});color:${k >= 4 ? "var(--on-accent)" : "var(--ink)"}` : ""}">${txt}</i>`;
  };
  $("fc-b").innerHTML = `<div class="fh"><span>시군</span><div class="cells">${F.labels.map(l => `<span>${l}</span>`).join("")}</div><span style="text-align:right">합</span></div>`

/* 카드 안의 재생 위치 — 누적 줄 선 그래프의 세로선, 예측 칸의 테두리 */
function cardsPlayhead() {
  if (!CARDS || CARDS.err || !tlOn || SET.panel === "timeline") return;
  const ht = headT(), sp = CARDS.acc?.sp;
  for (const l of document.querySelectorAll(".sp-head")) {
    const x = ht != null && sp && ht >= sp.t0 && ht <= sp.t1 ? (ht - sp.t0) / (sp.t1 - sp.t0) * sp.SW : -99;
    l.style.transform = `translateX(${x.toFixed(1)}px)`;
  }
  // 지도가 예측(초단기)을 보일 때만 그 시각 열을 짚는다 — 실측을 보는 중이면 짚지 않는다
  let j = -1;
  if (kind === "vsrt" && ht != null && CARDS.fc.ft?.length) {
    let bd = Infinity;
    CARDS.fc.ft.forEach((t, i) => { const d = Math.abs(t - ht); if (d < bd) { bd = d; j = i; } });
  }
  for (const r of document.querySelectorAll("#fc-b .fr, #fc-b .fh"))
    r.querySelectorAll(".cells > *").forEach((c, i) => c.classList.toggle("on", i === j));
}

/* 지도 위 순위 표식 — 누적 상위 셋. 시군 줄이면 시군명 왼쪽, 시군을 골랐으면 그 지점·칸 자리에 */
function drawRanks() {
  const g = $("ranks");
  if (!g) return;
  if (!tlOn || SET.panel === "timeline" || !CARDS || CARDS.err || !CARDS.acc || !V) { g.innerHTML = ""; return; }
  const det = !!CARDS.acc.sel;
  const rows = CARDS.acc.rows.slice().sort((a, b) => (b.sum + b.fc) - (a.sum + a.fc)).slice(0, 3)
    .filter(r => r.sum + r.fc >= 0.1);
  const r0 = FSN * 0.46;
  g.innerHTML = rows.map((r, i) => {
    let x, y;
    if (det) {
      if (!r.pos) return "";
      x = V.toX(r.pos.x) + r0 * 1.15; y = V.toY(r.pos.y) - r0 * 1.15;
    } else {
      const ft = FEAT.find(f => f.properties.sigun === r.sig);
      if (!ft) return "";
      x = V.toX(ft.properties.lx) - r.sig.length * FSN * 0.52 - r0 - 4; y = V.toY(ft.properties.ly);
    }
    return `<g class="rk"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r0.toFixed(1)}"/>
      <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${(FSN * 0.56).toFixed(1)}px">${i + 1}</text></g>`;
  }).join("");
}

/* 줄 ↔ 지도 연결선 — 카드 줄 왼쪽 끝에서 지도 위 그 시군 이름 오른쪽까지, 그어지듯.
   pt(칸 좌표)를 주면 그 자리(지점·누적 최대 칸)까지 긋는다. */
function link(el, sig, pt) {
  const svg = $("links");
  if (!el || !sig || !V) { svg.innerHTML = ""; return; }
  const st = $("stage").getBoundingClientRect(), r = el.getBoundingClientRect();
  const x1 = r.left - st.left - 3, y1 = r.top - st.top + r.height / 2;
  let x2, y2;
  if (pt) {
    x2 = V.toX(pt.x) * MT.sc + MT.tx; y2 = V.toY(pt.y) * MT.sc + MT.ty;
  } else {
    const ft = FEAT.find(f => f.properties.sigun === sig);

    x2 = V.toX(ft.properties.lx) * MT.sc + MT.tx + hw + 8; y2 = V.toY(ft.properties.ly) * MT.sc + MT.ty;
  }
  const dx = Math.max(50, (x1 - x2) * 0.45);
  svg.innerHTML = `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} C${(x1 - dx).toFixed(1)},${y1.toFixed(1)} ${(x2 + dx).toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}"/>
    <circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="5"/>`;

}
/* 줄이 가리키는 자리에 고리 — 지점·누적 최대 칸 */

/* 사례 AWS 기준 — 굳혀 둔 매시 RN_HR1(meta.stations)을 그 시각까지 더한다 */
function caseAccAws(i, dt, from) {
  const h1 = CASEM.stations?.h1;
  if (!h1 || !SITES) return { rows: [], sel: SEL, sub: "이 사례에는 관측소 자료가 없다", note: "" };
  const all = SITES.stations.filter(s => h1[s.stn]).map(s => {
    const h = h1[s.stn], seg = h.slice(0, i + 1), have = seg.filter(v => v != null);
    return { sig: s.sigun, tag: SEL ? (s.emd || "") : s.sigun, stn: s.name, d: h, dt, fcd: [], ft: [],
             sum: Math.round(sumv(seg) * 10) / 10, fc: 0, pos: { x: s.x, y: s.y }, det: !!SEL,

  return { rows: ORDER_GN().filter(s => best[s]).map(s => best[s]), sub: `다우지점 · ${from}`,

  const my = ++ALERT_SEQ;
  let j;
  try { j = test ? testAlerts() : await getJson("/api/alerts"); }
  catch (e) { j = { err: e.message }; }
  if (my !== ALERT_SEQ) return;
  ALERTS = j.err ? { err: j.err } : parseAlerts(j);
  drawAlerts(); draw(); renderAlertLegend();
}

/* 경위도 → 500m 칸(정방향). 바다 특보 글자 자리를 경위도로 두려고 쓴다 */
const LCCF = (() => {
  const D = Math.PI / 180, a = 6378137, f = 1 / 298.257222101, e = Math.sqrt(f * (2 - f));
  const m = p => Math.cos(p) / Math.sqrt(1 - e * e * Math.sin(p) ** 2);
  const t = p => Math.tan(Math.PI / 4 - p / 2) / ((1 - e * Math.sin(p)) / (1 + e * Math.sin(p))) ** (e / 2);
  const p1 = 30 * D, p2 = 60 * D, p0 = 38 * D;
  const n = (Math.log(m(p1)) - Math.log(m(p2))) / (Math.log(t(p1)) - Math.log(t(p2)));
  const AF = a * m(p1) / (n * t(p1) ** n), rho0 = AF * t(p0) ** n;
  return (lon, lat) => {
    const rho = AF * t(lat * D) ** n, th = n * (lon - 126) * D;
    return [rho * Math.sin(th) / 500 + 880, (rho0 - rho * Math.cos(th)) / 500 + 1540];
  };
})();

function drawAlerts() {
  const gl = $("walerts"), gb = $("wbadge");
  ALERTBOX = [];
  if (!gl || !gb) return;
  if (!OV.has("alerts") || !ALERTS || ALERTS.err || !V || !V.s) { gl.innerHTML = gb.innerHTML = ""; return; }
  const sc = V.s / 3.3, w = Math.max(3.5, 4.6 * sc);      // 보이는 선 굵기(안쪽 절반)
  const defs = [], lines = [], badges = [];
  for (const [sig, list] of Object.entries(ALERTS.bySig)) {
    const ft = FEAT.find(f => f.properties.sigun === sig);
    if (!ft) continue;
    const top = list.reduce((a, b) => (LVRANK[b.lv] > LVRANK[a.lv] ? b : a));
    const id = `wc${ft.properties.id}`, dClip = PATH(ft);
    defs.push(`<clipPath id="${id}"><path d="${dClip}"/></clipPath>`);
    // ⚠️ 작은 섬(4㎢ 미만 = 16칸)까지 두르면 통영·거제 바다가 점선으로 어지럽다 — 선은 큰 땅에만
    const polys = ft.geometry.type === "Polygon" ? [ft.geometry.coordinates] : ft.geometry.coordinates;
    const areaCells = ring => Math.abs(ring.reduce((s, p, i) => {
      const q = ring[(i + 1) % ring.length];
      return s + p[0] * q[1] - q[0] * p[1];
    }, 0)) / 2;
    const big = polys.filter(p => areaCells(p[0]) >= 16);
    const d = PATH({ type: "MultiPolygon", coordinates: big.length ? big : polys });
    const L = (cls, sw, dash = "") => `<path class="wl ${cls}" d="${d}" clip-path="url(#${id})" stroke-width="${(sw * 2).toFixed(1)}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
    if (top.lv === "severe") lines.push(L("severe", w * 1.3), L("gap", w * 0.85), L("severe", w * 0.45));
    else if (top.lv === "warn") lines.push(L("warn", w));
    else lines.push(L("watch", w, `${(10 * sc).toFixed(1)} ${(6 * sc).toFixed(1)}`));
    // 딱지 — 시군명 밑에 쌓는다(센 것부터)
    const fs = FSN * 0.6, bh = fs * 1.5, x = V.toX(ft.properties.lx);
    let y = V.toY(ft.properties.ly) + FSN * 0.62 + 3;
    const items = list.slice().sort((a, b) => LVRANK[b.lv] - LVRANK[a.lv]);
    const seen = new Set();
    for (const it of items) {
      const txt = it.name + (it.sub ? ` · ${it.sub}` : "");
      if (seen.has(txt)) continue;
      seen.add(txt);
      const bw = txt.length * fs * 0.95 + fs * 0.9;
      badges.push(`<g class="wb ${it.lv}"><rect x="${(x - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${(bh / 3).toFixed(1)}"/>
        <text x="${x.toFixed(1)}" y="${(y + bh / 2).toFixed(1)}" text-anchor="middle" style="font-size:${fs.toFixed(1)}px">${txt}</text></g>`);
      ALERTBOX.push({ x0: x - bw / 2, x1: x + bw / 2, y0: y, y1: y + bh });
      y += bh + 3;
    }
  }
  // 바다 특보 — 바다 위(거제 남쪽)에 글로
  if (ALERTS.sea.length) {
    const [cx, cy] = LCCF(128.66, 34.62);
    const fs = FSN * 0.62;
    let y = V.toY(cy);
    for (const g of ALERTS.sea) {
      badges.push(`<text class="wsea" x="${V.toX(cx).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle"
        style="font-size:${fs.toFixed(1)}px;fill:var(--lv-${g.lv});stroke-width:${(fs * 0.2).toFixed(1)}px">바다 · ${g.name}</text>`);
      y += fs * 1.35;
    }
  }
  gl.innerHTML = `<defs>${defs.join("")}</defs>${lines.join("")}`;
  gb.innerHTML = badges.join("");
}

function renderAlertLegend() {
  const box = $("ly-alerts");
  if (!OV.has("alerts")) { box.hidden = true; return; }
  box.hidden = false;
  if (!ALERTS) { box.innerHTML = `<div class="hd2"><b>기상특보</b><span>읽는 중…</span></div>`; return; }
  if (ALERTS.err) { box.innerHTML = `<div class="hd2"><b>기상특보</b></div><div class="al-none">불러오지 못했다 — ${ALERTS.err}</div>`; return; }
  const sample = lv => lv === "severe"
    ? `<svg viewBox="0 0 30 12"><line x1="0" x2="30" y1="2.5" y2="2.5" stroke="var(--lv-severe)" stroke-width="3"/><line x1="0" x2="30" y1="9" y2="9" stroke="var(--lv-severe)" stroke-width="2"/></svg>`
    : `<svg viewBox="0 0 30 12"><line x1="0" x2="30" y1="6" y2="6" stroke="var(--lv-${lv})" stroke-width="4"${lv === "watch" ? ' stroke-dasharray="6 4"' : ""}/></svg>`;
  const rows = [];
  for (const g of ALERTS.land)
    rows.push(`<div class="al" data-s="${g.where.map(x => x.replace(/\(.*/, "")).join(",")}">${sample(g.lv)}<b style="color:var(--lv-${g.lv})">${g.name}</b><span class="where">${g.where.join(" · ")}</span></div>`);
  for (const g of ALERTS.sea)
    rows.push(`<div class="al"><span class="tag">바다</span><b style="color:var(--lv-${g.lv})">${g.name}</b><span class="where">${(g.regions || []).slice(0, 2).join(" · ")}${(g.regions || []).length > 2 ? ` 외 ${g.regions.length - 2}` : ""}</span></div>`);
  const pre = ALERTS.pending.filter(p => p.kind === "pre");
  const preBy = {};
  for (const p of pre) (preBy[`${p.name}|${p.when}`] ||= []).push(p.sigun || p.reg);
  for (const [k, sigs] of Object.entries(preBy)) {
    const [name, when] = k.split("|");
    rows.push(`<div class="al"><span class="tag">예비</span><b style="color:var(--lv-pre)">${name}</b><span class="where">${when} · ${[...new Set(sigs)].join(" · ")}</span></div>`);
  }
  const later = ALERTS.pending.filter(p => p.kind === "later");
  for (const p of later)
    rows.push(`<div class="al"><span class="tag">예정</span><b>${p.name}</b><span class="where">${p.sigun || p.reg} · ${String(p.tmef || "").slice(8, 10)}:${String(p.tmef || "").slice(10, 12)} 발효</span></div>`);
  const bt = ALERTS.base ? String(ALERTS.base).slice(11, 16) : "—";
  const nKind = ALERTS.land.length + ALERTS.sea.length;
  // 머리를 누르면 접는다 — 특보가 많은 날 범례가 지도 북서쪽(함양·거창)을 가리지 않게
  box.classList.toggle("fold", AL_FOLD);
  box.innerHTML = `<div class="hd2" id="al-hd" title="눌러서 접기/펼치기"><b>기상특보${ALERTS.calc ? " · 산출" : ""}</b>`
    + `<span>${nKind ? `${nKind}종 · ` : ""}${test ? "테스트 · " : ""}${ALERTS.calc ? "" : "조회 "}${bt}</span><i class="fd">${AL_FOLD ? "▸" : "▾"}</i></div>`
    + (rows.length ? rows.join("") : `<div class="al-none">${ALERTS.calc ? "호우 기준을 넘은 시군 없음" : "발효 중인 특보 없음"}</div>`)
    + (ALERTS.calc ? `<div class="al-none">격자 3시간·12시간 합에 호우 기준(주의보 60·110 / 경보 90·180㎜)을 적용 — 실제 발표 내역이 아니다</div>` : "");
  $("al-hd").onclick = () => {
    AL_FOLD = !AL_FOLD;
    try { localStorage.setItem("gn-map-alfold", AL_FOLD ? "1" : "0"); } catch {}
    renderAlertLegend();
  };
  for (const r of box.querySelectorAll(".al[data-s]")) {
    const first = r.dataset.s.split(",")[0];
    r.onmouseenter = () => highlight(first);
    r.onmouseleave = () => highlight(null);
  }
}

/* ── 관측소(점) — 격자와 **같은 시각**의 실측. 레이어 '관측소'(S) ─────────────────
   ⚠️ 격자(면)는 관측소 사이를 메운 분석값이라 관측소 자리에서도 값이 다르다(봉우리가 깎인다).
      점의 속을 지도와 같은 색 단계로 칠해 둘레 칸과 견주게 한다. 값 글자는 빈자리에만 단다.
   ⚠️ 값이 없는 것을 셋으로 가른다: 0(속 빈 마름모) · 기상청 결측(×) · 그 시각 값을 못 받음(점선).
   위치는 data/geo/stations.json(tools/build_stations.py) — 화면은 기상청을 부르지 않는다. */
let SITES = null, SITEBY = new Map();
let STN = null, STN_SEQ = 0, STN_R = 6, LABELBOX = [];
let SEL = null;                          // 고른 시군 — 오른쪽 패널이 그 시군 읍면동·지점으로 바뀐다
let ACC_BASIS = "aws";                   // 누적 카드 기준: aws(관측소 다우지점) | grid(격자 누적 최대 칸)
const STNC = new Map();
const isFcst = k => k === "vsrt" || k.startsWith("shrt");
async function stnFetch(key, tm) {
  const p = new URLSearchParams({ layer: key });
  if (tm) p.set("tm", tm);
  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  const ck = p.toString();
  if (STNC.has(ck)) return STNC.get(ck);
  let j;
  try { j = await getJson(`/api/grid/stations?${p}`); }
  catch (e) { return { err: e.message, layer: key }; }
  // 아직 못 받은 시각(none)은 기억하지 않는다 — 수집기가 곧 채운다
  if (j.status !== "none") {
    if (STNC.size > 400) STNC.delete(STNC.keys().next().value);
    STNC.set(ck, j);
  }
  return j;
}
function loadStations() {
  if (!OV.has("stations")) { STN = null; drawStations(); renderStnLegend(); return; }
  const key = layerKey(), tm = isFcst(kind) ? null : CUR?.tm;
  const my = ++STN_SEQ;
  const done = j => { if (my !== STN_SEQ) return; STN = j; drawStations(); renderStnLegend(); };
  const p = new URLSearchParams({ layer: key });
  if (tm) p.set("tm", tm);
  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  const hit = STNC.get(p.toString());
  if (hit) done(hit);                    // 기억해 둔 시각은 같은 틱에 — 재생할 때 격자와 함께 넘어간다
  else stnFetch(key, tm).then(done);
}
/* 지금 그리는 격자와 같은 층·시각의 관측소 값인가 — 아니면 그리지 않는다(어긋난 시각을 나란히 두지 않는다) */
function stnFresh() {
  return !!STN && !STN.err && STN.layer === layerKey() && (STN.status === "forecast" || STN.tm === CUR?.tm);
}
function drawStations() {
  const g = $("stns");
  if (!g) return;
  if (!OV.has("stations") || !V || !V.s || !stnFresh()) { g.innerHTML = ""; return; }
  const steps = stepsOf(kind), fac = factor(), fc = STN.status === "forecast";
  const r = STN_R = Math.max(4.5, Math.min(12, V.s * 1.05));
  const fs = Math.max(11, Math.min(26, V.s * 3.1));
  const val = s => s.v * fac;
  const has = s => !fc && (s.q === "ok" || s.q === "part");
  const dia = (x, y, rr) => `M${x.toFixed(1)},${(y - rr).toFixed(1)}L${(x + rr).toFixed(1)},${y.toFixed(1)}L${x.toFixed(1)},${(y + rr).toFixed(1)}L${(x - rr).toFixed(1)},${y.toFixed(1)}Z`;
  const marks = [], boxes = [];
  for (const s of STN.rows) {
    const x = V.toX(s.x), y = V.toY(s.y), dim = SEL && s.sigun !== SEL ? " dim" : "";
    boxes.push({ x0: x - r, x1: x + r, y0: y - r, y1: y + r });
    if (has(s)) {
      const k = stepIdx(val(s), steps);
      marks.push(k ? `<g class="st${dim}"><path d="${dia(x, y, r)}" style="fill:var(--rain-${k})"/></g>`
                   : `<g class="st z${dim}"><path d="${dia(x, y, r * 0.8)}"/></g>`);
    } else if (!fc && s.q === "missing") {
      const q = r * 0.42;
      marks.push(`<g class="st miss${dim}"><path d="${dia(x, y, r * 0.8)}"/>
        <line x1="${(x - q).toFixed(1)}" y1="${(y - q).toFixed(1)}" x2="${(x + q).toFixed(1)}" y2="${(y + q).toFixed(1)}"/>
        <line x1="${(x - q).toFixed(1)}" y1="${(y + q).toFixed(1)}" x2="${(x + q).toFixed(1)}" y2="${(y - q).toFixed(1)}"/></g>`);
    } else marks.push(`<g class="st none${dim}"><path d="${dia(x, y, r * 0.75)}"/></g>`);
  }
  // 값 글자 — 레이어 '지점 강수량 글자'(V)를 켰을 때만. 점만으로도 색 단계는 읽힌다(붐비지 않게 기본은 끔).
  // 센 곳부터, 시군명·특보 딱지·격자 최대 라벨·다른 점·앞 글자와 겹치지 않는 자리에만.
  // 상위 셋은 지점 이름도 단다. 시군을 골랐으면 그 시군 지점만, 이름까지.
  const wet = !OV.has("stnval") ? [] : STN.rows.filter(s => has(s) && val(s) >= steps[0] && (!SEL || s.sigun === SEL)).sort((a, b) => b.v - a.v);
  const named = new Set(wet.slice(0, 3).map(s => s.stn));
  const placed = LABELBOX.concat(boxes), out = [];
  const hit = b => placed.some(p => b.x0 < p.x1 && b.x1 > p.x0 && b.y0 < p.y1 && b.y1 > p.y0);
  const inside = b => b.x0 >= 4 && b.y0 >= 4 && b.x1 <= V.W - 4 && b.y1 <= V.H - 4;
  for (const s of wet) {
    const t = (s.q === "part" ? "≥" : "") + val(s).toFixed(1);
    const nm = SEL || named.has(s.stn) ? s.name : "";
    const w = t.length * fs * 0.6 + (nm ? nm.length * fs * 0.98 + fs * 0.3 : 0) + 4, h = fs * 1.2;
    const ax = V.toX(s.x), ay = V.toY(s.y), gap = r + 3;
    let best = null;
    for (const [dx, dy] of [[gap, -h / 2], [-gap - w, -h / 2], [-w / 2, -gap - h], [-w / 2, gap]]) {
      const b = { x0: ax + dx, y0: ay + dy, x1: ax + dx + w, y1: ay + dy + h };
      if (inside(b) && !hit(b)) { best = b; break; }
    }
    if (!best) continue;                 // 자리가 없으면 글자는 뺀다 — 점(색)은 남는다. 마우스를 올리면 값이 나온다
    placed.push(best);
    out.push(`<text x="${(best.x0 + 2).toFixed(1)}" y="${(best.y0 + h / 2).toFixed(1)}"
      style="font-size:${fs.toFixed(1)}px;stroke-width:${(fs * 0.2).toFixed(1)}px">${t}${nm ? `<tspan class="n" dx="${(fs * 0.3).toFixed(1)}">${nm}</tspan>` : ""}</text>`);
  }
  g.innerHTML = marks.join("") + `<g class="st">${out.join("")}</g>`;
}
function renderStnLegend() {
  const box = $("ly-stn");
  if (!OV.has("stations")) { box.hidden = true; return; }
  box.hidden = false;
  const d = (fill, stroke, extra = "", dash = "") =>
    `<svg viewBox="-8 -8 16 16"><path d="M0,-6L6,0L0,6L-6,0Z" style="fill:${fill};stroke:${stroke};stroke-width:1.5"${dash ? ` stroke-dasharray="${dash}"` : ""}/>${extra}</svg>`;
  const x = `<path d="M-2.6,-2.6L2.6,2.6M-2.6,2.6L2.6,-2.6" style="stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round"/>`;
  const n = SITES?.stations?.length || 0;
  const keys = `<div class="keys2"><span>${d("var(--rain-4)", "var(--ink)")}실측(지도와 같은 색 단계)</span>
    <span>${d("var(--land)", "var(--ink-2)")}0</span><span>${d("none", "var(--ink-3)", x)}결측</span>
    <span>${d("none", "var(--ink-3)", "", "2 2")}값 없음</span></div>`;
  let nt = "";
  if (!STN) nt = `<div class="nt">읽는 중…</div>`;
  else if (STN.err) nt = `<div class="nt w">불러오지 못했다 — ${STN.err}</div>`;
  else if (!stnFresh()) nt = `<div class="nt">읽는 중…</div>`;
  else if (STN.status === "forecast") nt = `<div class="nt">예측 화면 — 관측소는 자리만 찍는다(실측은 지나간 시각에만 있다)</div>`;
  else if (STN.status === "none") nt = `<div class="nt w">이 시각(${hm(STN.tm)}) 관측소 값을 아직 받지 못했다 — 수집기가 격자와 같은 시각으로 받는다</div>`;
  else {
    const ok = STN.rows.filter(s => s.q === "ok" || s.q === "part").length;
    nt = `<div class="nt">${STN.src} · ${ok}곳 값 있음${STN.rows.some(s => s.q === "part") ? " · ≥ 일부 시각 결측(하한)" : ""}</div>`
      + `<div class="nt">면(격자)은 관측소 사이를 메운 분석값이라 관측소 자리에서도 다르다. 점에 마우스를 올리면 둘을 견준다</div>`;
  }
  const un = (STN?.unsited || SITES?.missing || []).map(m => `${m.name}(${m.stn})`).join(" · ");
  box.innerHTML = `<div class="hd2"><b>관측소</b><span class="k">AWS ${n}곳</span><span>${STN && !STN.err && STN.tm && STN.status !== "forecast" ? (CASE ? `${md(STN.tm)} ` : "") + hm(STN.tm) : ""}</span></div>`
    + keys + nt + (un ? `<div class="nt">위치 없음: ${un} — 이 API 들에 자료가 없는 지점</div>` : "");
}
/* 마우스 아래 관측소(지도 좌표 mx,my 에서 가장 가까운 점, 점 크기의 1.5배 안) */
function stationAt(mx, my) {
  if (!OV.has("stations") || !stnFresh() || !V) return null;
  const lim = Math.max(9, STN_R * 1.5);
  let best = null, bd = lim * lim;
  for (const s of STN.rows) {
    const dx = V.toX(s.x) - mx, dy = V.toY(s.y) - my, dd = dx * dx + dy * dy;
    if (dd < bd) { bd = dd; best = s; }
  }
  return best;
}
function stationTip(s) {
  const fac = factor(), gv = valueAt(s.x, s.y), site = SITEBY.get(s.stn);
  const has = s.q === "ok" || s.q === "part";
  const obs = STN.status === "forecast" ? "예측 화면" : has ? `${s.q === "part" ? "≥" : ""}${(s.v * fac).toFixed(1)}㎜`
    : s.q === "missing" ? "결측" : "값 없음";
  const grid = gv === undefined ? "—" : gv === MISSING ? "결측" : `${(gv / 10 * fac).toFixed(1)}㎜`;
  const diff = has && gv !== undefined && gv !== MISSING ? gv / 10 * fac - s.v * fac : null;
  return `<b>${s.name} ${obs}</b> · 관측소 ${s.stn} · ${s.sigun} ${site?.emd || ""}`

}

  for (const b of $("prefs").querySelectorAll("button[data-th]")) b.onclick = () => { setTheme(b.dataset.th); openPrefs(); };
}
function closePrefs() { $("prefs").hidden = true; }
$("prefs").addEventListener("click", ev => { if (ev.target.id === "prefs") closePrefs(); });

async function refreshMeta() {
  if (CASE) return;                       // 사례는 바뀌지 않는다
  let m;
  try { m = await getJson("/api/grid/meta"); } catch { return; }
  const changed = JSON.stringify(m.layers.map(l => l.tm)) !== JSON.stringify((META?.layers || []).map(l => l.tm));
  META = m;
  if (changed && !test) { await loadFlow(); if (!playing) show(); }
  else { buildMenu(); paintHead(); }
}

/* ── 마우스 — 그 칸 값, 좌표, 읍면동. 지도가 옮겨졌으면(타임라인) 그만큼 되돌려 잰다 ── */
async function loadEmd() {
  if (MEMD) return;
  MEMD = true;
  const r = await fetch("/api/grid/geo/mask_emd.u16.gz");
  MEMD = new Uint16Array(await r.arrayBuffer());
  EMDN = new Map(GEO.emd.map(e => [e.id, e]));
}
function valueAt(gx, gy) {
  if (!CUR) return undefined;
  const g = META.grids;
  let c, r;
  if (CUR.grid === "hr") { c = Math.round(gx) - g.hr.i0; r = Math.round(gy) - g.hr.j0; }
  else {
    const [A, B, C] = g.dfs_to_hr.col, [Dd, E, F] = g.dfs_to_hr.row, det = A * E - B * Dd;
    const x = gx - C, y = gy - F;
    c = Math.round((E * x - B * y) / det) - g.dfs.i0;
    r = Math.round((A * y - Dd * x) / det) - g.dfs.j0;
  }
  if (c < 0 || r < 0 || c >= CUR.w || r >= CUR.h) return undefined;
  return CUR.u[r * CUR.w + c];
}
$("stage").addEventListener("mousemove", ev => {
  if (!V || !GEO || ev.target.closest("#tl, #play, #legend")) { $("tip").hidden = true; return; }
  const rc = $("stage").getBoundingClientRect(), x = ev.clientX - rc.left, y = ev.clientY - rc.top;
  const mx = (x - MT.tx) / MT.sc, my = (y - MT.ty) / MT.sc;
  const gx = V.fromX(mx), gy = V.fromY(my), v = valueAt(gx, gy), tip = $("tip");
  const sp = stationAt(mx, my);
  $("stage").style.cursor = sp || sigunAt(gx, gy) ? "pointer" : "";
  if (sp) {                              // 관측소 위 — 실측과 그 칸 격자를 나란히
    highlight(sp.sigun);
    tip.innerHTML = stationTip(sp);
    tip.hidden = false;
    tip.style.left = Math.min(V.W - tip.offsetWidth - 6, x + 16) + "px";
    tip.style.top = Math.max(6, y - tip.offsetHeight - 12) + "px";
    return;
  }
  const hb = META.grids.hr, c = Math.round(gx) - hb.i0, r = Math.round(gy) - hb.j0;
  const inHr = c >= 0 && r >= 0 && c < hb.w && r < hb.h;
  const sg = inHr && MSIG ? GEO.sigun.find(s => s.id === MSIG[r * hb.w + c]) : null;
  highlight(sg && sg.kind === "gn" ? sg.name : null);
  if (v === undefined) { tip.hidden = true; return; }
  loadEmd();
  let where = "";
  if (MEMD instanceof Uint16Array && inHr) {
    const e = EMDN.get(MEMD[r * hb.w + c]);
    if (e) where = `${e.sigun} ${e.name}`;
  }
  if (!where && sg) where = sg.name;
  const [lon, lat] = LCC(gx, gy), fac = factor();
  const val = v === MISSING ? "결측"
    : fac > 1 ? `${(v / 10 * fac).toFixed(1)}㎜/h 환산</b> (15분 ${(v / 10).toFixed(1)}㎜)<b>`
    : `${(v / 10).toFixed(1)}㎜`;
  tip.innerHTML = `<b>${val}</b>${where ? " · " + where : ""}<div class="d">${lat.toFixed(4)}°N ${lon.toFixed(4)}°E · 칸 ${Math.round(gx)}, ${Math.round(gy)}</div>`;
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(V.W - tw - 6, x + 16) + "px";
  tip.style.top = Math.max(6, y - th - 12) + "px";
});
$("stage").addEventListener("mouseleave", () => { $("tip").hidden = true; highlight(null); });
/* 시군을 누르면 고른다 — 오른쪽 패널이 그 시군 읍면동(격자)·지점(AWS)으로 바뀐다. 다시 누르거나 바다를 누르면 푼다 */
$("stage").addEventListener("click", ev => {
  if (!V || !GEO || ev.target.closest("#tl, #play, #legend, #rail, #layers, #tip")) return;
  const rc = $("stage").getBoundingClientRect();
  const mx = (ev.clientX - rc.left - MT.tx) / MT.sc, my = (ev.clientY - rc.top - MT.ty) / MT.sc;
  const sg = sigunAt(V.fromX(mx), V.fromY(my));
  selectSig(sg && sg !== SEL ? sg : null);
});

$("b-test").onclick = () => { test = !test; GRIDS.clear(); STATS.clear(); loadFlow().then(() => show()); loadAlerts(); };
$("b-tl").onclick = () => setTL(!tlOn);
$("tl-x").onclick = () => setTL(false);
$("tl-stat").onclick = () => { SET.tl_stat = SET.tl_stat === "mean" ? "max" : "mean"; saveSetting({ tl_stat: SET.tl_stat }); buildTL(); };
$("b-prefs").onclick = openPrefs;
$("b-help").onclick = () => ($("help").hidden ? openHelp() : closeHelp());
$("acc-h").onclick = toggleBasis;
$("acc-sel").onclick = ev => { ev.stopPropagation(); selectSig(null); };
document.addEventListener("keydown", ev => {
  if (ev.target.closest?.("input, textarea")) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key === ",") { ev.preventDefault(); $("prefs").hidden ? openPrefs() : closePrefs(); return; }
  if (ev.key === "Escape") {
    if (!$("prefs").hidden) closePrefs(); else if (!$("help").hidden) closeHelp(); else if (SEL) selectSig(null);
    return;
  }
  if (ev.key === "?") { $("help").hidden ? openHelp() : closeHelp(); return; }
  if (!$("prefs").hidden || !$("help").hidden || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const i = "1234567".indexOf(ev.key);
  if (i >= 0) { stopPlay(); choose(KINDS[i], true); }
  else if (ev.key === "t" || ev.key === "T") $("b-test").click();
  else if (ev.key === "l" || ev.key === "L") setTL(!tlOn);
  else if (ev.key === "a" || ev.key === "A") setOverlay("alerts", !OV.has("alerts"));
  else if (ev.key === "s" || ev.key === "S") setOverlay("stations", !OV.has("stations"));
  else if ((ev.key === "v" || ev.key === "V") && OV.has("stations")) setOverlay("stnval", !OV.has("stnval"));
  else if (ev.key === "b" || ev.key === "B") toggleBasis();
  else if (ev.key === " " && FLOWK.has(kind)) { ev.preventDefault(); playing ? stopPlay() : startPlay(); }
  else if ((ev.key === "ArrowRight" || ev.key === "ArrowLeft") && FLOW && FLOWK.has(kind)) {
    stopPlay();
    const n = FLOW.frames.length, j = curFrame();
    seek(((j < 0 ? 0 : j) + (ev.key === "ArrowRight" ? 1 : -1) + n) % n);
  }
});

/* 창 크기뿐 아니라 판 크기가 바뀔 때마다(가려졌다 보일 때 포함) 다시 짠다 */
let rsz = null;
const relayout = () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => { if (!GNB) return; PATTERN = null; layout(); draw(); buildTL(); }, 120);
};
window.addEventListener("resize", relayout);
new ResizeObserver(relayout).observe($("stage"));
// 누적 카드는 남는 높이를 다 쓴다 — 다른 카드가 늦게 자리 잡으면(글꼴이 늦게 오는 등) 줄 수를 다시 센다.
// ⚠️ 이게 없으면 처음 잰 낮은 높이로 굳어 아래가 빈 채 '외 8곳'이 나왔다(헤드리스 실측)
let accH = 0, accRz = null;
new ResizeObserver(() => {
  const h = $("acc-b").clientHeight;
  if (Math.abs(h - accH) < 2) return;
  accH = h;
  clearTimeout(accRz);
  accRz = setTimeout(() => { if (CARDS && !CARDS.err && tlOn && SET.panel !== "timeline") { renderAcc(); drawRanks(); cardsPlayhead(); } }, 80);
}).observe($("acc-b"));

async function boot() {
  applyTheme();
  try {
    [META, TOPO, GEO, SITES] = await Promise.all([getJson("/api/grid/meta"),
      getJson("/api/grid/geo/gyeongnam.topo.json"), getJson("/api/grid/geo/grids.json"),
      getJson("/api/grid/geo/stations.json").catch(() => null)]);    // 없어도 지도는 뜬다(관측소 층만 빈다)
    SITEBY = new Map((SITES?.stations || []).map(s => [s.stn, s]));
    MSIG = new Uint8Array(await (await fetch("/api/grid/geo/mask_sigun.u8.gz")).arrayBuffer());
  } catch (e) {
    $("empty").innerHTML = `지도를 띄울 수 없다<small>${e.message}</small>`;
    $("empty").className = "fail"; $("empty").hidden = false;
    return;
  }
  FEAT = topojson.feature(TOPO, TOPO.objects.sigun).features;
  SET = { ...SET_DEFAULT, ...(META.setting || {}) };
  if (CASE) {
    try { await loadCase(); }
    catch (e) {
      $("empty").innerHTML = `사례를 띄울 수 없다<small>${e.message}</small>`;
      $("empty").className = "fail"; $("empty").hidden = false;
      return;
    }
    $("b-test").hidden = true;
    $("b-case").classList.add("on");
    // 끝(전부 쌓인 모습)에서 연다 — 재생하면 처음부터 쌓여 간다. ?tm= 이면 그 시각(봉우리 등)
    OBS_TM = CASEM.frames.includes(Q.get("tm")) ? Q.get("tm") : CASEM.end;
  }
  // 누적 카드 기준 — 실황은 서버 설정(기본 AWS), 사례는 격자에서 연다. ?basis= 가 먼저
  ACC_BASIS = ["aws", "grid"].includes(Q.get("basis")) ? Q.get("basis") : CASE ? "grid" : (SET.acc_basis || "aws");
  if (ORDER_GN().includes(Q.get("sig"))) SEL = Q.get("sig");          // ?sig=창원 — 그 시군을 고른 채로
  OV = new Set(Q.has("ov") ? Q.get("ov").split(",").filter(Boolean)
               : CASE ? ["alerts"] : (SET.overlays || []));
  renderLayers();
  vsrtN = +SET.vsrt_n || 1; x4 = !!SET.x4;
  tlOn = Q.has("tl") ? Q.get("tl") === "1" : (CASE || SEL) ? true : !!SET.tl_on;
  const want = Q.get("layer") || (CASE ? "acc" : SET.layer) || "obs60";   // URL 이 서버 설정보다 먼저다(화면 고정용)
  if (want.startsWith("vsrt")) { kind = "vsrt"; const n = +want.replace(/\D/g, ""); if (n >= 1 && n <= 6) vsrtN = n; }
  else kind = KINDS.includes(want) ? want : "obs60";
  GNB = gnBounds();
  layout();
  await show();
  applyTL(false);                       // 범례가 그려진 뒤에 지도 비켜설 자리를 다시 잰다
  await loadFlow();
  setInterval(refreshMeta, 60000);
  // 카드·특보는 종합 화면처럼 1분마다 다시 읽는다(DB 만 읽는다 — 기상청 호출은 늘지 않는다)
  setInterval(() => { if (!test) { loadCards(); loadAlerts(); } }, 60000);
  loadAlerts();
  // 웹 글꼴이 늦게 오면 카드 높이가 바뀐다 — 다 오면 한 번 더 잰다(누적 카드가 아래를 비운 채 굳지 않게)
  document.fonts?.ready?.then(() => { if (CARDS && !CARDS.err && tlOn && SET.panel !== "timeline") renderCards(); });
  if (Q.has("help")) openHelp(["src", "terms", "how"].includes(Q.get("help")) ? Q.get("help") : "src");   // ?help= — 도움말을 연 채로(안내용 링크)
}
boot();
</script>
