<!--
  경남 강수 지도 — 경계는 SVG, 격자는 Canvas, 오른쪽에 강수 타임라인(사이드바).

  ⚠️ 경계를 d3.geoConicConformal 로 투영하지 않는다. 그건 구면이라 500m 격자(타원체)와
     경남 안에서 최대 800m 어긋난다(README '경남 지도' 실측). 경계는 서버가 미리 **500m 격자
     칸 좌표**로 바꿔 두었고, 여기서는 칸 좌표 → 화면에 축척 하나만 곱한다(toX·toY).
     격자 Canvas 도 같은 toX·toY 로 놓으므로 두 층이 어긋날 수 없다.
  ⚠️ 칸 좌표는 칸 가운데가 정수다. 칸 (i, j) 는 [i-0.5, i+0.5] × [j-0.5, j+0.5] 를 덮는다.
     행은 남→북이라 화면에 그릴 때만 뒤집는다.
  ⚠️ 5km 층은 5km 칸 그대로 찍고 아핀 하나(grids.json dfs_to_hr)로 얹는다. 두 격자는 지구
     모양이 달라 정확히 포개지지 않는다 — 경남 안 잔차 0.016칸(8m).

  재생 — '1시간 강수량'의 흐름 하나: 지난 N시간 실측(60분, 설정한 간격) → 지금 → 초단기 +1~6h.
  지도와 타임라인이 **같은 프레임 목록(/api/grid/flow)과 같은 재생 위치**를 쓴다. 타임라인을
  끌면 지도가 따라오고, 지도가 넘어가면 타임라인의 세로선·점·값이 따라온다.
  ⚠️ 예측은 1시간 간격뿐이다(초단기 격자에 10분 대상시각을 주면 가까운 정시가 온다 — 실측).
-->
<style>
/* 토큰은 index.html 과 같은 이름·같은 값이다. 한쪽만 고치지 않는다. */
:root {
  --ground: #090D13; --panel: #111823; --panel-2: #18202C; --raised: #1E2836;
  --line: #222D3C; --line-soft: #1A2330;
  --ink: #E8EEF6; --ink-2: #94A5B8; --ink-3: #5C6D80;
  --accent: #2FA3DC;
  --rain-0: #16202C; --rain-1: #1B3A55; --rain-2: #1E5B87; --rain-3: #2280B8;
  --rain-4: #2FA3DC; --rain-5: #5EC3EE; --rain-6: #96DBF6; --rain-7: #D7F0FC;
  --lv-fail: #FF8A5B; --lv-ok: #3FB98A;

  /* 지도 전용 */
  --sea: #090D13;
  --land: #131B26;
  --land-nb: #0F151D;
  --bd: #3B4B5F;          /* 시군 경계 */
  --coast: #4F6178;       /* 해안선·바깥 경계 */
  --zone: #A9BACD;        /* 권역 경계 */
  --halo: #090D13;        /* 글자 테두리 — 칠해진 칸 위에서도 읽히게 */
  --hatch: #8093A8;       /* 결측 빗금 */
  --nb-ink: #56677B;
  --test: #7B5CC8;        /* 테스트 모드 — 특보 예약색(노랑·빨강·보라 중대경보)과 겹치지 않는 남보라 */
  --on-accent: #06121B;

  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="light"] {
  --ground: #EEF2F7; --panel: #FFFFFF; --panel-2: #F5F8FC; --raised: #E8EEF6;
  --line: #D3DCE7; --line-soft: #E5EBF3;
  --ink: #101821; --ink-2: #47596D; --ink-3: #7688A0;
  --accent: #1B7FBF;
  --rain-0: #F1F5FA; --rain-1: #DDEDF8; --rain-2: #BADCF1; --rain-3: #86C0E4;
  --rain-4: #2E86C2; --rain-5: #1B6698; --rain-6: #0E4A73; --rain-7: #073050;
  --lv-fail: #C4521E; --lv-ok: #12805A;
  --sea: #E2E9F1;
  --land: #FFFFFF;
  --land-nb: #F2F5F9;
  --bd: #A3B1C2;
  --coast: #7F90A5;
  --zone: #2E3D50;
  --halo: #FFFFFF;
  --hatch: #6A7C92;
  --nb-ink: #8C9BAE;
  --on-accent: #FFFFFF;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  overflow: hidden;
}
button { font-family: inherit; }

/* ── 머리 ── */
#hd {
  flex: none; display: flex; align-items: center; gap: 18px;
  padding: 10px 18px; min-height: 64px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
#hd .ttl { display: flex; align-items: baseline; gap: 14px; min-width: 0; flex-wrap: wrap; }
#lname { font-size: 30px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
#ltime { font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--ink); white-space: nowrap; }
#lsrc { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.badge {
  display: inline-block; font-size: 14px; font-weight: 600; padding: 2px 9px; border-radius: 5px;
  border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap;
}
.badge.warn { color: var(--lv-fail); border-color: color-mix(in oklab, var(--lv-fail) 55%, var(--line)); }
.badge.test { color: #fff; background: var(--test); border-color: var(--test); }
.badge.past { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 50%, var(--line)); }
#hd .sp { flex: 1; }

/* 오른쪽 위 층 메뉴 */
#menu { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
#menu .grp { display: flex; align-items: center; gap: 4px; }
#menu .gl { font-size: 12px; color: var(--ink-3); margin-right: 4px; letter-spacing: .08em; }
#menu button, #tools button {
  font: 600 14px var(--sans); color: var(--ink-2); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; white-space: nowrap;
}
#menu button:hover, #tools button:hover { color: var(--ink); border-color: var(--ink-3); }
#menu button.on { color: var(--ink); background: color-mix(in oklab, var(--accent) 22%, transparent);
  border-color: color-mix(in oklab, var(--accent) 60%, var(--line)); }
#menu button.none { opacity: .45; }
#menu button.late::after { content: "·"; color: var(--lv-fail); font-weight: 800; margin-left: 3px; }
#tools { display: flex; gap: 6px; }
#tools button.on { color: var(--ink); background: color-mix(in oklab, var(--accent) 22%, transparent);
  border-color: color-mix(in oklab, var(--accent) 60%, var(--line)); }
#tools #b-test.on { color: #fff; background: var(--test); border-color: var(--test); }

/* ── 지도 ── */
#stage { position: relative; flex: 1; min-height: 0; background: var(--sea); overflow: hidden; }
/* 지도 세 겹(땅·격자·선)을 한 덩어리로 움직인다 — 타임라인이 나오면 왼쪽으로 비켜선다 */
#mapwrap { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .55s var(--ease); }
#mapwrap > svg, #mapwrap > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#cv, #ghost { transition: opacity .3s; }
#ghost { pointer-events: none; opacity: 0; }
#stage.late #cv { opacity: .4; }
#over { pointer-events: none; }
#over .sg { fill: none; stroke: var(--bd); stroke-width: 1; }
#over .cs { fill: none; stroke: var(--coast); stroke-width: 1.1; }
#over .zn { fill: none; stroke: var(--zone); stroke-width: 2.6; stroke-dasharray: 9 6; stroke-linecap: round; }
#over .sb { fill: none; stroke: var(--zone); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .8; }
#over #hl { fill: color-mix(in oklab, var(--accent) 12%, transparent); stroke: var(--accent); stroke-width: 3;
  opacity: 0; transition: opacity .2s; }
#over #hl.on { opacity: 1; }
#over text { paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; }
#over .nm { font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
#over .nm.nb { fill: var(--nb-ink); font-weight: 600; }
#over .mx { font-family: var(--mono); font-weight: 700; fill: var(--ink); }
#over .mxw { font-weight: 500; fill: var(--ink-2); }
#over .pin { fill: var(--ink); stroke: var(--halo); }
#over .lead { stroke: var(--ink-2); stroke-width: 1; }
#under .ld { fill: var(--land); }
#under .ld.nb { fill: var(--land-nb); }

/* 범례 — 상자는 색 띠에만 두른다(README '예측 분포 범례'). 글자는 지도 위에 그대로. */
#legend { position: absolute; left: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 8px;
  font-family: var(--mono); color: var(--ink); text-shadow: 0 0 3px var(--halo), 0 0 6px var(--halo); }
#legend .lt { font: 600 15px var(--sans); display: flex; align-items: center; gap: 10px; }
#legend .band { display: flex; flex-direction: column-reverse; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; width: 30px; }
#legend .band i { display: block; height: 26px; }
#legend .rows { display: flex; gap: 10px; align-items: stretch; margin-bottom: 8px; }
/* 눈금 숫자는 칸의 **아래 끝**(그 값부터 이 색)에 맞춘다 */
#legend .ticks { position: relative; width: 44px; font-size: 15px; font-weight: 600; }
#legend .ticks span { position: absolute; left: 0; transform: translateY(50%); line-height: 1; }
#legend .sw { display: flex; align-items: center; gap: 8px; font: 500 13px var(--sans); color: var(--ink-2); }
#legend .sw b { width: 30px; height: 16px; border: 1px solid var(--line); border-radius: 3px; display: inline-block; }
#legend .sw b.h { background: repeating-linear-gradient(135deg, transparent 0 3px, var(--hatch) 3px 4.5px); }
#legend button { font: 600 13px var(--sans); color: var(--ink-2); background: var(--panel); border: 1px solid var(--line);
  border-radius: 5px; padding: 2px 8px; cursor: pointer; text-shadow: none; }
#legend button.on { color: var(--ink); border-color: var(--accent); }

/* ── 재생 막대 — 지난 실측 → 지금 → 예측을 한 줄로 ── */
#play { position: absolute; left: var(--playx, 50%); bottom: 18px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px;
  background: color-mix(in oklab, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.28); transition: left .55s var(--ease); }
#play .pp { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2);
  color: var(--ink); font-size: 16px; cursor: pointer; flex: none; }
#play .pp:hover { border-color: var(--accent); }
#play svg { display: block; cursor: pointer; touch-action: none; }
#play .lab { min-width: 150px; font-family: var(--mono); line-height: 1.15; }
#play .lab b { display: block; font-size: 20px; font-weight: 600; }
#play .lab small { font: 600 12px var(--sans); color: var(--ink-3); letter-spacing: .04em; }
#play .lab small.fc { color: var(--accent); }
.trk-past { fill: color-mix(in oklab, var(--ink) 9%, transparent); }
.trk-fc { fill: url(#fc-hatch); }
.trk-tick { stroke: var(--ink-3); stroke-width: 1; }
.trk-hour { font: 500 11px var(--mono); fill: var(--ink-3); text-anchor: middle; }
.trk-now { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 3 3; }
.trk-nowl { font: 700 11px var(--sans); fill: var(--ink-2); text-anchor: middle; }
.trk-head { stroke: var(--accent); stroke-width: 2.5; }
.trk-knob { fill: var(--accent); stroke: var(--halo); stroke-width: 2.5; }

/* ── 강수 타임라인 — 오른쪽 사이드바. 화면 높이를 다 쓴다 ── */
#tl { position: absolute; top: 0; right: 0; bottom: 0; width: var(--tlw, 640px);
  display: flex; flex-direction: column;
  background: color-mix(in oklab, var(--panel) 90%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-left: 1px solid var(--line); box-shadow: -18px 0 50px rgba(0,0,0,.30);
  transform: translateX(105%); transition: transform .55s var(--ease); }
body.tl-on.panel-tl #tl { transform: none; }
#tl .hd { display: flex; align-items: baseline; gap: 12px; padding: calc(14px * var(--k, 1)) calc(18px * var(--k, 1)) calc(4px * var(--k, 1)); }
#tl .hd b { font-size: calc(21px * var(--k, 1)); font-weight: 700; }
#tl .hd span { font-size: calc(13px * var(--k, 1)); color: var(--ink-2); }
#tl .hd .sp { flex: 1; }
#tl .hd button { font: 600 calc(13px * var(--k, 1)) var(--sans); color: var(--ink-2); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; cursor: pointer; }
#tl .hd button.on { color: var(--ink); border-color: var(--accent); }
#tl .bd { position: relative; flex: 1; min-height: 0; }
#tl svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tl-row { cursor: pointer; }
.tl-bg { fill: transparent; }
.tl-row:hover .tl-bg, .tl-row.hov .tl-bg { fill: color-mix(in oklab, var(--accent) 10%, transparent); }
.tl-row.top .tl-bg { fill: color-mix(in oklab, var(--accent) 16%, transparent); }
.tl-sep { stroke: var(--line-soft); }
.tl-name { font-weight: 700; fill: var(--ink); dominant-baseline: central; }
.tl-name.tot { fill: var(--accent); }
.tl-area { fill: color-mix(in oklab, var(--rain-4) 28%, transparent); }
.tl-line { fill: none; stroke: var(--rain-5); stroke-width: 1.8; stroke-linejoin: round; }
.tl-farea { fill: color-mix(in oklab, var(--rain-4) 12%, transparent); }
.tl-fline { fill: none; stroke: var(--rain-5); stroke-width: 1.6; stroke-dasharray: 5 4; opacity: .85; }
.tl-peak { font-family: var(--mono); font-weight: 600; fill: var(--ink-2); text-anchor: middle; }
.tl-val { font-family: var(--mono); font-weight: 700; fill: var(--ink); text-anchor: end; dominant-baseline: central; }
.tl-val.zero { fill: var(--ink-3); font-weight: 500; }
.tl-fczone { fill: color-mix(in oklab, var(--accent) 5%, transparent); }
.tl-hour { font-family: var(--mono); fill: var(--ink-3); text-anchor: middle; }
.tl-now { stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 3 4; }
.tl-nowl { font-weight: 700; fill: var(--ink-2); text-anchor: middle; }
.tl-zl { font-weight: 600; fill: var(--ink-3); letter-spacing: .06em; }
/* 재생 위치는 미끄러지듯 옮겨 간다 — 지도가 겹쳐 넘어가는 시간(.3s)과 맞춘다 */
.tl-head { stroke: var(--accent); stroke-width: 2.2; transition: transform .3s var(--ease); }
.tl-dot { stroke: var(--halo); stroke-width: 2; transition: cx .3s var(--ease), cy .3s var(--ease), fill .3s; }
.trk-head, .trk-knob { transition: transform .3s var(--ease); }
#tl-svg.noanim *, #trk.noanim * { transition: none !important; }
.tl-empty { fill: var(--ink-3); text-anchor: middle; }

/* ── 오른쪽 카드 — 종합 화면(강수 모니터링)의 판을 작게. 지도 오른쪽 바다 위에 떠 있다 ──
   딱 맞춘 격자 대신 카드가 지도 위에 겹쳐 뜨고, 뒤로는 지도가 그라데이션으로 가라앉는다.
   줄에 마우스를 올리면 지도의 그 시군까지 빛줄이 그어진다(#links). */
#scrim { position: absolute; top: 0; right: 0; bottom: 0; width: calc(var(--tlw, 640px) + 180px); pointer-events: none;
  background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--sea) 50%, transparent) 32%,
              color-mix(in oklab, var(--sea) 80%, transparent));
  opacity: 0; transition: opacity .6s var(--ease); }
body.tl-on.panel-cards #scrim { opacity: 1; }
#rail { position: absolute; top: 16px; right: 16px; bottom: 16px; width: calc(var(--tlw, 640px) - 20px);
  display: flex; flex-direction: column; gap: 14px; pointer-events: none; }
.card { pointer-events: auto; position: relative; display: flex; flex-direction: column; min-height: 0;
  background: color-mix(in oklab, var(--panel) 80%, transparent);
  backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15);
  border: 1px solid color-mix(in oklab, var(--line) 85%, transparent); border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,.34), inset 0 1px 0 color-mix(in oklab, var(--ink) 6%, transparent);
  transform: translateX(calc(100% + 48px)); opacity: 0;
  transition: transform .6s var(--ease), opacity .45s; }
.card::before { content: ""; position: absolute; left: 22px; right: 22px; top: -1px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .6; }
body.tl-on.panel-cards .card { transform: none; opacity: 1; }
.card:nth-child(2) { transition-delay: .08s; }
.card:nth-child(3) { transition-delay: .16s; }
#c-acc { flex: 1 1 auto; }
#c-now, #c-fc { flex: none; }
.ch { display: flex; align-items: center; gap: 10px; padding: calc(12px * var(--k, 1)) calc(16px * var(--k, 1)) calc(6px * var(--k, 1)); }
.ch h3 { margin: 0; font-size: calc(16px * var(--k, 1)); font-weight: 700; white-space: nowrap; }
.ch .sub { font-size: calc(12px * var(--k, 1)); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ch .sp { flex: 1; }
.ch .bt { font: 600 calc(12px * var(--k, 1)) var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.ch .src { font: 600 calc(11px * var(--k, 1)) var(--sans); color: var(--accent); white-space: nowrap; }
.ch .src.fell { color: var(--lv-fail); }
.ch .live { width: 7px; height: 7px; border-radius: 50%; background: var(--lv-ok); flex: none; animation: pulse 2.4s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--lv-ok) 55%, transparent); }
  70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.cb { position: relative; flex: 1; min-height: 0; overflow: hidden; padding: 0 calc(10px * var(--k, 1)) calc(10px * var(--k, 1)); }

<script>
"use strict";
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const MISSING = 65535;

/* ── 층 ───────────────────────────────────────────────────────────────
   색 단계는 7칸(--rain-1 ~ --rain-7). 0 은 칠하지 않는다.
   면을 칠하므로 '지금 오는 비' 표보다 한 칸 아래(0.1㎜)부터 보인다.
   15분치와 60분치는 크기가 다른 값이라 단계를 따로 둔다 — 같은 눈금이면 15분에 8㎜
   (시간당 32㎜의 기세)가 옅은 색으로 묻힌다. ×4 로 보면 60분 단계를 쓴다(index.html 과 같은 규칙). */
const STEPS = {
  m15: [0.1, 0.5, 2, 5, 8, 12, 18],
  m60: [0.1, 1, 5, 10, 20, 30, 50],
  day: [0.1, 5, 10, 30, 50, 80, 150],

const KINDS = ["obs15", "obs60", "obsday", "odam", "vsrt", "shrt_today", "shrt_tomorrow"];
const FLOWK = new Set(["obs60", "vsrt"]);              // 재생 흐름(1시간 강수량)에 드는 층
const COLLECT_OF = { obs15: "grid", obs60: "grid", obsday: "grid", odam: "odam", vsrt: "forecast",
                     shrt_today: "short", shrt_tomorrow: "short" };
const SET_DEFAULT = { flow_step: 10, flow_hours: 6, play_ms: 1200, tl_on: false, tl_stat: "max",
                      panel: "cards", acc_hours: 12 };

let META = null, TOPO = null, GEO = null, MSIG = null, MEMD = null, EMDN = null;
let SET = { ...SET_DEFAULT };
let kind = "obs60", vsrtN = 1, x4 = false;
let OBS_TM = null;                      // 60분 층을 지난 시각으로 볼 때(재생·끌기)
let test = Q.get("test") === "1";
let CUR = null, CURSTAT = null;          // 지금 그리는 격자, 시군 통계
let FLOW = null;                        // /api/grid/flow — 재생 프레임과 시군 시계열
let playing = null;
let tlOn = false;
const GRIDS = new Map(), STATS = new Map();
let V = null;                           // 화면 틀(지도 칸 좌표 → 화면)
let MT = { tx: 0, ty: 0, sc: 1 };       // 타임라인이 나와 지도를 옮긴 만큼
let NAMEBOX = [];
let FEAT = null;                        // 시군 GeoJSON(강조용)

const layerKey = () => kind === "vsrt" ? `vsrt+${vsrtN}` : kind;
const metaOf = k => (META?.layers || []).find(x => x.id === k) || {};
const stepsOf = k => k === "obs15" ? (x4 ? STEPS.m60 : STEPS.m15)
  : (k === "obsday" || k.startsWith("shrt")) ? STEPS.day : STEPS.m60;
const factor = () => (kind === "obs15" && x4) ? 4 : 1;
const tOf = key => new Date(+key.slice(0, 4), +key.slice(4, 6) - 1, +key.slice(6, 8),
                            +key.slice(8, 10) || 0, +key.slice(10, 12) || 0).getTime();

async function getJson(u) {
  const r = await fetch(u, { cache: "no-cache" });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

/* ── 테마 — index.html 과 같은 자리(gn-theme)에 둔다. 한쪽에서 바꾸면 둘 다 따라간다. ── */
function applyTheme(t) {
  let th = t || Q.get("theme");
  if (!th) { try { th = localStorage.getItem("gn-theme"); } catch {} }
  th = th === "light" ? "light" : "dark";

}

  try { localStorage.setItem("gn-theme", th); } catch {}
  LUTS.clear(); OFF.clear(); PATTERN = null;
  draw(); buildLegend(); buildPlay(); buildTL();
}

/* ── 투영(칸 → 경위도). 마우스를 올렸을 때 좌표만 쓴다 — 그리기에는 쓰지 않는다.
   app/domain/gridproj.py 와 같은 식: GRS80 타원체 람베르트, 30°·60°, 126°E·38°N. ── */
const LCC = (() => {
  const D = Math.PI / 180, a = 6378137, f = 1 / 298.257222101, e = Math.sqrt(f * (2 - f));
  const m = p => Math.cos(p) / Math.sqrt(1 - e * e * Math.sin(p) ** 2);
  const t = p => Math.tan(Math.PI / 4 - p / 2) / ((1 - e * Math.sin(p)) / (1 + e * Math.sin(p))) ** (e / 2);
  const p1 = 30 * D, p2 = 60 * D, p0 = 38 * D;
  const n = (Math.log(m(p1)) - Math.log(m(p2))) / (Math.log(t(p1)) - Math.log(t(p2)));
  const AF = a * m(p1) / (n * t(p1) ** n), rho0 = AF * t(p0) ** n;
  return (col, row) => {
    const x = (col - 880) * 500, y = (row - 1540) * 500, dy = rho0 - y;
    const rho = Math.hypot(x, dy), th = Math.atan2(x, dy), tt = (rho / AF) ** (1 / n);
    let phi = Math.PI / 2 - 2 * Math.atan(tt);
    for (let i = 0; i < 15; i++) {
      const s = Math.sin(phi);
      phi = Math.PI / 2 - 2 * Math.atan(tt * ((1 - e * s) / (1 + e * s)) ** (e / 2));
    }
    return [th / n / D + 126, phi / D];
  };
})();

/* ── 화면 틀: 칸 좌표 → 화면 ─────────────────────────────────────────── */
function gnBounds() {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const ft of FEAT) {
    if (ft.properties.kind !== "gn") continue;
    // 섬이 없는 시군은 mapshaper 가 Polygon 으로 내보낸다
    const polys = ft.geometry.type === "Polygon" ? [ft.geometry.coordinates] : ft.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) for (const [x, y] of ring) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  return { x0, x1, y0, y1 };
}
let GNB = null;
function layout() {
  const k = Math.max(1, Math.min(innerWidth / 1920, innerHeight / 1080));
  document.documentElement.style.setProperty("--k", k.toFixed(3));
  const r = $("stage").getBoundingClientRect();
  const W = r.width, H = r.height, dpr = window.devicePixelRatio || 1;
  const m = 5;                                  // 칸 — 경남 바깥으로 2.5km 여유
  const X0 = GNB.x0 - m, X1 = GNB.x1 + m, Y0 = GNB.y0 - m, Y1 = GNB.y1 + m;
  const s = Math.min(W / (X1 - X0), H / (Y1 - Y0));
  const ox = (W - (X1 - X0) * s) / 2, oy = (H - (Y1 - Y0) * s) / 2;
  V = { W, H, dpr, k, s, ox, oy, X0, X1, Y0, Y1,
        toX: gx => ox + (gx - X0) * s, toY: gy => oy + (Y1 - gy) * s,
        fromX: x => X0 + (x - ox) / s, fromY: y => Y1 - (y - oy) / s };
  for (const id of ["cv", "ghost"]) {
    const c = $(id);
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  }
  for (const id of ["under", "over"]) $(id).setAttribute("viewBox", `0 0 ${W} ${H}`);
  buildBase();
  applyTL(false);
}

/* 격자 Canvas 의 픽셀 (px, py) → 화면. 픽셀 (c, r) 은 [c, c+1] × [r, r+1] 이고 행은 북→남으로
   뒤집어 담았다. 5km 는 아핀(dfs_to_hr)을, 500m 는 항등을 거친다 — 식은 하나다. */
function pixelTransform(grid, h) {
  const g = META.grids, b = g[grid];
  const [A, B, C] = grid === "hr" ? [1, 0, 0] : g.dfs_to_hr.col;
  const [Dd, E, F] = grid === "hr" ? [0, 1, 0] : g.dfs_to_hr.row;
  const x0 = b.i0 - 0.5, y0 = b.j0 + h - 0.5;           // 픽셀 (0,0) 모서리의 칸 좌표
  const c0 = A * x0 + B * y0 + C, r0 = Dd * x0 + E * y0 + F;
  const s = V.s;
  return [s * A, -s * Dd, -s * B, s * E, V.ox + (c0 - V.X0) * s, V.oy + (V.Y1 - r0) * s];
}

/* ── 경계(아래: 땅 칠, 위: 선·이름) ───────────────────────────────────── */
let PATH = null;
function buildBase() {
  PATH = d3.geoPath(d3.geoTransform({ point(x, y) { this.stream.point(V.toX(x), V.toY(y)); } }));
  const obj = TOPO.objects.sigun;
  const P = g => g.properties;
  $("under").innerHTML = FEAT.map(ft => `<path class="ld ${P(ft).kind === "nb" ? "nb" : ""}" d="${PATH(ft)}"/>`).join("");

  const mesh = fn => PATH(topojson.mesh(TOPO, obj, fn)) || "";
  const sg = mesh((a, b) => a !== b);                                   // 시군 사이
  const cs = mesh((a, b) => a === b);                                   // 해안·바깥
  const zn = mesh((a, b) => a !== b && P(a).zone !== P(b).zone);        // 권역이 바뀌는 곳
  const sb = mesh((a, b) => a !== b && P(a).zone === P(b).zone && P(a).sub !== P(b).sub);
  const fs = Math.max(15, Math.min(64, V.s * 7));
  FSN = fs;
  NAMEBOX = [];
  const names = FEAT.map(ft => {
    const p = P(ft), x = V.toX(p.lx), y = V.toY(p.ly), nb = p.kind === "nb";
    const f = nb ? fs * 0.72 : fs;
    NAMEBOX.push({ x0: x - p.sigun.length * f * 0.52, x1: x + p.sigun.length * f * 0.52,
                   y0: y - f * 0.6, y1: y + f * 0.6 });
    return `<text class="nm ${nb ? "nb" : ""}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"
      style="font-size:${f.toFixed(1)}px;stroke-width:${(f * 0.16).toFixed(1)}px">${p.sigun}</text>`;
  }).join("");
  $("over").innerHTML =
    `<path class="sg" d="${sg}"/><path class="cs" d="${cs}"/><path class="sb" d="${sb}"/><path class="zn" d="${zn}"/>`
    + `<path id="hl"/><g id="labels"></g><g id="names">${names}</g><g id="ranks"></g>`;
  HL = null;
  drawRanks();
}
let FSN = 20;                           // 시군명 글자 크기(순위 표식 자리 잡는 데 쓴다)

/* 한 시군 강조 — 타임라인 줄과 지도가 서로를 가리킨다 */
let HL = null;
function highlight(name) {
  if (HL === name) return;
  HL = name;
  const p = $("hl");
  if (p) {
    const ft = name && FEAT.find(f => f.properties.sigun === name);
    if (ft) p.setAttribute("d", PATH(ft));
    p.classList.toggle("on", !!ft);
  }
  for (const r of document.querySelectorAll(".tl-row, .ar, .mr, .fr"))
    r.classList.toggle("hov", !!name && r.dataset.s === name);
}

/* ── 색 ─────────────────────────────────────────────────────────────── */
function cssColor(name) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const h = v.replace("#", "");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
const LUTS = new Map();
/* 0.1㎜ 정수값 → RGBA(Uint32, 리틀엔디언 ABGR). 65536 칸짜리 표를 한 번 만들어 둔다. */
function lut(steps, fac) {
  const key = steps.join(",") + "|" + fac + "|" + document.documentElement.dataset.theme;
  if (LUTS.has(key)) return LUTS.get(key);
  const cols = [1, 2, 3, 4, 5, 6, 7].map(i => cssColor(`--rain-${i}`))
    .map(([r, g, b]) => (255 << 24 | b << 16 | g << 8 | r) >>> 0);
  const t = new Uint32Array(65536);
  const th = steps.map(x => x * 10 / fac - 1e-6);   // 0.1㎜ 정수값 기준
  let k = -1;
  for (let v = 0; v < 65535; v++) {
    while (k + 1 < th.length && v >= th[k + 1]) k++;
    t[v] = k < 0 ? 0 : cols[k];
  }
  LUTS.set(key, t);
  return t;
}
/* 값 → 색 단계(1~7, 0 = 칠하지 않음). 타임라인 점도 지도와 **같은 색**이 되게 같은 단계를 쓴다. */
function stepIdx(v, steps) {
  let k = 0;
  if (v == null) return 0;
  steps.forEach((t, i) => { if (v >= t) k = i + 1; });
  return k;
}

/* 5km 칸마다 '땅이 조금이라도 걸치나' — 결측 빗금은 땅에만 긋는다.
   경남 bbox 안의 결측은 거의 다 분석 영역 밖 바다(늘 같은 칸)라 빗금을 치면 바다가 온통 회색이 된다. */
let LAND5 = null;
function landMask(grid, h, w) {
  if (grid === "hr") return MSIG;
  if (LAND5) return LAND5;
  const g = META.grids, hb = g.hr, db = g.dfs, [A, B, C] = g.dfs_to_hr.col, [Dd, E, F] = g.dfs_to_hr.row;
  LAND5 = new Uint8Array(h * w);
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    let on = 0;
    for (let a = -2; a <= 2 && !on; a++) for (let b = -2; b <= 2 && !on; b++) {
      const x5 = db.i0 + c + a / 5, y5 = db.j0 + r + b / 5;
      const cc = Math.round(A * x5 + B * y5 + C) - hb.i0, rr = Math.round(Dd * x5 + E * y5 + F) - hb.j0;
      if (cc >= 0 && cc < hb.w && rr >= 0 && rr < hb.h && MSIG[rr * hb.w + cc]) on = 1;
    }
    LAND5[r * w + c] = on;
  }
  return LAND5;
}

/* 격자 한 장을 칸 = 픽셀인 작은 그림으로. 층·눈금·테마마다 한 번만 만든다. */
const OFF = new Map();
function offscreen(gr) {
  const steps = stepsOf(kind), fac = factor();
  const key = gr.ck + "|" + steps.join(",") + "|" + fac + "|" + document.documentElement.dataset.theme;
  if (OFF.has(key)) return OFF.get(key);
  const { h, w, u, grid } = gr;
  const table = lut(steps, fac), land = landMask(grid, h, w);
  const img = document.createElement("canvas"); img.width = w; img.height = h;
  const ic = img.getContext("2d"), id = ic.createImageData(w, h), px = new Uint32Array(id.data.buffer);
  const miss = document.createElement("canvas"); miss.width = w; miss.height = h;
  const mc = miss.getContext("2d"), md = mc.createImageData(w, h), mp = new Uint32Array(md.data.buffer);
  let nmiss = 0;
  for (let r = 0; r < h; r++) {
    const src = r * w, dst = (h - 1 - r) * w;                // 행 남→북 → 그림은 위가 북
    for (let c = 0; c < w; c++) {
      const v = u[src + c];
      if (v === MISSING) {
        if (land[src + c]) { mp[dst + c] = 0xff000000; nmiss++; }
      } else px[dst + c] = table[v];
    }
  }
  ic.putImageData(id, 0, 0);
  mc.putImageData(md, 0, 0);
  const o = { img, miss: nmiss ? miss : null, nmiss };
  if (OFF.size > 120) OFF.clear();
  OFF.set(key, o);
  return o;
}

let PATTERN = null, HATCH = null;
function hatchPattern(ctx) {
  if (PATTERN) return PATTERN;
  const d = Math.max(1, V.dpr), n = Math.round(7 * d);
  const p = document.createElement("canvas"); p.width = p.height = n;
  const c = p.getContext("2d");
  const [r, g, b] = cssColor("--hatch");
  c.strokeStyle = `rgb(${r},${g},${b})`; c.lineWidth = 1.4 * d;
  c.beginPath(); c.moveTo(-1, n + 1); c.lineTo(n + 1, -1); c.stroke();
  PATTERN = ctx.createPattern(p, "repeat");
  return PATTERN;
}

let RENDER_MS = 0;
/* fade: 재생·끌기로 프레임이 넘어갈 때 앞 그림을 잠깐 남겨 겹쳐 사라지게 한다(뚝뚝 끊기지 않게). */
function draw(fade = false) {
  const cv = $("cv"), ctx = cv.getContext("2d");
  const t0 = performance.now();
  if (fade && cv.width && cv.height) {
    const g = $("ghost"), gc = g.getContext("2d");
    g.style.transition = "none"; g.style.opacity = "1";
    gc.setTransform(1, 0, 0, 1, 0, 0); gc.clearRect(0, 0, g.width, g.height); gc.drawImage(cv, 0, 0);
    requestAnimationFrame(() => { g.style.transition = ""; g.style.opacity = "0"; });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  // ⚠️ 판 크기가 0 이면(창이 가려진 채 열림 등) 그리지 않는다. 0×0 캔버스를 drawImage 하면
  //    예외가 나 머리글까지 안 그려졌다. 크기가 잡히면 ResizeObserver 가 다시 부른다.
  if (!CUR || !V || !cv.width || !cv.height || !V.s) { drawLabels(); return; }
  const o = offscreen(CUR);
  const T = pixelTransform(CUR.grid, CUR.h).map(x => x * V.dpr);
  ctx.imageSmoothingEnabled = false;                         // 칸 그대로 — 번지게 하지 않는다
  ctx.setTransform(...T);
  ctx.drawImage(o.img, 0, 0);
  if (o.miss) {
    // 빗금을 화면 크기로 깔고, 결측 칸 모양으로 도려낸다(destination-in)
    HATCH = HATCH || document.createElement("canvas");
    if (HATCH.width !== cv.width || HATCH.height !== cv.height) { HATCH.width = cv.width; HATCH.height = cv.height; }
    const hc = HATCH.getContext("2d");
    hc.setTransform(1, 0, 0, 1, 0, 0); hc.globalCompositeOperation = "source-over";
    hc.clearRect(0, 0, HATCH.width, HATCH.height);
    hc.fillStyle = hatchPattern(hc); hc.fillRect(0, 0, HATCH.width, HATCH.height);
    hc.globalCompositeOperation = "destination-in"; hc.imageSmoothingEnabled = false;
    hc.setTransform(...T); hc.drawImage(o.miss, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(HATCH, 0, 0);
  }
  drawLabels();
  RENDER_MS = performance.now() - t0;
}

/* ── 시군 최대 라벨 — 값이 있는 시군만. 이름·앞 라벨과 겹치면 자리를 옮긴다. ── */
function drawLabels() {
  const g = $("labels");
  if (!g) return;
  if (!CURSTAT || !V || !V.s) { g.innerHTML = ""; return; }
  const fac = factor(), min = stepsOf(kind)[0];
  const rows = CURSTAT.rows.filter(r => r.kind === "gn" && r.max != null && r.max * fac >= min && r.where)
    .sort((a, b) => b.max - a.max);
  const fs = Math.max(14, Math.min(58, V.s * 6.2)), fs2 = fs * 0.62;
  // 다른 시군의 점 바로 옆에 붙으면 누구 값인지 헷갈린다 — 점 자리도 미리 비워 둔다
  const pr = fs * 0.45;
  const placed = NAMEBOX.concat(rows.map(r => {
    const x = V.toX(r.where.col), y = V.toY(r.where.row);
    return { x0: x - pr, x1: x + pr, y0: y - pr, y1: y + pr };
  })), out = [];
  const hit = b => placed.some(p => b.x0 < p.x1 && b.x1 > p.x0 && b.y0 < p.y1 && b.y1 > p.y0);
  const inside = b => b.x0 >= 4 && b.y0 >= 4 && b.x1 <= V.W - 4 && b.y1 <= V.H - 4;
  for (const r of rows) {
    const ax = V.toX(r.where.col), ay = V.toY(r.where.row);
    const val = (r.max * fac).toFixed(1);
    const emd = r.where.emd || "";
    const w = Math.max(val.length * fs * 0.62, emd.length * fs2 * 1.02) + 4, h = fs + fs2 + 2;
    const pad = pr + 3;                      // 제 점 자리(pr)는 건너뛴다
    let best = null;
    for (const k of [1, 1.9, 3]) {
      const d = pad * k;
      for (const [dx, dy] of [[d, -h / 2], [-d - w, -h / 2], [-w / 2, -d - h], [-w / 2, d],
                              [d, -h - d / 2], [d, d / 2], [-d - w, -h - d / 2], [-d - w, d / 2]]) {
        const b = { x0: ax + dx, y0: ay + dy, x1: ax + dx + w, y1: ay + dy + h };
        if (inside(b) && !hit(b)) { best = b; break; }
      }
      if (best) break;
    }
    // 끝내 빈자리가 없으면 오른쪽에 그냥 둔다 — 극값은 가리더라도 빼지 않는다
    best = best || { x0: ax + pad, y0: ay - h / 2, x1: ax + pad + w, y1: ay + h / 2 };
    placed.push(best);
    const cx = Math.max(best.x0, Math.min(ax, best.x1)), cy = Math.max(best.y0, Math.min(ay, best.y1));
    const far = Math.hypot(cx - ax, cy - ay) > pad * 1.3;
    out.push(
      (far ? `<line class="lead" x1="${ax}" y1="${ay}" x2="${cx}" y2="${cy}"/>` : "")
      + `<circle class="pin" cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${Math.max(3, fs * 0.17).toFixed(1)}" stroke-width="${Math.max(1.5, fs * 0.08).toFixed(1)}"/>`
      + `<text class="mx" x="${(best.x0 + 2).toFixed(1)}" y="${(best.y0 + fs * 0.86).toFixed(1)}"
          style="font-size:${fs.toFixed(1)}px;stroke-width:${(fs * 0.16).toFixed(1)}px">${val}</text>`
      + (emd ? `<text class="mxw" x="${(best.x0 + 2).toFixed(1)}" y="${(best.y0 + fs + fs2 * 0.86).toFixed(1)}"
          style="font-size:${fs2.toFixed(1)}px;stroke-width:${(fs2 * 0.18).toFixed(1)}px">${emd}</text>` : ""));
  }
  g.innerHTML = out.join("");
}

/* ── 범례 ─────────────────────────────────────────────────────────── */
function buildLegend() {
  const st = stepsOf(kind), lg = $("legend");
  const unit = (kind === "obsday" || kind.startsWith("shrt")) ? "㎜ 누적" : kind === "obs15" && x4 ? "㎜/h 환산" : "㎜";
  const cells = [1, 2, 3, 4, 5, 6, 7].map(i => `<i style="background:var(--rain-${i})"></i>`).join("");
  const ticks = st.map((v, i) => `<span style="bottom:${i * 26}px">${v}</span>`).join("");

    <div class="rows"><div class="band">${cells}</div><div class="ticks">${ticks}</div></div>

}

/* ── 머리 ─────────────────────────────────────────────────────────── */
const hm = t => t ? `${t.slice(8, 10)}:${t.slice(10, 12)}` : "—";
const md = t => t ? `${+t.slice(4, 6)}.${+t.slice(6, 8)}.` : "";
function when(gr) {
  if (!gr || !gr.tm) return "";
  const t = gr.tm;
  switch (kind) {
    case "obs15": return `${md(t)} ${hm(t)} · 15분`;
    case "obs60": return `${md(t)} ${hm(t)} · 60분`;
    case "obsday": return `${md(t)} 00:00~${hm(t)}`;
    case "odam": return `${md(t)} ${hm(t)} · 1시간`;
    case "vsrt": return `${hm(gr.tmfc)} 발표 → ${+t.slice(8, 10)}시까지 1시간 (+${vsrtN}h)`;
    default: {
      const [a, b] = gr.hours || [];
      const from = a ? +a.slice(8, 10) - 1 : "", to = b ? (+b.slice(8, 10) || 24) : "";
      return `${gr.tmfc ? +gr.tmfc.slice(8, 10) + "시 발표 · " : ""}${md(t)} ${from}~${to}시 합`;
    }
  }
}
function isPast() {                     // 일부러 지난 시각을 보는 중 — 지연이 아니다
  return pinned(kind) || (kind === "obs60" && OBS_TM && OBS_TM !== metaOf("obs60").tm);
}
function paintHead() {
  const L = metaOf(kind);
  $("lname").textContent = L.label || kind;
  $("ltime").textContent = when(CUR);
  $("lsrc").textContent = test ? "합성 격자 — 실제 자료 아님" : (L.src || "");
  const b = [];
  const past = isPast();
  if (test) b.push(`<span class="badge test">테스트</span>`);
  else if (pinned(kind)) b.push(`<span class="badge past">지난 시각 보기 (tm=${PIN_TM})</span>`);
  else if (past) b.push(`<span class="badge past">지난 시각</span>`);
  else {
    const col = META?.collect?.[COLLECT_OF[kind]];
    if (col && !col.ok) b.push(`<span class="badge warn" title="${(col.detail || "").replace(/"/g, "'")}">수집 실패 · 마지막 정상 ${col.ok_at ? col.ok_at.slice(11, 16) : "없음"}</span>`);
    if (L.stale) b.push(`<span class="badge warn">자료 지연${L.age_min != null ? ` · ${Math.round(L.age_min)}분 전` : ""}</span>`);
    if (CUR && +CUR.capped > 0) b.push(`<span class="badge" title="단기예보 PCP 는 30 에서 막힌다 — 30㎜ 이상">30㎜ 이상 든 칸 ${CUR.capped} · 합계는 하한</span>`);
  }
  if (kind === "obs15" && x4) b.push(`<span class="badge">×4 환산</span>`);
  $("badges").innerHTML = b.join(" ");
  $("stage").classList.toggle("late", !test && !past && !!L.stale);
  $("testmark").hidden = !test;
  $("stage").classList.toggle("test", test);
  $("b-test").classList.toggle("on", test);
  $("b-tl").classList.toggle("on", tlOn);
}

/* ── 메뉴 ─────────────────────────────────────────────────────────── */
function buildMenu() {
  const grp = (label, ks) => `<div class="grp"><span class="gl">${label}</span>${ks.map(k => {
    const L = metaOf(k);
    const cls = [k === kind ? "on" : "", !L.tm ? "none" : "", L.stale ? "late" : ""].join(" ");
    const tip = `${L.label || k} — ${L.src || ""}${L.stale ? " · 자료 지연" : ""}${!L.tm ? " · 아직 없음" : ""}`;
    return `<button data-k="${k}" class="${cls}" title="${tip}">${L.short || k}</button>`;
  }).join("")}</div>`;
  $("menu").innerHTML = grp("실측", KINDS.slice(0, 4)) + grp("예측", KINDS.slice(4));

    b.onclick = () => { stopPlay(); choose(b.dataset.k, true); };

function saveSetting(body) {
  fetch("/api/settings/map", { method: "PUT", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body) }).catch(() => {});
}

/* ── 자료 ─────────────────────────────────────────────────────────── */
/* ?tm=YYYYMMDDHHMI — 실측 층을 그 시각으로 본다(점검용. 남아 있는 사흘 안에서만). */
const PIN_TM = /^\d{12}$/.test(Q.get("tm") || "") ? Q.get("tm") : null;
const pinned = key => PIN_TM && !test && ["obs15", "obs60", "obsday", "odam"].includes(key);
function reqTm(key) {
  if (key === "obs60" && OBS_TM) return OBS_TM;

}

  const p = new URLSearchParams();
  if (tm) p.set("tm", tm);
  if (test) p.set("test", "1");
  const s = p.toString();
  return s ? "?" + s : "";
}
function wantTm(key) {
  const k = key.startsWith("vsrt") ? "vsrt" : key;

}
const ckOf = (key, tm) => key + "|" + (tm || "") + "|" + (test ? "test" : wantTm(key));
async function fetchGrid(key, tm) {
  const ck = ckOf(key, tm);
  if (GRIDS.has(ck)) return GRIDS.get(ck);
  const r = await fetch(`/api/grid/${encodeURIComponent(key)}${qs(key, tm)}`, { cache: "no-cache" });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
  const buf = await r.arrayBuffer();
  const [h, w] = r.headers.get("X-Grid-Shape").split(",").map(Number);
  const hd = n => r.headers.get("X-Grid-" + n);
  const gr = { ck, key, u: new Uint16Array(buf), h, w, grid: r.headers.get("X-Grid"),
               tm: hd("Tm"), tmfc: hd("Tmfc"), capped: hd("Capped"),
               hours: hd("Hours") ? hd("Hours").split(",") : null };
  if (gr.u.length !== h * w) throw new Error("격자 크기가 맞지 않는다");
  if (GRIDS.size > 200) GRIDS.delete(GRIDS.keys().next().value);
  GRIDS.set(ck, gr);
  return gr;
}
async function fetchStat(key, tm) {
  const ck = ckOf(key, tm);
  if (STATS.has(ck)) return STATS.get(ck);
  const p = new URLSearchParams({ layer: key });
  if (tm) p.set("tm", tm);
  if (test) p.set("test", "1");
  const j = await getJson(`/api/grid/sigun?${p}`);
  if (STATS.size > 200) STATS.delete(STATS.keys().next().value);
  STATS.set(ck, j);
  return j;
}

let SEQ = 0, SWITCH_MS = 0;
async function show(fade = false) {
  const my = ++SEQ, t0 = performance.now(), key = layerKey(), tm = reqTm(kind);
  buildMenu(); buildLegend();
  try {
    const [gr, st] = await Promise.all([fetchGrid(key, tm), fetchStat(key, tm)]);
    if (my !== SEQ) return;                     // 그새 다른 층을 골랐다
    CUR = gr; CURSTAT = st;
    $("empty").hidden = true;
  } catch (e) {
    if (my !== SEQ) return;
    CUR = null; CURSTAT = null;
    const col = META?.collect?.[COLLECT_OF[kind]];
    const fail = col && !col.ok;
    $("empty").className = fail ? "fail" : "";
    $("empty").innerHTML = (fail ? "조회 실패" : "아직 받은 격자가 없다")
      + `<small>${e.message}${col ? ` · 수집 ${col.tried_at ? col.tried_at.slice(11, 16) : "—"} ${col.detail || ""}` : ""}</small>`;
    $("empty").hidden = false;
  }
  draw(fade);
  paintHead();
  buildPlay();
  tlPlayhead();
  cardsPlayhead();
  SWITCH_MS = performance.now() - t0;
  if (Q.get("debug") === "1") {
    $("dbg").hidden = false;
    $("dbg").textContent = `전환 ${SWITCH_MS.toFixed(1)}ms · 그리기 ${RENDER_MS.toFixed(1)}ms · ${V.W}×${V.H} dpr ${V.dpr} · 칸 ${V.s.toFixed(2)}px`;
  }
  window.__mapPerf = { switch: SWITCH_MS, render: RENDER_MS };
}

function choose(k, save) {
  kind = k;
  OBS_TM = null;                         // 메뉴로 고르면 늘 '지금'
  if (save) saveSetting(k === "vsrt" ? { layer: "vsrt", vsrt_n: vsrtN } : { layer: k });
  show();
}

/* ── 재생 흐름 ────────────────────────────────────────────────────── */
async function loadFlow() {
  const p = new URLSearchParams({ hours: SET.flow_hours, step: SET.flow_step });
  if (test) p.set("test", "1");
  try { FLOW = await getJson(`/api/grid/flow?${p}`); }
  catch { FLOW = null; }
  if (FLOW) {
    FLOW.tt = FLOW.frames.map(f => tOf(f.t));
    FLOW.t0 = Math.min(tOf(FLOW.start), ...FLOW.tt);
    FLOW.t1 = Math.max(tOf(FLOW.now), ...FLOW.tt);
    FLOW.tn = tOf(FLOW.now);
  }
  buildPlay(); buildTL(); tlPlayhead();
  if (test) loadCards();                 // 테스트 카드는 합성 흐름에서 뽑는다 — 지도와 같은 값
  preloadFlow();
}
/* 지금 보는 프레임의 시각(ms) — 흐름 밖 층이면 null */
function headT() {
  if (!FLOWK.has(kind) || !CUR || !CUR.tm) return null;
  return tOf(CUR.tm);
}
function nearestFrame(t) {
  if (!FLOW || !FLOW.frames.length) return -1;
  let best = 0, bd = Infinity;
  FLOW.tt.forEach((x, i) => {
    // 같은 거리면 '지금' 앞은 실측, 뒤는 예측을 고른다
    const d = Math.abs(x - t) + (FLOW.frames[i].kind === "fcst" ? (t <= FLOW.tn ? 1 : -1) : 0);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function curFrame() {
  const t = headT();
  if (t == null || !FLOW) return -1;
  // 같은 시각이라도 층이 맞는 프레임을 고른다
  const i = FLOW.frames.findIndex(f => (kind === "obs60" ? f.kind === "obs" : f.kind === "fcst" && f.n === vsrtN)
    && tOf(f.t) === t);
  return i >= 0 ? i : nearestFrame(t);
}
function seek(i, fade = true) {
  if (!FLOW || i < 0 || i >= FLOW.frames.length) return;
  const f = FLOW.frames[i];
  if (f.kind === "obs") {
    kind = "obs60";
    OBS_TM = f.t === metaOf("obs60").tm ? null : f.t;
  } else {
    kind = "vsrt"; vsrtN = f.n; OBS_TM = null;
  }
  show(fade);
}
function startPlay() {
  if (!FLOW || !FLOW.frames.length) return;
  stopPlay(true);
  let i = curFrame();
  playing = setInterval(() => {
    i = (i + 1) % FLOW.frames.length;
    seek(i);
  }, SET.play_ms);
  buildPlay();
}
function stopPlay(quiet) {
  if (playing) { clearInterval(playing); playing = null; if (!quiet) buildPlay(); }
}
async function preloadFlow() {
  if (!FLOW) return;
  for (const f of FLOW.frames) {
    const key = f.kind === "obs" ? "obs60" : f.layer, tm = f.kind === "obs" && f.t !== metaOf("obs60").tm ? f.t : null;
    try { await Promise.all([fetchGrid(key, tm), fetchStat(key, tm)]); } catch {}
  }
}

/* 재생 막대 — 지난 실측(틱마다 한 장) │지금│ 예측(시간마다 한 장). 끌어서 옮긴다.
   막대는 흐름이 바뀔 때만 새로 그리고, 재생 중에는 손잡이와 글자만 옮긴다(그래야 미끄러진다). */
const fmtH = t => String(new Date(t).getHours()).padStart(2, "0");
const TRK = { Wt: 640, Ht: 46, padX: 10 };
const trkX = t => TRK.padX + (t - FLOW.t0) / Math.max(1, FLOW.t1 - FLOW.t0) * (TRK.Wt - 2 * TRK.padX);
function playHead() {
  const p = $("play");
  if (p.hidden || !FLOW) return;
  const ht = headT(), i = curFrame(), f = i >= 0 ? FLOW.frames[i] : null;
  const x = ht != null ? trkX(ht) : -40;
  for (const el of p.querySelectorAll(".trk-head, .trk-knob")) el.style.transform = `translateX(${x.toFixed(1)}px)`;
  p.querySelector(".lab").innerHTML = !f ? `<b>—</b><small>흐름 밖</small>`
    : f.kind === "obs" ? `<b>${hm(f.t)}</b><small>실측 · 지난 1시간</small>`
    : `<b>+${f.n}h ${fmtH(tOf(f.t))}시</b><small class="fc">예측 · 초단기</small>`;
  $("b-pp").textContent = playing ? "❚❚" : "▶";
}
function buildPlay() {
  const p = $("play");
  if (!FLOWK.has(kind) || !FLOW || !FLOW.frames.length) { p.hidden = true; p.dataset.sig = ""; return; }
  p.hidden = false;
  const sig = `${FLOW.now}|${FLOW.frames.length}|${FLOW.step}|${FLOW.hours}|${document.documentElement.dataset.theme}`;
  if (p.dataset.sig === sig) { playHead(); return; }
  p.dataset.sig = sig;
  const { Wt, Ht } = TRK, x = trkX;
  const xn = x(FLOW.tn);
  const ticks = FLOW.tt.map((t, i) => `<line class="trk-tick" x1="${x(t)}" x2="${x(t)}" y1="${FLOW.frames[i].kind === "obs" ? 14 : 12}" y2="24"/>`).join("");
  let hours = "";
  const h0 = new Date(FLOW.t0); h0.setMinutes(0, 0, 0);
  const span = (FLOW.t1 - FLOW.t0) / 3600e3, every = span > 14 ? 3 : span > 8 ? 2 : 1;
  for (let t = h0.getTime() + 3600e3; t <= FLOW.t1; t += 3600e3)
    if (new Date(t).getHours() % every === 0 && Math.abs(x(t) - xn) > 18)
      hours += `<text class="trk-hour" x="${x(t)}" y="40">${fmtH(t)}</text>`;
  const padX = TRK.padX;
  p.innerHTML = `<button class="pp" id="b-pp" title="재생 (Space)">▶</button>
    <svg id="trk" class="noanim" width="${Wt}" height="${Ht}" viewBox="0 0 ${Wt} ${Ht}">
      <defs><pattern id="fc-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="6" height="6" style="fill:color-mix(in oklab, var(--accent) 10%, transparent)"/>
        <line x1="0" y1="0" x2="0" y2="6" style="stroke:color-mix(in oklab, var(--accent) 40%, transparent)" stroke-width="2"/></pattern></defs>
      <rect class="trk-past" x="${padX}" y="14" width="${Math.max(0, xn - padX)}" height="10" rx="3"/>
      <rect class="trk-fc" x="${xn}" y="14" width="${Math.max(0, Wt - padX - xn)}" height="10" rx="3"/>
      ${ticks}
      <line class="trk-now" x1="${xn}" x2="${xn}" y1="4" y2="30"/>
      <text class="trk-nowl" x="${xn}" y="42">지금</text>
      ${hours}
      <line class="trk-head" x1="0" x2="0" y1="6" y2="30"/><circle class="trk-knob" cx="0" cy="19" r="7"/>
    </svg>
    <div class="lab"></div>`;
  $("b-pp").onclick = () => playing ? stopPlay() : startPlay();
  playHead();
  requestAnimationFrame(() => requestAnimationFrame(() => $("trk") && $("trk").classList.remove("noanim")));
  const trk = $("trk");
  const at = ev => {
    const r = trk.getBoundingClientRect();
    const xx = (ev.clientX - r.left) / r.width * Wt;
    return FLOW.t0 + (xx - padX) / (Wt - 2 * padX) * (FLOW.t1 - FLOW.t0);
  };
  let drag = false, last = -1;
  const go = ev => { const i2 = nearestFrame(at(ev)); if (i2 !== last) { last = i2; seek(i2); } };
  trk.onpointerdown = ev => { drag = true; stopPlay(); trk.setPointerCapture(ev.pointerId); last = -1; go(ev); };
  trk.onpointermove = ev => { if (drag) go(ev); };
  trk.onpointerup = () => { drag = false; };
}

/* ── 강수 타임라인(오른쪽 사이드바) ────────────────────────────────────
   시군마다 한 줄: 지난 실측(실선·면) │지금│ 예측(점선) — 지도와 같은 프레임, 같은 값.
   세로선(재생 위치)과 줄마다 점·오른쪽 값이 지도와 함께 움직인다. 점 색은 지도의 색 단계 그대로. */
let TLG = null;                          // 그린 틀(재생 위치만 바꿀 때 쓴다)
function tlWidth() {
  return Math.round(Math.min(Math.max(560 * V.k, V.W * 0.34), V.W * 0.46));
}
function applyTL(animate = true) {
  if (!V) return;
  const w = tlWidth();
  document.documentElement.style.setProperty("--tlw", w + "px");
  document.body.classList.toggle("tl-on", tlOn);
  const cards = SET.panel !== "timeline";
  document.body.classList.toggle("panel-cards", cards);
  document.body.classList.toggle("panel-tl", !cards);
  let tx = 0, ty = 0, sc = 1;
  if (tlOn) {
    // 지도가 비켜설 자리: 범례 오른쪽 ~ 사이드바 왼쪽. 모자라면 살짝 줄인다
    const lg = $("legend").getBoundingClientRect(), st = $("stage").getBoundingClientRect();
    const left = Math.max(16, lg.right - st.left + 10), right = V.W - w - 16;
    const mw = (V.X1 - V.X0) * V.s, avail = right - left;
    sc = Math.min(1, avail / mw);
    tx = left + (avail - mw * sc) / 2 - sc * V.ox;
    ty = (1 - sc) * V.H / 2;
  }
  MT = { tx, ty, sc };
  const mw = $("mapwrap");
  if (!animate) mw.style.transition = "none";
  mw.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${sc.toFixed(4)})`;
  if (!animate) { void mw.offsetWidth; mw.style.transition = ""; }
  // 재생 막대는 지도 가운데 아래로. ⚠️ 막대에 zoom(--k)이 걸려 있어 left 도 그만큼 곱해진다 — 나눠 둔다
  const cx = tlOn ? (V.W - w) / 2 : V.W / 2;
  $("stage").style.setProperty("--playx", (cx / V.k).toFixed(0) + "px");
  if (tlOn && !cards) buildTL();
  if (tlOn && cards) { if (CARDS) renderCards(); else loadCards(); }
  drawRanks();
  link(null);
}
function setTL(on, save = true) {
  tlOn = on;
  if (save) saveSetting({ tl_on: on });
  applyTL(true);
  paintHead();
}

function buildTL() {
  const svg = $("tl-svg");
  $("tl-stat").textContent = SET.tl_stat === "mean" ? "평균" : "최대";
  $("tl-sub").textContent = `시군 ${SET.tl_stat === "mean" ? "평균" : "최대"} 1시간 강수량 · 지난 ${SET.flow_hours}시간 → +6시간`;
  if (!tlOn || !V) return;
  const box = svg.getBoundingClientRect();
  const W = box.width, H = box.height;
  if (!W || !H) return;
  const k = V.k;
  if (!FLOW || !FLOW.frames.length) {
    svg.innerHTML = `<text class="tl-empty" x="${W / 2}" y="${H / 2}" style="font-size:${15 * k}px">재생할 자료가 아직 없다 — 수집이 쌓이면 나타난다</text>`;
    TLG = null; return;
  }
  const stat = SET.tl_stat === "mean" ? "mean" : "max";
  const rowsD = [{ name: "경남", tot: true, v: FLOW.total[stat] }]
    .concat(FLOW.series.map(s => ({ name: s.sigun, v: s[stat] })));
  const nameW = 66 * k, valW = 78 * k, axisH = 30 * k, padR = 14 * k;
  const x0 = nameW + 14 * k, x1 = W - valW - padR;
  const rh = (H - axisH - 8 * k) / rowsD.length;
  const xT = t => x0 + (t - FLOW.t0) / Math.max(1, FLOW.t1 - FLOW.t0) * (x1 - x0);
  let vmax = 10;
  for (const r of rowsD) for (const v of r.v) if (v != null && v > vmax) vmax = v;
  const xn = xT(FLOW.tn);
  const out = [];
  // 예측 쪽 바탕, 시각 눈금, '지금'
  out.push(`<rect class="tl-fczone" x="${xn}" y="${axisH - 6 * k}" width="${x1 - xn + padR / 2}" height="${H - axisH}"/>`);
  const h0 = new Date(FLOW.t0); h0.setMinutes(0, 0, 0);
  const span = (FLOW.t1 - FLOW.t0) / 3600e3, every = span > 14 ? 3 : span > 8 ? 2 : 1;
  for (let t = h0.getTime() + 3600e3; t <= FLOW.t1; t += 3600e3) {
    const xx = xT(t);
    // '지금'·'실측'·'예측' 글자와 겹치는 눈금은 뺀다
    if (new Date(t).getHours() % every === 0 && Math.abs(xx - xn) > 22 * k
        && xx - x0 > 34 * k && x1 - xx > 34 * k)
      out.push(`<text class="tl-hour" x="${xx}" y="${axisH - 12 * k}" style="font-size:${12 * k}px">${fmtH(t)}</text>`);
  }
  out.push(`<text class="tl-zl" x="${x0}" y="${axisH - 12 * k}" style="font-size:${11 * k}px" text-anchor="start">실측</text>`);
  out.push(`<text class="tl-zl" x="${x1}" y="${axisH - 12 * k}" style="font-size:${11 * k}px" text-anchor="end">예측</text>`);
  out.push(`<text class="tl-nowl" x="${xn}" y="${axisH - 12 * k}" style="font-size:${12 * k}px">지금</text>`);
  out.push(`<line class="tl-now" x1="${xn}" x2="${xn}" y1="${axisH - 4 * k}" y2="${H}"/>`);
  // 실측이 앞쪽까지 다 차 있지 않으면(막 수집을 시작했거나 끊겼다) 비어 있는 까닭을 적는다
  const firstObs = FLOW.frames.findIndex(f => f.kind === "obs");
  const gapTo = firstObs >= 0 ? FLOW.tt[firstObs] : FLOW.tn;
  if (gapTo - FLOW.t0 > FLOW.step * 2 * 60e3 && xT(gapTo) - x0 > 120 * k)
    out.push(`<text class="tl-empty" x="${(x0 + xT(gapTo)) / 2}" y="${axisH + 22 * k}" style="font-size:${12 * k}px">`
      + (firstObs >= 0 ? `실측 ${hm(FLOW.frames[firstObs].t)}부터 — 쌓이는 중` : "실측 없음") + `</text>`);

  const fs = Math.min(18 * k, rh * 0.42);
  rowsD.forEach((r, ri) => {
    const top = axisH + ri * rh, base = top + rh - 5 * k, ph = rh - 12 * k;
    const y = v => base - Math.min(v, vmax) / vmax * ph;
    const seg = sel => {
      // 결측(null)은 끊는다 — 0 으로 잇지 않는다
      let d = "", a = "", run = [];
      const flush = () => {
        if (run.length) {
          d += "M" + run.map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join("L");
          a += `M${run[0][0].toFixed(1)},${base}L` + run.map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join("L")
             + `L${run[run.length - 1][0].toFixed(1)},${base}Z`;
        }
        run = [];
      };
      FLOW.frames.forEach((f, i) => {
        if (!sel(f)) return;
        const v = r.v[i];
        if (v == null) { flush(); return; }
        run.push([xT(FLOW.tt[i]), y(v)]);
      });
      flush();
      return { d, a };
    };
    const po = seg(f => f.kind === "obs"), pf = seg(f => f.kind === "fcst");
    // 기간 최고 — 1㎜ 넘을 때만 숫자를 단다
    let pi = -1, pv = 0;
    r.v.forEach((v, i) => { if (v != null && v > pv) { pv = v; pi = i; } });
    const peak = pi >= 0 && pv >= 1
      ? `<text class="tl-peak" x="${xT(FLOW.tt[pi])}" y="${Math.max(top + fs * 0.9, y(pv) - 4 * k)}" style="font-size:${11.5 * k}px">${pv.toFixed(pv >= 10 ? 0 : 1)}</text>` : "";
    out.push(`<g class="tl-row ${r.tot ? "tot" : ""}" data-s="${r.tot ? "" : r.name}" data-i="${ri}">
      <rect class="tl-bg" x="0" y="${top}" width="${W}" height="${rh}"/>
      <line class="tl-sep" x1="${8 * k}" x2="${W - 8 * k}" y1="${top + rh}" y2="${top + rh}"/>
      <text class="tl-name ${r.tot ? "tot" : ""}" x="${12 * k}" y="${top + rh / 2}" style="font-size:${fs}px">${r.tot ? "경남" : r.name}</text>
      <path class="tl-area" d="${po.a}"/><path class="tl-line" d="${po.d}"/>
      <path class="tl-farea" d="${pf.a}"/><path class="tl-fline" d="${pf.d}"/>
      ${peak}
      <circle class="tl-dot" r="${5 * k}" cx="-99" cy="-99"/>
      <text class="tl-val" x="${W - padR}" y="${top + rh / 2}" style="font-size:${Math.min(20 * k, rh * 0.48)}px"></text>
    </g>`);
  });
  out.push(`<line class="tl-head" id="tl-head" x1="0" x2="0" y1="${axisH - 6 * k}" y2="${H}" style="transform:translateX(-9px)"/>`);
  svg.innerHTML = out.join("");
  TLG = { xT, y0: axisH, rh, vmax, rowsD, k, base: ri => axisH + ri * rh + rh - 5 * k, ph: rh - 12 * k, x0, x1 };
  for (const g of svg.querySelectorAll(".tl-row")) {
    g.onmouseenter = () => highlight(g.dataset.s || null);
    g.onmouseleave = () => highlight(null);
  }
  // 그래프를 누르거나 끌면 그 시각으로 — 지도가 따라온다
  let drag = false, last = -1;
  const go = ev => {
    const r = svg.getBoundingClientRect(), xx = ev.clientX - r.left;
    if (xx < TLG.x0 - 6 || xx > TLG.x1 + 6) return;
    const t = FLOW.t0 + (xx - TLG.x0) / (TLG.x1 - TLG.x0) * (FLOW.t1 - FLOW.t0);
    const i = nearestFrame(t);
    if (i !== last) { last = i; seek(i); }
  };
  svg.onpointerdown = ev => { drag = true; stopPlay(); svg.setPointerCapture(ev.pointerId); last = -1; go(ev); };
  svg.onpointermove = ev => { if (drag) go(ev); };
  svg.onpointerup = () => { drag = false; };
  // 처음 놓을 때는 미끄러지지 않게 — 화면 밖(-99)에서 날아 들어오는 것처럼 보인다
  svg.classList.add("noanim");
  tlPlayhead();
  requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove("noanim")));
}

/* 재생 위치만 바꾼다 — 줄을 다시 그리지 않는다(재생 중 매 프레임 부른다) */
function tlPlayhead() {
  if (!TLG || !tlOn || !FLOW) return;
  const stat = SET.tl_stat === "mean" ? "mean" : "max";
  const ht = headT();
  const i = curFrame();
  const head = $("tl-head");
  if (head) head.style.transform = `translateX(${(ht != null ? TLG.xT(ht) : -9).toFixed(1)}px)`;
  // 값은 지도와 **같은 숫자**여야 한다 — 지금 그린 격자의 시군 통계(CURSTAT)를 먼저 쓴다
  const live = FLOWK.has(kind) && CURSTAT ? Object.fromEntries(CURSTAT.rows.map(r => [r.sigun, r[stat]])) : null;
  let topName = null, topV = 0;
  const rows = document.querySelectorAll(".tl-row");
  rows.forEach((g, ri) => {
    const r = TLG.rowsD[ri];
    let v = null;
    if (live && !r.tot) v = live[r.name];
    else if (i >= 0) v = r.v[i];
    else v = r.v[FLOW.frames.findLastIndex ? FLOW.frames.findLastIndex(f => f.kind === "obs") : -1];
    if (live && r.tot) v = i >= 0 ? r.v[i] : null;
    const dot = g.querySelector(".tl-dot"), txt = g.querySelector(".tl-val");
    const k = stepIdx(v, STEPS.m60);
    // cx·cy 를 style 로 줘야 CSS 전환이 걸린다(속성으로 바꾸면 순간이동한다)
    if (ht != null && v != null) {
      dot.style.cx = TLG.xT(ht).toFixed(1) + "px";
      dot.style.cy = (TLG.base(ri) - Math.min(v, TLG.vmax) / TLG.vmax * TLG.ph).toFixed(1) + "px";
      dot.style.fill = k ? `var(--rain-${Math.max(3, k)})` : "var(--ink-3)";
      dot.style.opacity = "1";
    } else { dot.style.opacity = "0"; }
    txt.textContent = v == null ? "—" : v.toFixed(1);
    txt.classList.toggle("zero", !v);
    if (!r.tot && v != null && v > topV) { topV = v; topName = r.name; }
  });
  rows.forEach(g => g.classList.toggle("top", !!topName && g.dataset.s === topName && topV >= 0.1));
}

/* ── 오른쪽 카드 — 종합 화면(강수 모니터링)의 세 판을 작게 ─────────────────────
   실제 자료는 종합 화면과 **같은 API·같은 규칙**이다 — 숫자가 두 화면에서 같아야 한다.
     강수 누적  /api/rain(스방 → 비면 기상청) 시군마다 다우지점(자료 있는 지점 중 합계 최대)
                + /api/forecast 시군 6시간을 0·5·10·20·30·50 으로 맞춘 합(빗금). 합으로 줄 세운다
     지금 오는 비 /api/minute — 15분·60분 상위
     예측 상위  /api/forecast 시군 — 6시간 합 순
   테스트 모드는 합성 흐름(/api/grid/flow?test=1)에서 뽑는다 — 지도와 같은 값이 나오게. */
let CARDS = null;
const qRN1 = v => [0, 5, 10, 20, 30, 50].reduce((a, b) => (Math.abs(b - v) < Math.abs(a - v) ? b : a));
const ORDER_GN = () => GEO.sigun.filter(s => s.kind === "gn").map(s => s.name);
const sumv = a => a.reduce((x, v) => x + (typeof v === "number" ? v : 0), 0);

/* 시각 글자('12', '13', …, '23:36') → 시각(ms). 끝에서부터 거슬러 올라가며 날을 넘긴다 */
function labelTimes(labels, lastHM) {
  const out = new Array(labels.length), now = new Date();
  const [lh, lm] = (lastHM || `${now.getHours()}:00`).split(":").map(Number);
  const t = new Date(now); t.setHours(lh, lm || 0, 0, 0);
  if (t - now > 3600e3) t.setDate(t.getDate() - 1);
  out[labels.length - 1] = t.getTime();
  for (let i = labels.length - 2; i >= 0; i--) {
    const c = new Date(out[i + 1]);
    c.setHours(+labels[i].slice(0, 2), labels[i].length > 2 ? +labels[i].slice(3, 5) : 0, 0, 0);
    if (c.getTime() >= out[i + 1]) c.setDate(c.getDate() - 1);
    out[i] = c.getTime();
  }
  return out;
}
function nextHours(labels, after) {          // 예측 '00','01',… → after 뒤의 시각들
  const out = [];
  let prev = after;
  for (const l of labels) {
    const c = new Date(prev); c.setHours(+l.slice(0, 2), 0, 0, 0);
    if (c.getTime() <= prev) c.setDate(c.getDate() + 1);
    out.push(c.getTime()); prev = c.getTime();
  }
  return out;
}

async function cardsFromApi() {
  const H = SET.acc_hours;
  let rain = await getJson(`/api/rain?hours=${H}&src=bangjae`), fell = false;
  // 스방이 멈췄거나 계정이 없으면 빈 응답이다 — 기상청으로 물러서고, 물러섰다고 적는다(종합 화면과 같다)
  if (!(rain.rows || []).length) { rain = await getJson(`/api/rain?hours=${H}&src=kma`); fell = true; }
  const [fc, mn] = await Promise.all([getJson("/api/forecast?hours=6"), getJson("/api/minute?n=6")]);
  const lastHM = rain.labels.at(-1).includes(":") ? rain.labels.at(-1) : rain.base_hour;
  const dt = labelTimes(rain.labels, lastHM);
  const ft = nextHours(fc.labels || [], dt.at(-1));
  const FC = Object.fromEntries((fc.sigun || []).map(s => [s.sigun, s]));
  const by = {};
  for (const r of rain.rows) (by[r.sigun] ||= []).push(r);
  const live = r => r.bad < r.d.length;              // 자료를 아예 안 주는 지점이 0으로 1등이 되지 않게
  const rows = ORDER_GN().filter(s => by[s]).map(s => {
    const st = by[s].slice().sort((a, b) => (live(b) - live(a)) || (b.sum - a.sum))[0];
    const fcd = (FC[s]?.d || []).slice(0, 6).map(qRN1);
    return { sig: s, stn: st.name, d: st.d, dt, fcd, ft, sum: st.sum, fc: sumv(fcd), bad: st.bad };
  });
  const srcL = fell ? "스방 안 됨→기상청" : rain.src === "bangjae" ? "스방 265" : "기상청 56";
  return {
    acc: { rows, H, src: srcL, fell, bt: `${lastHM} 실측` },
    now: { r15: (mn.r15 || []).map(x => ({ sig: x.sigun, name: x.name, mm: x.mm })),
           r60: (mn.r60 || []).map(x => ({ sig: x.sigun, name: x.name, mm: x.mm })), tm: mn.tm },
    fc: { rows: (fc.sigun || []).map(s => ({ sig: s.sigun, emd: s.emd, d: s.d.slice(0, 6), sum: s.sum })),
          labels: fc.labels || [], ft, bt: fc.tmfc ? `${hm(fc.tmfc)} 발표` : "—" },
  };
}

async function cardsFromTest() {
  if (!FLOW) return null;
  const obsI = [], fcI = [];
  FLOW.frames.forEach((f, i) => {
    if (f.kind === "obs" && f.t.endsWith("00")) obsI.push(i);
    if (f.kind === "fcst") fcI.push(i);
  });
  const lastObs = FLOW.frames.reduce((a, f, i) => (f.kind === "obs" ? i : a), -1);
  const dt = obsI.map(i => FLOW.tt[i]), ft = fcI.map(i => FLOW.tt[i]);
  const rows = FLOW.series.map(s => {
    const d = obsI.map(i => s.max[i]), fcd = fcI.map(i => qRN1(s.max[i] ?? 0));
    return { sig: s.sigun, stn: "격자", d, dt, fcd, ft, sum: Math.round(sumv(d) * 10) / 10, fc: sumv(fcd) };
  });
  let s15 = null;
  try { s15 = await getJson("/api/grid/sigun?layer=obs15&test=1"); } catch {}
  const top = (arr) => arr.sort((a, b) => b.mm - a.mm).slice(0, 6);
  const r60 = top(FLOW.series.map(s => ({ sig: s.sigun, name: "격자", mm: lastObs >= 0 ? (s.max[lastObs] ?? 0) : 0 })));
  const r15 = s15 ? top(s15.rows.filter(r => r.kind === "gn").map(r => ({ sig: r.sigun, name: r.where?.emd || "격자", mm: r.max ?? 0 }))) : [];
  return {
    acc: { rows, H: dt.length, src: "테스트", fell: false, bt: lastObs >= 0 ? `${hm(FLOW.frames[lastObs].t)} 실측` : "—" },
    now: { r15, r60, tm: lastObs >= 0 ? hm(FLOW.frames[lastObs].t) : "—" },
    fc: { rows: FLOW.series.map(s => { const d = fcI.map(i => s.max[i] ?? 0); return { sig: s.sigun, emd: "", d, sum: sumv(d) }; }),
          labels: ft.map(fmtH), ft, bt: FLOW.tmfc ? `${hm(FLOW.tmfc)} 발표` : "—" },
  };
}

let CARD_SEQ = 0;
async function loadCards() {
  if (!tlOn || SET.panel === "timeline") return;
  const my = ++CARD_SEQ;
  let c;
  try { c = test ? await cardsFromTest() : await cardsFromApi(); }
  catch (e) { c = { err: e.message }; }
  if (my !== CARD_SEQ) return;
  CARDS = c;
  renderCards();
}

const rampVar = (v, steps) => { const k = stepIdx(v, steps); return k ? `var(--rain-${k})` : null; };
function rowEvents(el) {
  for (const r of el.querySelectorAll("[data-s]")) {
    r.onmouseenter = () => { highlight(r.dataset.s); link(r, r.dataset.s); };
    r.onmouseleave = () => { highlight(null); link(null); };
  }
}

function renderCards() {
  if (!CARDS || !V) return;
  if (CARDS.err) {
    $("acc-b").innerHTML = `<div class="empty-note">불러오지 못했다 — ${CARDS.err}</div>`;
    return;
  }
  // 누적 카드는 남는 높이를 다 쓴다 — 다른 둘을 먼저 채운 뒤에 재야 줄 수가 맞는다
  renderNow(); renderFc(); renderAcc();
  drawRanks();
  cardsPlayhead();
}

/* 강수 누적 — 종합 화면 '강수 타임라인'을 한 줄짜리로 */
function renderAcc() {
  const A = CARDS.acc, k = V.k, body = $("acc-b");
  $("acc-sub").textContent = `다우지점 · 지난 ${A.H}시간 + 예상 6시간`;
  $("acc-src").textContent = A.src; $("acc-src").classList.toggle("fell", !!A.fell);
  $("acc-bt").textContent = A.bt;
  const rows = A.rows.slice().sort((a, b) => (b.sum + b.fc) - (a.sum + a.fc));
  if (!rows.length || !rows[0].dt.length) { body.innerHTML = `<div class="empty-note">강수 자료가 아직 없다</div>`; A.sp = null; return; }
  const bh = body.clientHeight - 10 * k;
  const rh = Math.max(26 * k, Math.min(44 * k, bh / Math.max(1, rows.length)));   // 카드를 꽉 채운다
  const n = Math.max(1, Math.min(rows.length, Math.floor(bh / rh)));
  body.style.setProperty("--rh", rh + "px");
  const bmax = Math.max(1, ...rows.map(r => r.sum + r.fc));
  let smax = 5;
  for (const r of rows) for (const v of [...r.d, ...r.fcd]) if (typeof v === "number" && v > smax) smax = v;
  const t0 = Math.min(...rows[0].dt) - 1800e3, t1 = Math.max(rows[0].dt.at(-1), ...(rows[0].ft.length ? rows[0].ft : [0]));
  const SW = 124 * k, SH = rh * 0.82;
  const sx = t => (t - t0) / Math.max(1, t1 - t0) * SW, sy = v => SH - Math.min(v, smax) / smax * (SH - 3);
  A.sp = { t0, t1, SW };
  const sline = (ts, vs, from) => {
    let pts = ts.map((t, i) => [t, vs[i]]).filter(([, v]) => typeof v === "number");
    if (from) pts = [from, ...pts];
    if (!pts.length) return { d: "", a: "" };
    const p = pts.map(([t, v]) => `${sx(t).toFixed(1)},${sy(v).toFixed(1)}`);
    return { d: "M" + p.join("L"), a: `M${sx(pts[0][0]).toFixed(1)},${SH}L${p.join("L")}L${sx(pts.at(-1)[0]).toFixed(1)},${SH}Z` };
  };
  const xn = sx(rows[0].dt.at(-1));
  body.innerHTML = rows.slice(0, n).map((r, i) => {
    const tot = r.sum + r.fc, o = r.sum / bmax * 100, f = r.fc / bmax * 100;
    const inside = o + f > 62;
    const vpos = inside ? `right:calc(${(100 - o - f).toFixed(1)}% + 6px)` : `left:calc(${(o + f).toFixed(1)}% + 6px)`;
    const lastObs = r.d.reduce((a, v, j) => (typeof v === "number" ? [r.dt[j], v] : a), null);
    const po = sline(r.dt, r.d), pf = sline(r.ft, r.fcd, lastObs);
    const rank = i < 3 && tot >= 0.1 ? `<span class="rk">${i + 1}</span>` : "";
    return `<div class="ar" data-s="${r.sig}">
      <div class="nm2">${rank}<small>${r.sig}</small>${r.stn}</div>
      <div class="abar"><div class="o" style="width:${o.toFixed(1)}%"></div>
        ${r.fc ? `<div class="f" style="left:${o.toFixed(1)}%;width:${f.toFixed(1)}%"></div>` : ""}
        <span class="v" style="${vpos}">${r.sum.toFixed(1)}${r.fc ? `<i>+${r.fc}</i>` : ""}</span></div>
      <svg viewBox="0 0 ${SW.toFixed(0)} ${SH.toFixed(0)}" preserveAspectRatio="none">
        <path class="sp-a" d="${po.a}"/><path class="sp-l" d="${po.d}"/>
        <path class="sp-fa" d="${pf.a}"/><path class="sp-fl" d="${pf.d}"/>
        <line class="sp-now" x1="${xn}" x2="${xn}" y1="0" y2="${SH}"/>
        <line class="sp-head" x1="0" x2="0" y1="-2" y2="${SH + 2}" style="transform:translateX(-99px)"/></svg>
      <div class="tot ${tot ? "" : "z"}">${tot.toFixed(1)}</div></div>`;
  }).join("");
  rowEvents(body);
}

/* 지금 오는 비 — 15분 │ 60분 상위. 단계는 종합 화면과 같다(15분과 60분이 다른 자) */
const MN_STEPS = { 15: [0.5, 2, 5, 8, 12, 18, 25], 60: [1, 5, 10, 20, 30, 50, 70] };
function renderNow() {
  const N = CARDS.now;
  $("now-bt").textContent = N.tm || "—";
  const col = (list, kk) => {
    const mx = Math.max(...list.map(x => x.mm), 0.1);
    if (!list.length || mx <= 0.1 && !list.some(x => x.mm > 0))
      return `<div class="empty-note">비 없음</div>`;
    return list.slice(0, 6).map(x => {
      const c = rampVar(x.mm, MN_STEPS[kk]) || "var(--ink-3)";
      return `<div class="mr" data-s="${x.sig}"><span class="bg" style="width:${(x.mm / mx * 100).toFixed(0)}%;background:${c}"></span>
        <span class="nm2"><small>${x.sig}</small>${x.name}</span><b>${x.mm.toFixed(1)}</b></div>`;
    }).join("");
  };
  $("now-b").innerHTML = `<div class="mn"><div><h4>15분<span>㎜</span></h4>${col(N.r15, 15)}</div>
    <div><h4>60분<span>㎜</span></h4>${col(N.r60, 60)}</div></div>`;
  rowEvents($("now-b"));
}

/* 예측 상위 — 6시간 합 순. 칸은 지도와 같은 색 단계 */
function renderFc() {
  const F = CARDS.fc;
  $("fc-bt").textContent = F.bt;
  const rows = F.rows.slice().sort((a, b) => b.sum - a.sum).slice(0, 6);
  if (!rows.length || rows[0].sum <= 0) {
    $("fc-b").innerHTML = `<div class="empty-note">앞으로 6시간 예상 강수 없음</div>`;
    return;
  }
  const cell = v => {
    const k = stepIdx(v, STEPS.m60);
    const txt = v >= 1 ? (Number.isInteger(v) ? v : v.toFixed(1)) : "";
    return `<i style="${k ? `background:var(--rain-${k});color:${k >= 4 ? "var(--on-accent)" : "var(--ink)"}` : ""}">${txt}</i>`;
  };
  $("fc-b").innerHTML = `<div class="fh"><span>시군</span><div class="cells">${F.labels.map(l => `<span>${l}</span>`).join("")}</div><span style="text-align:right">합</span></div>`
    + rows.map(r => `<div class="fr" data-s="${r.sig}"><span class="nm2">${r.sig}<small>${r.emd || ""}</small></span>
      <div class="cells">${r.d.map(cell).join("")}</div><span class="sum">${(+r.sum).toFixed(r.sum % 1 ? 1 : 0)}</span></div>`).join("");
  rowEvents($("fc-b"));
}

/* 카드 안의 재생 위치 — 누적 줄 선 그래프의 세로선, 예측 칸의 테두리 */
function cardsPlayhead() {
  if (!CARDS || CARDS.err || !tlOn || SET.panel === "timeline") return;
  const ht = headT(), sp = CARDS.acc?.sp;
  for (const l of document.querySelectorAll(".sp-head")) {
    const x = ht != null && sp && ht >= sp.t0 && ht <= sp.t1 ? (ht - sp.t0) / (sp.t1 - sp.t0) * sp.SW : -99;
    l.style.transform = `translateX(${x.toFixed(1)}px)`;
  }
  // 지도가 예측(초단기)을 보일 때만 그 시각 열을 짚는다 — 실측을 보는 중이면 짚지 않는다
  let j = -1;
  if (kind === "vsrt" && ht != null && CARDS.fc.ft?.length) {
    let bd = Infinity;
    CARDS.fc.ft.forEach((t, i) => { const d = Math.abs(t - ht); if (d < bd) { bd = d; j = i; } });
  }
  for (const r of document.querySelectorAll("#fc-b .fr, #fc-b .fh"))
    r.querySelectorAll(".cells > *").forEach((c, i) => c.classList.toggle("on", i === j));
}

/* 지도 위 순위 표식 — 누적 상위 셋(시군명 왼쪽에 작은 원) */
function drawRanks() {
  const g = $("ranks");
  if (!g) return;
  if (!tlOn || SET.panel === "timeline" || !CARDS || CARDS.err || !V) { g.innerHTML = ""; return; }
  const rows = CARDS.acc.rows.slice().sort((a, b) => (b.sum + b.fc) - (a.sum + a.fc)).slice(0, 3)
    .filter(r => r.sum + r.fc >= 0.1);
  const r0 = FSN * 0.46;
  g.innerHTML = rows.map((r, i) => {
    const ft = FEAT.find(f => f.properties.sigun === r.sig);
    if (!ft) return "";
    const x = V.toX(ft.properties.lx) - r.sig.length * FSN * 0.52 - r0 - 4, y = V.toY(ft.properties.ly);
    return `<g class="rk"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r0.toFixed(1)}"/>
      <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${(FSN * 0.56).toFixed(1)}px">${i + 1}</text></g>`;
  }).join("");
}

/* 줄 ↔ 지도 연결선 — 카드 줄 왼쪽 끝에서 지도 위 그 시군 이름 오른쪽까지, 그어지듯 */
function link(el, sig) {
  const svg = $("links");
  if (!el || !sig || !V) { svg.innerHTML = ""; return; }
  const ft = FEAT.find(f => f.properties.sigun === sig);
  if (!ft) { svg.innerHTML = ""; return; }
  const st = $("stage").getBoundingClientRect(), r = el.getBoundingClientRect();
  const x1 = r.left - st.left - 3, y1 = r.top - st.top + r.height / 2;
  const hw = sig.length * FSN * 0.52 * MT.sc;
  const x2 = V.toX(ft.properties.lx) * MT.sc + MT.tx + hw + 8, y2 = V.toY(ft.properties.ly) * MT.sc + MT.ty;
  const dx = Math.max(50, (x1 - x2) * 0.45);
  svg.innerHTML = `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} C${(x1 - dx).toFixed(1)},${y1.toFixed(1)} ${(x2 + dx).toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}"/>
    <circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="5"/>`;
  const p = svg.querySelector("path");
  p.style.setProperty("--len", p.getTotalLength().toFixed(0));
}

/* ── 설정(Ctrl+,) — 서버에 둔다(어느 PC 에서 열어도 같게) ─────────────────── */

  const seg = (key, opts) => `<span class="seg">${opts.map(([v, l]) =>
    `<button data-k="${key}" data-v="${v}" class="${String(SET[key]) === String(v) ? "on" : ""}">${l}</button>`).join("")}</span>`;
  const th = document.documentElement.dataset.theme;
  $("prefs").innerHTML = `<div class="box" role="dialog" aria-label="설정">
    <div class="top"><b>설정 — 경남 지도</b><span class="sp"></span><button id="pf-x" title="닫기 (Esc)">✕</button></div>
    <h4>재생</h4>
    <div class="row"><span class="k">실측 간격</span>${seg("flow_step", [[10, "10분"], [20, "20분"], [30, "30분"], [60, "1시간"]])}</div>
    <div class="row"><span class="k"></span><span class="note">예측(초단기)은 1시간 간격뿐이다 — 10분 대상시각을 주면 가까운 정시 격자가 온다.</span></div>
    <div class="row"><span class="k">지난 시간</span>${seg("flow_hours", [[1, "1시간"], [3, "3시간"], [6, "6시간"], [12, "12시간"]])}</div>
    <div class="row"><span class="k">빠르기</span>${seg("play_ms", [[2000, "느리게"], [1200, "보통"], [600, "빠르게"]])}</div>
    <h4>오른쪽 패널</h4>
    <div class="row"><span class="k">표시</span>${seg("tl_on", [[true, "켬"], [false, "끔"]])}</div>
    <div class="row"><span class="k">방식</span>${seg("panel", [["cards", "카드 — 종합 화면 판"], ["timeline", "타임라인 — 시군 선"]])}</div>
    <div class="row"><span class="k">누적 구간</span>${seg("acc_hours", [[6, "6시간"], [12, "12시간"], [24, "24시간"], [48, "48시간"]])}</div>
    <div class="row"><span class="k">타임라인 값</span>${seg("tl_stat", [["max", "시군 최대"], ["mean", "시군 평균"]])}</div>
    <h4>화면</h4>
    <div class="row"><span class="k">테마</span><span class="seg">
      <button data-th="dark" class="${th !== "light" ? "on" : ""}">어둡게</button>
      <button data-th="light" class="${th === "light" ? "on" : ""}">밝게</button></span></div>
    <div class="keys"><kbd>1</kbd>~<kbd>7</kbd> 층 · <kbd>Space</kbd> 재생 · <kbd>←</kbd><kbd>→</kbd> 한 장씩 · <kbd>L</kbd> 타임라인 · <kbd>T</kbd> 테스트 · <kbd>Ctrl</kbd>+<kbd>,</kbd> 설정</div>
  </div>`;
  $("prefs").hidden = false;
  $("pf-x").onclick = closePrefs;
  for (const b of $("prefs").querySelectorAll("button[data-k]")) b.onclick = () => {
    const k = b.dataset.k;
    let v = b.dataset.v;
    v = k === "tl_on" ? v === "true" : (k === "tl_stat" || k === "panel") ? v : +v;
    SET[k] = v;
    saveSetting({ [k]: v });
    if (k === "tl_on") setTL(v, false);
    if (k === "panel") { CARDS = null; applyTL(true); }
    if (k === "acc_hours") loadCards();
    if (k === "flow_step" || k === "flow_hours") loadFlow();
    if (k === "tl_stat") buildTL();
    openPrefs();
  };
  for (const b of $("prefs").querySelectorAll("button[data-th]")) b.onclick = () => { setTheme(b.dataset.th); openPrefs(); };
}
function closePrefs() { $("prefs").hidden = true; }
$("prefs").addEventListener("click", ev => { if (ev.target.id === "prefs") closePrefs(); });

async function refreshMeta() {
  let m;
  try { m = await getJson("/api/grid/meta"); } catch { return; }
  const changed = JSON.stringify(m.layers.map(l => l.tm)) !== JSON.stringify((META?.layers || []).map(l => l.tm));
  META = m;
  if (changed && !test) { await loadFlow(); if (!playing) show(); }
  else { buildMenu(); paintHead(); }
}

/* ── 마우스 — 그 칸 값, 좌표, 읍면동. 지도가 옮겨졌으면(타임라인) 그만큼 되돌려 잰다 ── */
async function loadEmd() {
  if (MEMD) return;
  MEMD = true;
  const r = await fetch("/api/grid/geo/mask_emd.u16.gz");
  MEMD = new Uint16Array(await r.arrayBuffer());
  EMDN = new Map(GEO.emd.map(e => [e.id, e]));
}
function valueAt(gx, gy) {
  if (!CUR) return undefined;
  const g = META.grids;
  let c, r;
  if (CUR.grid === "hr") { c = Math.round(gx) - g.hr.i0; r = Math.round(gy) - g.hr.j0; }
  else {
    const [A, B, C] = g.dfs_to_hr.col, [Dd, E, F] = g.dfs_to_hr.row, det = A * E - B * Dd;
    const x = gx - C, y = gy - F;
    c = Math.round((E * x - B * y) / det) - g.dfs.i0;
    r = Math.round((A * y - Dd * x) / det) - g.dfs.j0;
  }
  if (c < 0 || r < 0 || c >= CUR.w || r >= CUR.h) return undefined;
  return CUR.u[r * CUR.w + c];
}
$("stage").addEventListener("mousemove", ev => {
  if (!V || !GEO || ev.target.closest("#tl, #play, #legend")) { $("tip").hidden = true; return; }
  const rc = $("stage").getBoundingClientRect(), x = ev.clientX - rc.left, y = ev.clientY - rc.top;
  const mx = (x - MT.tx) / MT.sc, my = (y - MT.ty) / MT.sc;
  const gx = V.fromX(mx), gy = V.fromY(my), v = valueAt(gx, gy), tip = $("tip");
  const hb = META.grids.hr, c = Math.round(gx) - hb.i0, r = Math.round(gy) - hb.j0;
  const inHr = c >= 0 && r >= 0 && c < hb.w && r < hb.h;
  const sg = inHr && MSIG ? GEO.sigun.find(s => s.id === MSIG[r * hb.w + c]) : null;
  highlight(sg && sg.kind === "gn" ? sg.name : null);
  if (v === undefined) { tip.hidden = true; return; }
  loadEmd();
  let where = "";
  if (MEMD instanceof Uint16Array && inHr) {
    const e = EMDN.get(MEMD[r * hb.w + c]);
    if (e) where = `${e.sigun} ${e.name}`;
  }
  if (!where && sg) where = sg.name;
  const [lon, lat] = LCC(gx, gy), fac = factor();
  const val = v === MISSING ? "결측"
    : fac > 1 ? `${(v / 10 * fac).toFixed(1)}㎜/h 환산</b> (15분 ${(v / 10).toFixed(1)}㎜)<b>`
    : `${(v / 10).toFixed(1)}㎜`;
  tip.innerHTML = `<b>${val}</b>${where ? " · " + where : ""}<div class="d">${lat.toFixed(4)}°N ${lon.toFixed(4)}°E · 칸 ${Math.round(gx)}, ${Math.round(gy)}</div>`;
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(V.W - tw - 6, x + 16) + "px";
  tip.style.top = Math.max(6, y - th - 12) + "px";
});
$("stage").addEventListener("mouseleave", () => { $("tip").hidden = true; highlight(null); });

$("b-test").onclick = () => { test = !test; GRIDS.clear(); STATS.clear(); loadFlow().then(() => show()); };
$("b-tl").onclick = () => setTL(!tlOn);
$("tl-x").onclick = () => setTL(false);
$("tl-stat").onclick = () => { SET.tl_stat = SET.tl_stat === "mean" ? "max" : "mean"; saveSetting({ tl_stat: SET.tl_stat }); buildTL(); };
$("b-prefs").onclick = openPrefs;
document.addEventListener("keydown", ev => {
  if (ev.target.closest?.("input, textarea")) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key === ",") { ev.preventDefault(); $("prefs").hidden ? openPrefs() : closePrefs(); return; }
  if (ev.key === "Escape") { closePrefs(); return; }
  if (!$("prefs").hidden || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const i = "1234567".indexOf(ev.key);
  if (i >= 0) { stopPlay(); choose(KINDS[i], true); }
  else if (ev.key === "t" || ev.key === "T") $("b-test").click();
  else if (ev.key === "l" || ev.key === "L") setTL(!tlOn);
  else if (ev.key === " " && FLOWK.has(kind)) { ev.preventDefault(); playing ? stopPlay() : startPlay(); }
  else if ((ev.key === "ArrowRight" || ev.key === "ArrowLeft") && FLOW && FLOWK.has(kind)) {
    stopPlay();
    const n = FLOW.frames.length, j = curFrame();
    seek(((j < 0 ? 0 : j) + (ev.key === "ArrowRight" ? 1 : -1) + n) % n);
  }
});

/* 창 크기뿐 아니라 판 크기가 바뀔 때마다(가려졌다 보일 때 포함) 다시 짠다 */
let rsz = null;
const relayout = () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => { if (!GNB) return; PATTERN = null; layout(); draw(); buildTL(); }, 120);
};
window.addEventListener("resize", relayout);
new ResizeObserver(relayout).observe($("stage"));

async function boot() {
  applyTheme();
  try {
    [META, TOPO, GEO] = await Promise.all([getJson("/api/grid/meta"),
      getJson("/api/grid/geo/gyeongnam.topo.json"), getJson("/api/grid/geo/grids.json")]);
    MSIG = new Uint8Array(await (await fetch("/api/grid/geo/mask_sigun.u8.gz")).arrayBuffer());
  } catch (e) {
    $("empty").innerHTML = `지도를 띄울 수 없다<small>${e.message}</small>`;
    $("empty").className = "fail"; $("empty").hidden = false;
    return;
  }
  FEAT = topojson.feature(TOPO, TOPO.objects.sigun).features;
  SET = { ...SET_DEFAULT, ...(META.setting || {}) };
  vsrtN = +SET.vsrt_n || 1; x4 = !!SET.x4;
  tlOn = Q.has("tl") ? Q.get("tl") === "1" : !!SET.tl_on;
  const want = Q.get("layer") || SET.layer || "obs60";      // URL 이 서버 설정보다 먼저다(화면 고정용)
  if (want.startsWith("vsrt")) { kind = "vsrt"; const n = +want.replace(/\D/g, ""); if (n >= 1 && n <= 6) vsrtN = n; }
  else kind = KINDS.includes(want) ? want : "obs60";
  GNB = gnBounds();
  layout();
  await show();
  applyTL(false);                       // 범례가 그려진 뒤에 지도 비켜설 자리를 다시 잰다
  await loadFlow();
  setInterval(refreshMeta, 60000);
  // 카드는 종합 화면처럼 1분마다 다시 읽는다(DB 만 읽는다 — 기상청 호출은 늘지 않는다)
  setInterval(() => { if (!test) loadCards(); }, 60000);
}
boot();
</script>
