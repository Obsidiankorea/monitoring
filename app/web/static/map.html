    const x = V.toX(r.where.col), y = V.toY(r.where.row);
    return { x0: x - pr, x1: x + pr, y0: y - pr, y1: y + pr };
  })), out = [];
  const hit = b => placed.some(p => b.x0 < p.x1 && b.x1 > p.x0 && b.y0 < p.y1 && b.y1 > p.y0);
  const inside = b => b.x0 >= 4 && b.y0 >= 4 && b.x1 <= V.W - 4 && b.y1 <= V.H - 4;
  for (const r of rows) {
    const ax = V.toX(r.where.col), ay = V.toY(r.where.row);
    const val = (r.max * fac).toFixed(1);
    const emd = r.where.emd || "";
    const w = Math.max(val.length * fs * 0.62, emd.length * fs2 * 1.02) + 4, h = fs + fs2 + 2;
    const pad = pr + 3;                      // 제 점 자리(pr)는 건너뛴다
    let best = null;
    for (const k of [1, 1.9, 3]) {
      const d = pad * k;
      for (const [dx, dy] of [[d, -h / 2], [-d - w, -h / 2], [-w / 2, -d - h], [-w / 2, d],
                              [d, -h - d / 2], [d, d / 2], [-d - w, -h - d / 2], [-d - w, d / 2]]) {
        const b = { x0: ax + dx, y0: ay + dy, x1: ax + dx + w, y1: ay + dy + h };
        if (inside(b) && !hit(b)) { best = b; break; }
      }
      if (best) break;
    }
    // 끝내 빈자리가 없으면 오른쪽에 그냥 둔다 — 극값은 가리더라도 빼지 않는다
    best = best || { x0: ax + pad, y0: ay - h / 2, x1: ax + pad + w, y1: ay + h / 2 };
    placed.push(best);
    const cx = Math.max(best.x0, Math.min(ax, best.x1)), cy = Math.max(best.y0, Math.min(ay, best.y1));
    const far = Math.hypot(cx - ax, cy - ay) > pad * 1.3;
    out.push(
      (far ? `<line class="lead" x1="${ax}" y1="${ay}" x2="${cx}" y2="${cy}"/>` : "")
      + `<circle class="pin" cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="${Math.max(3, fs * 0.17).toFixed(1)}" stroke-width="${Math.max(1.5, fs * 0.08).toFixed(1)}"/>`
      + `<text class="mx" x="${(best.x0 + 2).toFixed(1)}" y="${(best.y0 + fs * 0.86).toFixed(1)}"
          style="font-size:${fs.toFixed(1)}px;stroke-width:${(fs * 0.16).toFixed(1)}px">${val}</text>`
      + (emd ? `<text class="mxw" x="${(best.x0 + 2).toFixed(1)}" y="${(best.y0 + fs + fs2 * 0.86).toFixed(1)}"
          style="font-size:${fs2.toFixed(1)}px;stroke-width:${(fs2 * 0.18).toFixed(1)}px">${emd}</text>` : ""));
  }
  g.innerHTML = out.join("");
  LABELBOX = placed;                     // 관측소 글자가 피해 갈 자리(이름·특보 딱지·최대 라벨)
  drawStations();
}

const BAND_H = 182;                                   // 색 띠 높이(px) — 청색 7칸 × 26

  const cells = css.map(c => `<i style="background:${c}"></i>`).join("");

    <div class="sw"><b class="h"></b>결측(땅)</div>

}
/* 범례 색 띠를 누르면 청색 ↔ 기상청 레이더 색. 지도 · 범례 · 관측소 · 타임라인 · 패널 칸이 같이 바뀐다 */

/* 지금 시각 — 시연(스냅숏)이면 서버가 멈춰 둔 그 시각(/api/clock.js 가 맨 먼저 window.GN_NOW 를 둔다) */

/* ── 층 메뉴 — 지도 위 제목을 누르면 내려온다. 실측(15분 · 1시간 · 누적) / 예측(초단기 · 단기), 숫자 키 1~6 ── */

let LM_KB = -1;

/* 층 고르기 — 단기 오늘·내일은 켜고 끄는 단추다. 켠 것을 한 번 더 누르면 풀고 그 앞에 보던 층으로

  if (k.startsWith("shrt") && !kind.startsWith("shrt")) PREVK = kind;

function saveSetting(body) {
  if (CASE) return;                       // 재현을 보는 동안 고른 것은 실황 설정에 남기지 않는다
  if (SHOW.on) return;                    // 화면 재생 중 — 화면마다 바꾸는 층 · 구간은 이 화면 것일 뿐(다른 화면 설정을 흔들지 않게)

/* ── 자료 ─────────────────────────────────────────────────────────── */
/* ?tm=YYYYMMDDHHMI — 실측 층을 그 시각으로 본다(점검용. 남아 있는 사흘 안에서만). */
const PIN_TM = !CASE && /^\d{12}$/.test(Q.get("tm") || "") ? Q.get("tm") : null;
const pinned = key => PIN_TM && !test && ["obs15", "obs60", "obsday", "odam"].includes(key);
function reqTm(key) {
  if (CASE) return OBS_TM || CASEM?.end || null;
  if (OBSK.has(key) && OBS_TM) return OBS_TM;
  return pinned(key) ? PIN_TM : null;
}
/* 누적(acc) 층 요청에 카드의 구간을 싣는다 — 저장한 설정이 서버에 닿기 전에도 같은 구간을 그리게 */
function accParams(p, key) {
  if (!ACCK.has(key) || CASE) return p;
  p.set("hours", String(SET.acc_hours || 12));
  p.set("since", SET.acc_from === "date" ? SET.acc_date : SET.acc_from || "hours");     // 날짜 지정은 'YYYYMMDD'
  return p;
}
const accSig = key => ACCK.has(key) && !CASE ? `|${SET.acc_from || "hours"}:${SET.acc_hours || 12}:${SET.acc_date || ""}` : "";
function qs(key, tm) {
  const p = new URLSearchParams();
  if (tm) p.set("tm", tm);
  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  accParams(p, key);

  return s ? "?" + s : "";
}
function wantTm(key) {
  if (CASE) return "case:" + CASE;

  return metaOf(k).tm || "";
}
/* 시각을 준 프레임(재생 · 지난 시각)은 '최신'이 바뀌어도 그대로다 — 최신만 최신 시각을 키에 넣는다.
   ⚠️ 예전에는 늘 넣어서, AWS '지금' 칸이 1분마다 바뀌자 재생 흐름 정시 장들을 1분마다 다시 받았다.
   AWS 1시간 정시는 늦게 온 지점이 채워질 수 있어 그 정시(시)만 넣는다 */
const ckOf = (key, tm) => key + "|" + (tm || "") + "|"
  + (test ? "test" : !tm ? wantTm(key) : key === "aws60" ? wantTm(key).slice(0, 10) : "") + accSig(key);
async function fetchGrid(key, tm) {
  const ck = ckOf(key, tm);
  if (GRIDS.has(ck)) return GRIDS.get(ck);
  const r = await fetch(`/api/grid/${encodeURIComponent(key)}${qs(key, tm)}`, { cache: "no-cache" });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
  const buf = await r.arrayBuffer();
  const [h, w] = r.headers.get("X-Grid-Shape").split(",").map(Number);
  const hd = n => r.headers.get("X-Grid-" + n);
  const gr = { ck, key, u: new Uint16Array(buf), h, w, grid: r.headers.get("X-Grid"),
               tm: hd("Tm"), tmfc: hd("Tmfc"), capped: hd("Capped"), from: hd("From"),
               hours: hd("Hours") ? hd("Hours").split(",") : null, n: hd("N"), live: hd("Live") };
  if (gr.u.length !== h * w) throw new Error("격자 크기가 맞지 않는다");
  if (GRIDS.size > 200) GRIDS.delete(GRIDS.keys().next().value);
  GRIDS.set(ck, gr);
  return gr;
}
async function fetchStat(key, tm) {
  const ck = ckOf(key, tm);
  if (STATS.has(ck)) return STATS.get(ck);
  const p = new URLSearchParams({ layer: key });
  if (tm) p.set("tm", tm);
  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  accParams(p, key);
  const j = await getJson(`/api/grid/sigun?${p}`);
  if (STATS.size > 200) STATS.delete(STATS.keys().next().value);
  STATS.set(ck, j);
  return j;
}

let SEQ = 0, SWITCH_MS = 0;
async function show(fade = false) {

    if (my !== SEQ) return;                     // 그새 다른 층을 골랐다

function choose(k, save) {
  const cardWas = cardKey();
  kind = k;
  if (!CASE) OBS_TM = null;              // 메뉴로 고르면 늘 '지금'(사례는 보던 시각 그대로)
  if (save) saveSetting(k === "vsrt" ? { layer: "vsrt", vsrt_n: vsrtN } : { layer: k });
  show();
  // 위 카드 · 예측 카드가 바뀐다: 강수 누적 ↔ '그 시각'(15분 · 1시간 · 실황 · 초단기) ↔ 단기 오늘 ↔ 단기 내일
  if (cardKey() !== cardWas) loadCards();
  // 재생 흐름의 실측 자료가 바뀌었다(격자 60분 ↔ AWS 1시간) — 흐름을 그 자료로 다시 받는다
  if (!CASE && FLOW && (FLOW.src || "grid") !== flowSrc()) loadFlow();
}

/* ── 재생 흐름 ────────────────────────────────────────────────────── */
async function loadFlow() {
  const p = new URLSearchParams({ hours: SET.flow_hours, step: SET.flow_step });
  if (!CASE && flowSrc() === "aws") p.set("src", "aws");   // AWS 1시간 — 정시마다(간격 설정은 격자에만)
  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  try { FLOW = await getJson(`/api/grid/flow?${p}`); }
  catch { FLOW = null; }
  if (FLOW) {
    FLOW.tt = FLOW.frames.map(f => tOf(f.t));
    FLOW.t0 = Math.min(tOf(FLOW.start), ...FLOW.tt);
    FLOW.t1 = Math.max(tOf(FLOW.now), ...FLOW.tt);
    FLOW.tn = tOf(FLOW.now);
  }
  buildPlay(); buildTL(); tlPlayhead();
  if (test) loadCards();                 // 테스트 카드는 합성 흐름에서 뽑는다 — 지도와 같은 값
  preloadFlow();
}
/* 지금 보는 프레임의 시각(ms) — 흐름 밖 층이면 null */
function headT() {
  if (!FLOWK.has(kind) || !CUR || !CUR.tm) return null;
  return tOf(CUR.tm);
}
function nearestFrame(t) {
  if (!FLOW || !FLOW.frames.length) return -1;
  let best = 0, bd = Infinity;
  FLOW.tt.forEach((x, i) => {
    // 같은 거리면 '지금' 앞은 실측, 뒤는 예측을 고른다
    const d = Math.abs(x - t) + (FLOW.frames[i].kind === "fcst" ? (t <= FLOW.tn ? 1 : -1) : 0);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function curFrame() {
  const t = headT();
  if (t == null || !FLOW) return -1;
  // 같은 시각이라도 층이 맞는 프레임을 고른다(사례는 실측뿐이다)
  const i = FLOW.frames.findIndex(f => (CASE || OBSK.has(kind) ? f.kind === "obs" : f.kind === "fcst" && f.n === vsrtN)
    && tOf(f.t) === t);
  return i >= 0 ? i : nearestFrame(t);
}
function seek(i, fade = true) {
  if (!FLOW || i < 0 || i >= FLOW.frames.length) return;
  const f = FLOW.frames[i];
  if (CASE) {
    OBS_TM = f.t;                         // 사례는 고른 층(1시간/누적) 그대로 시각만 옮긴다
  } else if (f.kind === "obs") {
    kind = f.layer;                       // 격자 60분 | AWS 1시간 — 흐름이 고른 자료 그대로
    OBS_TM = f.t === metaOf(kind).tm ? null : f.t;
  } else {
    kind = "vsrt"; vsrtN = f.n; OBS_TM = null;
  }
  if (playing) qpfFollow(tOf(f.t));
  show(fade);
}
function startPlay() {
  if (!FLOW || !FLOW.frames.length) return;
  stopPlay(true);
  qpfSyncOn();                           // 초단기예측 이미지 — 지도 재생 동안은 같은 시각으로 따라간다
  let i = curFrame();
  playing = setInterval(() => {
    i = (i + 1) % FLOW.frames.length;
    seek(i);
  }, SET.play_ms);
  qpfFollow(headT());                    // 누르는 순간부터 같은 시각
  buildPlay();
}
function stopPlay(quiet) {
  if (playing) { clearInterval(playing); playing = null; if (!quiet) buildPlay(); }
  if (!quiet) qpfSyncOff();              // 재생을 멈추면 초단기예측 이미지는 다시 따로
}
async function preloadFlow() {
  if (!FLOW) return;
  for (const f of FLOW.frames) {
    const key = CASE ? kind : f.layer;
    const tm = CASE ? f.t : f.kind === "obs" && f.t !== metaOf(f.layer).tm ? f.t : null;
    try { await Promise.all([fetchGrid(key, tm), fetchStat(key, tm)]); } catch {}
  }
}

/* 재생 막대 — 지난 실측(틱마다 한 장) │지금│ 예측(시간마다 한 장). 끌어서 옮긴다.
   막대는 흐름이 바뀔 때만 새로 그리고, 재생 중에는 손잡이와 글자만 옮긴다(그래야 미끄러진다). */
const fmtH = t => String(new Date(t).getHours()).padStart(2, "0");
const TRK = { Wt: 640, Ht: 46, padX: 10 };

function playHead() {
  const p = $("play");
  if (p.hidden || !FLOW) return;
  const ht = headT(), i = curFrame(), f = i >= 0 ? FLOW.frames[i] : null;
  const x = ht != null ? trkX(ht) : -40;
  for (const el of p.querySelectorAll(".trk-head, .trk-knob")) el.style.transform = `translateX(${x.toFixed(1)}px)`;

    Object.assign(V, { s: V.s * m.a, ox: m.e + m.a * V.ox, oy: m.f + m.a * V.oy });
    MT = { tx: 0, ty: 0, sc: 1 };
    setWrap(MT, false);
  }
  st.classList.add("zooming");
  st.classList.toggle("zoomed", T.zoom);
  link(null);
  if (T.zoom) { drawEmd(); ensureEmd(); }   // 확대해 들어가면 그 시군 읍면동 선을 미리(지금 그린 틀로) 그려 둔다
  const ctr = c => [V.X0 + (V.W / 2 - c.ox) / c.s, V.Y1 - (V.H / 2 - c.oy) / c.s, V.W / c.s];
  const path = zoomPath(ctr(V), ctr(T.cam));
  const dur = Math.min(950, Math.max(450, path.S * 600)), t0 = performance.now();
  const za = ZA = { gen, T, raf: 0 };
  // 창이 가려지면 requestAnimationFrame 이 멈춘다 — 그래도 끝 상태로는 가 있게
  setTimeout(() => { if (ZA === za) camSet(T); }, dur + 400);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = p < .5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2;
    if (p >= 1) { camSet(T); return; }
    const [cx, cy, w] = path(e), s = V.W / w;
    Object.assign(V, { s, ox: V.W / 2 - (cx - V.X0) * s, oy: V.H / 2 - (V.Y1 - cy) * s });
    const k = V.s / gen.s;
    const vb = `${(gen.ox - V.ox / k).toFixed(2)} ${(gen.oy - V.oy / k).toFixed(2)} ${(V.W / k).toFixed(2)} ${(V.H / k).toFixed(2)}`;
    $("under").setAttribute("viewBox", vb); $("over").setAttribute("viewBox", vb);
    draw(false, true);
    ZA.raf = requestAnimationFrame(step);
  };
  ZA.raf = requestAnimationFrame(step);
}

/* 읍면동 경계(data/geo/emd.topo.json, tools/build_geo.py) — 처음 확대할 때 받는다.
   ⚠️ 시군 경계(SGIS 2020)와 원본(행정동 2026.7)이 달라 바깥 둘레가 수십 m 어긋난다 —
      같은 시군 안 읍면동 사이 선만 긋고, 시군 모양으로 잘라 삐져나온 끝을 감춘다. */
let ETOPO = null, EFEAT = null, EMDP = null;
const EMESH = new Map();
function ensureEmd() {
  if (!EMDP) EMDP = getJson("/api/grid/geo/emd.topo.json").then(t => {
    ETOPO = t; EFEAT = topojson.feature(t, t.objects.emd).features;
    if (zoomOn()) { drawEmd(); if (!ZA) drawStations(); }
  }).catch(() => { EMDP = null; });
  return EMDP;
}
function drawEmd() {
  const g = $("emd");
  if (!g) return;
  if (!selOn() || !ETOPO || !$("stage").classList.contains("zoomed")) { g.innerHTML = ""; return; }
  const fts = FEAT.filter(f => isSel(f.properties.sigun));
  for (const sg of SELS) if (!EMESH.has(sg))
    EMESH.set(sg, topojson.mesh(ETOPO, ETOPO.objects.emd,
      (a, b) => a !== b && a.properties.sigun === sg && b.properties.sigun === sg));
  const d = SELS.map(sg => PATH(EMESH.get(sg)) || "").join("");
  g.innerHTML = fts.length && d ? `<clipPath id="emdclip">${fts.map(ft => `<path d="${PATH(ft)}"/>`).join("")}</clipPath><path clip-path="url(#emdclip)" d="${d}"/>` : "";
}
/* 읍면동 이름 — 큰 곳부터, 시군명·최대 라벨·관측소와 겹치지 않는 자리에만(가장 덜 중요한 글자) */
function drawEmdNames(taken) {
  const g = $("emdn");
  if (!g) return;
  if (!CAM || !selOn() || !EFEAT || !V) { g.innerHTML = ""; return; }
  const cells = new Map((GEO?.emd || []).map(e => [e.id, e.n]));
  const fs = Math.max(12.5, Math.min(22, V.u * 4.6)), h = fs * 1.25;
  const placed = taken.slice(), out = [];
  const hit = b => placed.some(p => b.x0 < p.x1 && b.x1 > p.x0 && b.y0 < p.y1 && b.y1 > p.y0);
  const A = mapArea();
  const list = EFEAT.filter(f => isSel(f.properties.sigun))
    .sort((a, b) => (cells.get(b.properties.id) || 0) - (cells.get(a.properties.id) || 0));
  for (const f of list) {
    const p = f.properties, x = V.toX(p.lx), y = V.toY(p.ly), w = p.name.length * fs + 6;
    const b = { x0: x - w / 2, x1: x + w / 2, y0: y - h / 2, y1: y + h / 2 };
    if (b.x0 < A.x0 - 8 || b.x1 > A.x1 + 8 || b.y0 < 4 || b.y1 > V.H - 4 || hit(b)) continue;
    placed.push(b);
    out.push(`<text class="en" x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${fs.toFixed(1)}px;stroke-width:${(fs * 0.2).toFixed(1)}px">${p.name}</text>`);
  }
  g.innerHTML = out.join("");
}

/* 재생 막대 — 범례 오른쪽 ~ 패널 왼쪽 빈자리 가운데. 막대(약 880px)가 그보다 넓으면 눈금 줄(TRK.Wt)을 줄인다.
   ⚠️ FHD 를 125%(1536px)로 띄우고 패널을 열면 지도 칸이 976px — 막대 왼끝이 범례(결측·비 없음) 밑으로 들어갔다.
   ⚠️ 막대에 zoom(--k)이 걸려 있어 left 도 그만큼 곱해진다 — 나눠 둔다 */
function placePlay() {
  if (!V) return;
  const p = $("play"), st = $("stage").getBoundingClientRect(), lg = $("legend").getBoundingClientRect();
  const x0 = (lg.width ? lg.right - st.left : 0) + 14, x1 = (tlOn ? V.W - tlWidth() : V.W) - 16;
  if (!p.hidden && p.offsetWidth) {
    const pw = p.getBoundingClientRect().width;
    const want = Math.round(Math.max(240, Math.min(640, TRK.Wt - (pw - (x1 - x0)) / V.k)));
    if (Math.abs(want - TRK.Wt) > 3) { TRK.Wt = want; p.dataset.sig = ""; buildPlay(); }
  }
  $("stage").style.setProperty("--playx", ((x0 + x1) / 2 / V.k).toFixed(0) + "px");
  placeSw();                               // 재생 막대가 생기거나 옮겼다 — 바다 위젯이 피해 간다
}
function setTL(on, save = true) {
  tlOn = on;
  if (save) saveSetting({ tl_on: on });
  applyTL(true);
  paintHead();
}

function buildTL() {
  const svg = $("tl-svg");
  $("tl-stat").textContent = SET.tl_stat === "mean" ? "평균" : "최대";
  $("tl-sub").textContent = `시군 ${SET.tl_stat === "mean" ? "평균" : "최대"} 1시간 강수량 · 지난 ${SET.flow_hours}시간 → +6시간`;
  if (!tlOn || !V) return;
  const box = svg.getBoundingClientRect();
  const W = box.width, H = box.height;
  if (!W || !H) return;
  const k = V.k;
  if (!FLOW || !FLOW.frames.length) {
    svg.innerHTML = `<text class="tl-empty" x="${W / 2}" y="${H / 2}" style="font-size:${15 * k}px">재생할 자료가 아직 없다 — 수집이 쌓이면 나타난다</text>`;
    TLG = null; return;
  }
  const stat = SET.tl_stat === "mean" ? "mean" : "max";
  const rowsD = [{ name: "경남", tot: true, v: FLOW.total[stat] }]
    .concat(FLOW.series.map(s => ({ name: s.sigun, v: s[stat] })));
  const nameW = 66 * k, valW = 78 * k, axisH = 30 * k, padR = 14 * k;
  const x0 = nameW + 14 * k, x1 = W - valW - padR;
  const rh = (H - axisH - 8 * k) / rowsD.length;
  const xT = t => x0 + (t - FLOW.t0) / Math.max(1, FLOW.t1 - FLOW.t0) * (x1 - x0);
  let vmax = 10;
  for (const r of rowsD) for (const v of r.v) if (v != null && v > vmax) vmax = v;
  const xn = xT(FLOW.tn);
  const out = [];
  // 예측 쪽 바탕, 시각 눈금, '지금'
  out.push(`<rect class="tl-fczone" x="${xn}" y="${axisH - 6 * k}" width="${x1 - xn + padR / 2}" height="${H - axisH}"/>`);
  const h0 = new Date(FLOW.t0); h0.setMinutes(0, 0, 0);
  const span = (FLOW.t1 - FLOW.t0) / 3600e3, every = span > 14 ? 3 : span > 8 ? 2 : 1;
  for (let t = h0.getTime() + 3600e3; t <= FLOW.t1; t += 3600e3) {
    const xx = xT(t);
    // '지금'·'실측'·'예측' 글자와 겹치는 눈금은 뺀다
    if (new Date(t).getHours() % every === 0 && Math.abs(xx - xn) > 22 * k
        && xx - x0 > 34 * k && x1 - xx > 34 * k)
      out.push(`<text class="tl-hour" x="${xx}" y="${axisH - 12 * k}" style="font-size:${12 * k}px">${fmtH(t)}</text>`);
  }
  out.push(`<text class="tl-zl" x="${x0}" y="${axisH - 12 * k}" style="font-size:${11 * k}px" text-anchor="start">실측</text>`);
  out.push(`<text class="tl-zl" x="${x1}" y="${axisH - 12 * k}" style="font-size:${11 * k}px" text-anchor="end">예측</text>`);
  out.push(`<text class="tl-nowl" x="${xn}" y="${axisH - 12 * k}" style="font-size:${12 * k}px">${NOWL}</text>`);
  out.push(`<line class="tl-now" x1="${xn}" x2="${xn}" y1="${axisH - 4 * k}" y2="${H}"/>`);
  // 실측이 앞쪽까지 다 차 있지 않으면(막 수집을 시작했거나 끊겼다) 비어 있는 까닭을 적는다
  const firstObs = FLOW.frames.findIndex(f => f.kind === "obs");
  const gapTo = firstObs >= 0 ? FLOW.tt[firstObs] : FLOW.tn;
  if (gapTo - FLOW.t0 > FLOW.step * 2 * 60e3 && xT(gapTo) - x0 > 120 * k)
    out.push(`<text class="tl-empty" x="${(x0 + xT(gapTo)) / 2}" y="${axisH + 22 * k}" style="font-size:${12 * k}px">`
      + (firstObs >= 0 ? `실측 ${hm(FLOW.frames[firstObs].t)}부터 — 쌓이는 중` : "실측 없음") + `</text>`);

  const fs = Math.min(18 * k, rh * 0.42);
  rowsD.forEach((r, ri) => {
    const top = axisH + ri * rh, base = top + rh - 5 * k, ph = rh - 12 * k;
    const y = v => base - Math.min(v, vmax) / vmax * ph;
    const seg = sel => {
      // 결측(null)은 끊는다 — 0 으로 잇지 않는다
      let d = "", a = "", run = [];
      const flush = () => {
        if (run.length) {
          d += "M" + run.map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join("L");
          a += `M${run[0][0].toFixed(1)},${base}L` + run.map(([px, py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join("L")
             + `L${run[run.length - 1][0].toFixed(1)},${base}Z`;
        }
        run = [];
      };
      FLOW.frames.forEach((f, i) => {
        if (!sel(f)) return;
        const v = r.v[i];
        if (v == null) { flush(); return; }
        run.push([xT(FLOW.tt[i]), y(v)]);
      });
      flush();
      return { d, a };
    };
    const po = seg(f => f.kind === "obs"), pf = seg(f => f.kind === "fcst");
    // 기간 최고 — 1㎜ 넘을 때만 숫자를 단다
    let pi = -1, pv = 0;
    r.v.forEach((v, i) => { if (v != null && v > pv) { pv = v; pi = i; } });
    const peak = pi >= 0 && pv >= 1
      ? `<text class="tl-peak" x="${xT(FLOW.tt[pi])}" y="${Math.max(top + fs * 0.9, y(pv) - 4 * k)}" style="font-size:${11.5 * k}px">${pv.toFixed(pv >= 10 ? 0 : 1)}</text>` : "";
    out.push(`<g class="tl-row ${r.tot ? "tot" : ""}" data-s="${r.tot ? "" : r.name}" data-i="${ri}">
      <rect class="tl-bg" x="0" y="${top}" width="${W}" height="${rh}"/>
      <line class="tl-sep" x1="${8 * k}" x2="${W - 8 * k}" y1="${top + rh}" y2="${top + rh}"/>
      <text class="tl-name ${r.tot ? "tot" : ""}" x="${12 * k}" y="${top + rh / 2}" style="font-size:${fs}px">${r.tot ? "경남" : r.name}</text>
      <path class="tl-area" d="${po.a}"/><path class="tl-line" d="${po.d}"/>
      <path class="tl-farea" d="${pf.a}"/><path class="tl-fline" d="${pf.d}"/>
      ${peak}
      <circle class="tl-dot" r="${5 * k}" cx="-99" cy="-99"/>
      <text class="tl-val" x="${W - padR}" y="${top + rh / 2}" style="font-size:${Math.min(20 * k, rh * 0.48)}px"></text>
    </g>`);
  });
  out.push(`<line class="tl-head" id="tl-head" x1="0" x2="0" y1="${axisH - 6 * k}" y2="${H}" style="transform:translateX(-9px)"/>`);
  svg.innerHTML = out.join("");
  TLG = { xT, y0: axisH, rh, vmax, rowsD, k, base: ri => axisH + ri * rh + rh - 5 * k, ph: rh - 12 * k, x0, x1 };
  for (const g of svg.querySelectorAll(".tl-row")) {
    g.onmouseenter = () => highlight(g.dataset.s || null);
    g.onmouseleave = () => highlight(null);
  }
  // 그래프를 누르거나 끌면 그 시각으로 — 지도가 따라온다
  let drag = false, last = -1;
  const go = ev => {
    const r = svg.getBoundingClientRect(), xx = ev.clientX - r.left;
    if (xx < TLG.x0 - 6 || xx > TLG.x1 + 6) return;
    const t = FLOW.t0 + (xx - TLG.x0) / (TLG.x1 - TLG.x0) * (FLOW.t1 - FLOW.t0);
    const i = nearestFrame(t);
    if (i !== last) { last = i; seek(i); }
  };
  svg.onpointerdown = ev => { drag = true; stopPlay(); svg.setPointerCapture(ev.pointerId); last = -1; go(ev); };
  svg.onpointermove = ev => { if (drag) go(ev); };
  svg.onpointerup = () => { drag = false; };
  // 처음 놓을 때는 미끄러지지 않게 — 화면 밖(-99)에서 날아 들어오는 것처럼 보인다
  svg.classList.add("noanim");
  tlPlayhead();
  requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove("noanim")));
}

/* 재생 위치만 바꾼다 — 줄을 다시 그리지 않는다(재생 중 매 프레임 부른다) */
function tlPlayhead() {
  if (!TLG || !tlOn || !FLOW) return;
  const stat = SET.tl_stat === "mean" ? "mean" : "max";
  const ht = headT();
  const i = curFrame();
  const head = $("tl-head");
  if (head) head.style.transform = `translateX(${(ht != null ? TLG.xT(ht) : -9).toFixed(1)}px)`;
  // 값은 지도와 **같은 숫자**여야 한다 — 지금 그린 격자의 시군 통계(CURSTAT)를 먼저 쓴다
  const live = FLOWK.has(kind) && CURSTAT ? Object.fromEntries(CURSTAT.rows.map(r => [r.sigun, r[stat]])) : null;
  let topName = null, topV = 0;
  const rows = document.querySelectorAll(".tl-row");
  rows.forEach((g, ri) => {
    const r = TLG.rowsD[ri];
    let v = null;
    if (live && !r.tot) v = live[r.name];
    else if (i >= 0) v = r.v[i];
    else v = r.v[FLOW.frames.findLastIndex ? FLOW.frames.findLastIndex(f => f.kind === "obs") : -1];
    if (live && r.tot) v = i >= 0 ? r.v[i] : null;
    const dot = g.querySelector(".tl-dot"), txt = g.querySelector(".tl-val");
    const k = stepIdx(v, STEPS.m60), kc = rampColor(v, STEPS.m60, true);
    // cx·cy 를 style 로 줘야 CSS 전환이 걸린다(속성으로 바꾸면 순간이동한다)
    if (ht != null && v != null) {
      dot.style.cx = TLG.xT(ht).toFixed(1) + "px";
      dot.style.cy = (TLG.base(ri) - Math.min(v, TLG.vmax) / TLG.vmax * TLG.ph).toFixed(1) + "px";
      // 청색은 옅은 단계가 어두운 바탕에 묻혀 3단계부터 — 기상청 색은 그대로
      // 기상청 색도 1㎜ 아래는 바탕 쪽으로 섞어 둬서(fadeLow) 점이 묻힌다 — 그때는 회색 점
      dot.style.fill = !kc ? "var(--ink-3)" : kmaOn() ? (v >= 1 ? kc : "var(--ink-3)") : `var(--rain-${Math.max(3, k)})`;
      dot.style.opacity = "1";
    } else { dot.style.opacity = "0"; }
    txt.textContent = v == null ? "—" : v.toFixed(1);
    txt.classList.toggle("zero", !v);
    if (!r.tot && v != null && v > topV) { topV = v; topName = r.name; }
  });
  rows.forEach(g => g.classList.toggle("top", !!topName && g.dataset.s === topName && topV >= 0.1));
}

/* ── 오른쪽 카드 — 종합 화면(강수 모니터링)의 세 판을 작게 ─────────────────────
   실제 자료는 종합 화면과 **같은 API·같은 규칙**이다 — 숫자가 두 화면에서 같아야 한다.
     강수 누적  /api/rain(스방 → 비면 기상청) 시군마다 다우지점(자료 있는 지점 중 합계 최대)
                + /api/forecast 6시간 합(연한 막대 — 아래 '예측 상위'와 같은 값). 합으로 줄 세운다
     지금 오는 비 /api/minute — 15분·60분 상위
     예측 상위  /api/forecast 시군 — 6시간 합 순
   테스트 모드는 합성 흐름(/api/grid/flow?test=1)에서 뽑는다 — 지도와 같은 값이 나오게. */
let CARDS = null;
/* 예상 합 — 초단기 RN1 을 **그대로** 더한다(아래 '예측 상위' 칸 · 합과 같은 값, 0.1㎜ 로 맞춤).
   ⚠️ 예전에는 시간마다 0·5·10·20·30·50 가운데 가까운 값으로 바꿔 더했다 — 3㎜ 가 5, 2㎜ 가 0 이 되어 거제(시간 3㎜)가
   위 카드에는 +25 인데 예측 상위(그대로 합 15)에는 없었다. 재난상황보고서 예측 표도 RN1 을 그대로(정수로) 쓴다 */
const fcSum = a => Math.round(sumv(a) * 10) / 10;
const fcTxt = v => (+v).toFixed(v % 1 ? 1 : 0);
const ORDER_GN = () => GEO.sigun.filter(s => s.kind === "gn").map(s => s.name);
const sumv = a => a.reduce((x, v) => x + (typeof v === "number" ? v : 0), 0);

/* 시각 글자('12', '13', …, '23:36') → 시각(ms). 끝에서부터 거슬러 올라가며 날을 넘긴다 */
function labelTimes(labels, lastHM) {
  const out = new Array(labels.length), now = NOWD();
  const [lh, lm] = (lastHM || `${now.getHours()}:00`).split(":").map(Number);
  const t = new Date(now); t.setHours(lh, lm || 0, 0, 0);
  if (t - now > 3600e3) t.setDate(t.getDate() - 1);
  out[labels.length - 1] = t.getTime();
  for (let i = labels.length - 2; i >= 0; i--) {
    const c = new Date(out[i + 1]);
    c.setHours(+labels[i].slice(0, 2), labels[i].length > 2 ? +labels[i].slice(3, 5) : 0, 0, 0);
    if (c.getTime() >= out[i + 1]) c.setDate(c.getDate() - 1);
    out[i] = c.getTime();
  }
  return out;
}
function nextHours(labels, after) {          // 예측 '00','01',… → after 뒤의 시각들
  const out = [];
  let prev = after;
  for (const l of labels) {
    const c = new Date(prev); c.setHours(+l.slice(0, 2), 0, 0, 0);
    if (c.getTime() <= prev) c.setDate(c.getDate() + 1);
    out.push(c.getTime()); prev = c.getTime();
  }
  return out;
}

/* 누적 구간 — 지난 6·12·24·48시간 / 오늘 0시부터 / 어제 0시부터(서버 설정 acc_from · acc_hours).

  const stRow = (r, sel) => {
    const site = SITEBY.get(r.stn), emd = site?.emd || r.pos?.emd, e = emd ? FE[`${r.sigun}|${emd}`] : null;
    const fcd = e ? e.d.slice(0, 6) : [];
    const tag = !sel ? r.sigun : site ? (site.emd || "기상청") : own ? (r.pos?.emd || "경남") : "";
    return { sig: r.sigun, tag: sel && multi() ? `${r.sigun} ${tag}` : tag, stn: r.name, d: r.d, dt, fcd,
             ft: fcd.length ? ft : [], sum: r.sum, fc: fcSum(fcd), bad: r.bad, dead: !live(r), kma: !!site, h1: r.m60, org: orgOf(r),
             pos: sitePos(r.stn) || (r.pos ? { x: r.pos.x, y: r.pos.y, est: r.pos.est } : null), det: sel };
  };
  if (!selOn() && accPer() !== 1) {
    // 시군당 2·3곳 · 시군 무관 — 지점마다 한 줄(예상은 그 지점 읍면동 것). 자료를 안 주는 지점은 맨 뒤
    const rows = perSigun(rain.rows.map(r => stRow(r, false)), r => (r.dead ? -1 : r.sum));
    return { ...base, rows, per: accPer(), sub: `다우지점 ${perLabel()} · ${accSpan().label} + 예상 6시간` };
  }
  if (!selOn()) {
    const by = {};
    for (const r of rain.rows) (by[r.sigun] ||= []).push(r);
    const rows = ORDER_GN().filter(s => by[s]).map(s => {
      const st = by[s].slice().sort((a, b) => (live(b) - live(a)) || (b.sum - a.sum))[0];
      const fcd = (FC[s]?.d || []).slice(0, 6);
      return { sig: s, stn: st.name, d: st.d, dt, fcd, ft, sum: st.sum, fc: fcSum(fcd), bad: st.bad, h1: st.m60, org: orgOf(st),
               pos: sitePos(st.stn) || (st.pos ? { x: st.pos.x, y: st.pos.y, est: st.pos.est } : null) };
    });
    return { ...base, rows, sub: `다우지점 · ${accSpan().label} + 예상 6시간` };
  }
  // 그 시군(들) 지점 전부 — 내부망이면 스방 지점이 다 나온다(기상청 지점 포함). 기상청 지점은 읍면동·위치·예상이
  // 붙는다. 스방 자체 지점은 위치를 몰라 **이름이 가리키는 읍면동 가운데에 임시로** 둔다(서버 sites.position, est)
  const rows = rain.rows.filter(r => isSel(r.sigun)).map(r => stRow(r, true));
  const nk = rows.filter(r => r.org === "kma").length, est = rows.filter(r => r.pos?.est).length;
  const nopos = rows.length - rows.filter(r => r.pos).length;
  return { ...base, rows, sel: selName(),
    sub: `${selName()} AWS ${rows.length}곳${own ? ` (기상청 ${nk} · 경남 ${rows.length - nk})` : ""} · ${accSpan().label}`,
    note: [est ? `경남 AWS ${est}곳(${rows.filter(r => r.pos?.est).slice(0, 8).map(r => r.stn).join(" · ")}${est > 8 ? " …" : ""})은 목록에 없어 이름이 가리키는 읍면동 가운데에 임시로 둔다 — <a href="/api/aws/match" target="_blank">짝짓기 점검</a>` : "",
           nopos ? `${nopos}곳은 이름으로 읍면동을 못 찾아 지도에 짚지 않는다` : ""].filter(Boolean).join(" · ") };
}

/* 격자 기준 — 매시 정각 60분 격자를 칸마다 더한 누적. 시군 줄은 시군 누적 최대 칸(+읍면동),
   시군을 고르면 읍면동 줄(그 읍면동 누적 최대 칸). 선 그래프는 그 칸의 매시 값이다. */
async function accGrid(H, fc) {
  const p = new URLSearchParams({ hours: H });
  // 시군당 2곳 이상 · 시군 무관이면 경남 읍면동 전부(읍면동마다 누적 최대 칸)를 받아 고른다
  const emdRows = selOn() || accPer() !== 1;
  if (selOn()) p.set("sigun", selQ());
  else if (emdRows) p.set("sigun", ALLSIG);
  if (test) p.set("test", "1");
  if (accSpan().since) p.set("since", accSpan().since);
  const j = await getJson(`/api/grid/acctable?${p}`);
  const dt = j.frames.map(tOf), ft = nextHours(fc.labels || [], dt.at(-1));
  const [FC, FE] = fcMaps(fc);
  let rows = j.rows.map(r => {
    const fcd = ((emdRows ? FE[`${r.sig}|${r.name}`] : FC[r.sig])?.d || []).slice(0, 6);
    return { sig: r.sig, tag: selOn() ? (multi() ? r.sig : "") : r.sig, stn: emdRows ? r.name : (r.name || "—"), d: r.d, dt, fcd,
             ft: fcd.length ? ft : [], sum: r.sum ?? 0, fc: fcSum(fcd), det: selOn(),
             pos: r.col != null ? { x: r.col, y: r.row } : null, ...(r.h1 != null ? { h1: r.h1 } : {}) };
  });
  if (!selOn() && accPer() !== 1) rows = perSigun(rows, r => r.sum);
  return { rows, H, ft, basis: "grid", fell: false, sel: selOn() ? selName() : null, src: j.test ? "테스트" : "격자 500m",
    // 마지막 칸이 '지금' 칸(정시 뒤 ~ 최근 10분 칸, 일강수 차)이면 그 시각까지 — 빗금(최근 1시간)은 그 시각 60분 격자
    bt: j.tail ? `${hm(j.tm)}까지` : `${hm(j.tm)} 정각까지`, per: selOn() ? 1 : accPer(),
    sub: selOn() ? `${selName()} 읍면동 ${rows.length} · 누적 최대 칸 · ${accSpan().label}`
      : accPer() !== 1 ? `읍면동 누적 최대 칸 ${perLabel()} · ${accSpan().label} + 예상 6시간` : `시군 누적 최대 칸 · ${accSpan().label} + 예상 6시간`,
    note: j.missing ? `정시 격자 ${j.missing}시간 빠짐 — 합은 하한이다(수집기가 한 번에 4장씩 메운다)` : "" };
}

/* 위 카드 — 지도가 15분 · 1시간 · 실황 · 초단기면 **지도와 같은 층 · 같은 시각** 값(재생하면 같이 넘어간다).
   줄은 시군마다 가장 많은 곳(우클릭으로 시군당 n · 시군 무관). AWS 1시간은 관측소(그 정시 한 시간), 그 밖은 격자 읍면동
   최대 칸 — 시군당 1곳이면 지도 시군 라벨(CURSTAT)과 같은 값이다. 선 그래프는 재생 흐름의 그 시군 최대(지도와 같은 면)이고
   세로선이 지도 재생 위치다. 15분 · 실황은 흐름에 없어 막대만.
   ⚠️ 예전에는 지도가 1시간이어도 위 카드는 늘 '강수 누적'이었다 — 지도와 패널이 다른 것을 말했다 */
const EMDC = new Map();                  // /api/grid/emd 응답(층 · 시각 · 시군) — 재생 한 바퀴를 다시 받지 않게
async function emdAt(key, tm, sig) {
  const p = new URLSearchParams({ sigun: sig, layer: key });
  if (tm && !key.startsWith("vsrt")) p.set("tm", tm);      // 초단기는 지도와 같은 최신 발표분
  if (test) p.set("test", "1");
  const u = `/api/grid/emd?${p}`;
  if (!EMDC.has(u)) { if (EMDC.size > 120) EMDC.delete(EMDC.keys().next().value); EMDC.set(u, getJson(u).catch(e => { EMDC.delete(u); throw e; })); }
  return EMDC.get(u);
}
async function accMoment() {
  // 층을 막 바꿨으면 CUR 는 아직 앞 층 것이다(자료 B · 층 단추 → 카드가 먼저 불린다). 그 시각으로 묻지 않는다 —
  // 새 프레임이 오면 show() 가 refreshMoment 로 다시 채운다. ⚠️ 1시간 격자 01:20 으로 AWS 1시간을 물어 404 였다
  const key = layerKey(), fresh = CUR?.key === key, tm = fresh ? CUR.tm || null : null, aws = kind === "aws60", fac = factor();
  const title = { obs15: "15분 강수량", obs60: "1시간 강수량", aws60: "AWS 1시간 강수량", odam: "실황 1시간(5km)",
                  vsrt: `초단기 +${vsrtN}시간` }[kind] || labelOf(kind);
  const bt = !tm ? "—" : kind === "vsrt" ? `${hm(CUR.tmfc)} 발표 → ${+tm.slice(8, 10)}시` : `${hm(tm)} ${isPast() ? "지난 시각" : "실측"}`;
  let cand = [];
  if (aws) {
    const st = tm ? await stnFetch("aws60", tm) : { rows: [] };
    if (st.err) throw new Error(st.err);
    cand = (st.rows || []).filter(r => (r.q === "ok" || r.q === "part") && r.v != null)
      .map(r => ({ sig: r.sigun, stn: r.name, v: r.v, org: r.org || "kma", pos: { x: r.x, y: r.y } }));
  } else if (!selOn() && accPer() === 1 && fresh && CURSTAT) {
    cand = CURSTAT.rows.filter(r => r.kind === "gn" && r.max != null)
      .map(r => ({ sig: r.sigun, stn: r.where?.emd || "—", v: r.max, pos: r.where ? { x: r.where.col, y: r.where.row } : null }));
  } else if (tm) {
    const j = await emdAt(key, tm, selOn() ? selQ() : ALLSIG);
    cand = (j.rows || []).filter(r => r.max != null)
      .map(r => ({ sig: r.sig, stn: r.name, v: r.max, pos: r.col != null ? { x: r.col, y: r.row } : null }));
  }
  if (selOn()) cand = cand.filter(c => isSel(c.sig));
  // 선 그래프 — 재생 흐름(지도와 같은 자료)의 그 시군 최대. 15분 · 실황은 흐름 밖이라 한 점(막대만)
  const spark = FLOWK.has(kind) && !!FLOW?.series?.length;
  const obsI = [], fcI = [];
  if (spark) FLOW.frames.forEach((f, i) => (f.kind === "obs" ? obsI : fcI).push(i));
  const ser = Object.fromEntries((FLOW?.series || []).map(x => [x.sigun, x]));
  const t1 = tm ? tOf(tm) : NOWD().getTime();
  const mk = c => {
    const s = spark ? ser[c.sig] : null;
    return { sig: c.sig, tag: selOn() ? (multi() ? c.sig : "") : c.sig, stn: c.stn,
             d: s ? obsI.map(i => s.max[i]) : [c.v], dt: s ? obsI.map(i => FLOW.tt[i]) : [t1],
             fcd: s ? fcI.map(i => s.max[i] ?? 0) : [], ft: s ? fcI.map(i => FLOW.tt[i]) : [],
             sum: Math.round(c.v * fac * 10) / 10, fc: 0, org: c.org, pos: c.pos, det: selOn() };
  };
  const rows = selOn() ? cand.map(mk) : perSigun(cand.map(mk), r => r.sum);
  const what = aws ? "지점" : "읍면동";
  return { moment: true, stale: !fresh, title, rows, basis: aws ? "aws" : "grid", fell: false, ft: [], H: 1, spark, bt,
    per: selOn() ? 1 : accPer(), sel: selOn() ? selName() : null,
    src: test ? "테스트" : aws ? `AWS ${cand.length}곳` : (kind === "odam" || kind === "vsrt") ? "5km" : "격자 500m",
    sub: `${selOn() ? `${selName()} ${what} 전부` : accPer() === 1 ? `시군 최대 ${what}` : `${what} ${perLabel()}`} · 지도와 같은 시각${fac === 4 ? " · ×4 환산" : ""}` };
}
let MOM_SEQ = 0;
/* 지도 프레임이 바뀌면(재생 · 끌기 · 새 자료) 위 카드도 그 시각으로 — 나머지 카드는 그대로 */
async function refreshMoment() {
  if (!momentK() || !tlOn || SET.panel === "timeline" || !CARDS || CARDS.err) return;
  const my = ++MOM_SEQ;
  let a;
  try { a = await accMoment(); }
  catch (e) { a = { moment: true, title: labelOf(kind), rows: [], bt: "—", basis: ACC_BASIS, note: e.message }; }
  if (my !== MOM_SEQ || !momentK() || !CARDS || CARDS.err) return;
  CARDS.acc = a;
  renderAcc(); drawRanks(); cardsPlayhead();
}

async function cardsFromTest() {
  if (!FLOW) return null;
  const obsI = [], fcI = [];
  FLOW.frames.forEach((f, i) => {
    if (f.kind === "obs" && f.t.endsWith("00")) obsI.push(i);
    if (f.kind === "fcst") fcI.push(i);
  });
  const lastObs = FLOW.frames.reduce((a, f, i) => (f.kind === "obs" ? i : a), -1);
  const dt = obsI.map(i => FLOW.tt[i]), ft = fcI.map(i => FLOW.tt[i]);
  const rows = FLOW.series.map(s => {
    const d = obsI.map(i => s.max[i]), fcd = fcI.map(i => s.max[i] ?? 0);
    return { sig: s.sigun, stn: "격자", d, dt, fcd, ft, sum: Math.round(sumv(d) * 10) / 10, fc: fcSum(fcd) };
  });
  let s15 = null;
  try { s15 = await getJson("/api/grid/sigun?layer=obs15&test=1"); } catch {}
  const top = (arr) => arr.sort((a, b) => b.mm - a.mm).slice(0, 6);
  const r60 = top(FLOW.series.map(s => ({ sig: s.sigun, name: "격자", mm: lastObs >= 0 ? (s.max[lastObs] ?? 0) : 0 })));
  const r15 = s15 ? top(s15.rows.filter(r => r.kind === "gn").map(r => ({ sig: r.sigun, name: r.where?.emd || "격자", mm: r.max ?? 0 }))) : [];
  // 예측(합성 초단기)을 실황 /api/forecast 와 같은 모양으로 — 누적 카드에도 연한 예상 막대가 붙는다
  const fcT = { labels: fcI.map(i => FLOW.frames[i].t.slice(8, 10)),
                sigun: FLOW.series.map(s => ({ sigun: s.sigun, emd: "", d: fcI.map(i => s.max[i] ?? 0) })) };
  let nowE = null;
  // 시군당 2·3곳 · 시군 무관 누적이면 경남 읍면동 예상도 다 읽는다(실황 cardsFromApi 와 같다 — 줄마다 그 읍면동 예상)
  const emdSig = selOn() ? selQ() : accPer() !== 1 && !momentK() && !isDay() ? ALLSIG : null;
  if (emdSig) {
    // 고른 시군 읍면동 — 합성 격자(15분·60분 최신, 초단기 +1~+6)를 읍면동마다 최대로 읽는다
    const q = l => getJson(`/api/grid/emd?sigun=${encodeURIComponent(emdSig)}&layer=${l}&test=1`);
    const [nw, ...fcs] = await Promise.all([selOn() ? nowEmd() : null, ...fcI.map(i => q(`vsrt+${FLOW.frames[i].n}`))]);
    nowE = nw;
    fcT.emd_sigun = (fcs[0]?.rows || []).map((r, j) => ({ sigun: r.sig, emd: r.name, d: fcs.map(f => f.rows[j]?.max ?? 0) }));
  }
  // 누적은 실제와 같은 길로 — AWS 면 합성 지점(기상청 자리 + 스방 흉내, /api/grid/testrain), 격자면 합성 격자 누적.
  // 테스트에서 시군을 누르면 내부망(스방)에서 보일 목록 모양을 미리 본다
  let acc = { rows, H: dt.length, src: "테스트", fell: false, basis: ACC_BASIS, bt: lastObs >= 0 ? `${hm(FLOW.frames[lastObs].t)} 실측` : "—" };
  try {
    acc = isDay() ? await accDay() : momentK() ? await accMoment()
      : ACC_BASIS === "grid" ? await accGrid(accSpan().H, fcT) : await accAws(accSpan().H, fcT);
  } catch (e) { acc.note = e.message; }
  const day = isDay() ? await fcDay() : null;
  if (selOn()) {
    const rowsE = fcT.emd_sigun.map(e => ({ sig: e.sigun, label: e.emd, tag: multi() ? e.sigun : "", d: e.d, sum: sumv(e.d) }));
    return { acc, now: nowE, fc: day || { det: true, rows: rowsE, labels: ft.map(fmtH), ft, bt: FLOW.tmfc ? `${hm(FLOW.tmfc)} 발표` : "—" } };
  }
  return {
    acc,
    now: { r15, r60, tm: lastObs >= 0 ? hm(FLOW.frames[lastObs].t) : "—" },
    fc: day || { rows: FLOW.series.map(s => { const d = fcI.map(i => s.max[i] ?? 0); return { sig: s.sigun, emd: "", d, sum: sumv(d) }; }),
          labels: ft.map(fmtH), ft, bt: FLOW.tmfc ? `${hm(FLOW.tmfc)} 발표` : "—" },
  };
}

let CARD_SEQ = 0;
async function loadCards() {
  if (!tlOn || SET.panel === "timeline") return;
  const my = ++CARD_SEQ;
  let c;
  try { c = CASE ? (CASEM ? await cardsFromCase() : null) : test ? await cardsFromTest() : await cardsFromApi(); }
  catch (e) { c = { err: e.message }; }
  if (my !== CARD_SEQ) return;
  CARDS = c;
  renderCards();
  if (c?.acc?.stale) refreshMoment();       // 앞 층 프레임으로 짠 '그 시각' 카드 — show() 보다 늦게 왔으면 여기서 채운다
}

function rowEvents(el) {
  for (const r of el.querySelectorAll("[data-s]")) {
    const pt = r.dataset.x ? { x: +r.dataset.x, y: +r.dataset.y } : null;
    r.onmouseenter = () => { highlight(r.dataset.s); link(r, r.dataset.s, pt); hot(pt); };
    r.onmouseleave = () => { highlight(null); link(null); hot(null); };
    // 시군 줄을 누르면 그 시군을 고른다(오른쪽 패널이 그 시군 읍면동·지점으로 바뀐다). Ctrl 이면 더한다
    r.onclick = r.classList.contains("det") ? null : ev => pickSig(r.dataset.s, ev.ctrlKey || ev.metaKey);
  }
}

function renderCards() {
  if (!CARDS || !V) return;
  if (CARDS.err) {
    $("acc-b").innerHTML = `<div class="empty-note">불러오지 못했다 — ${CARDS.err}</div>`;
    renderSw();
    return;
  }
  $("fc-h").textContent = CASE ? "호우 기준" : CARDS.fc?.title || "예측 상위";
  $("fc-sub").textContent = CASE ? (selOn() ? `산출 — ${selName()}` : "산출 — 격자 3시간·12시간 합")
    : CARDS.fc?.sub || (CARDS.fc?.det ? `${selName()} 읍면동 · 초단기 6시간` : "초단기 · 앞으로 6시간");
  $("now-sub").textContent = CARDS.now.sub || "기상청 매분자료";
  // 누적 카드는 남는 높이를 다 쓴다 — 다른 둘을 먼저 채운 뒤에 재야 줄 수가 맞는다
  renderNow(); CASE ? renderCrit() : renderFc(); renderAcc();
  drawRanks();
  renderSw();
  cardsPlayhead();
}

/* 강수 누적 — 종합 화면 '강수 타임라인'을 한 줄짜리로 */
function renderAcc() {
  const A = CARDS.acc, k = V.k, body = $("acc-b");
  for (const b of $("acc-h").querySelectorAll(".bs b")) b.classList.toggle("on", b.dataset.b === (A.basis || ACC_BASIS));
  $("acc-sel").hidden = !A.sel;
  $("acc-sel").textContent = A.sel ? `${A.sel} ✕` : "";
  const fcOn = fcShown() && !A.day && !A.moment;
  $("acc-t").textContent = A.title || "강수 누적";
  $("acc-h").classList.toggle("day", !!A.day);
  $("acc-h").title = A.day ? "지도 단기 층의 그날 예보 합 — 실측 층을 고르면 강수 누적으로 돌아간다"
    : A.moment ? "지도와 같은 층 · 같은 시각 — 눌러서 자료 바꾸기(AWS 관측소 ↔ 격자, 지도도 같이). 누적 층을 고르면 강수 누적으로"
    : "눌러서 기준 바꾸기 — AWS 관측소 ↔ 격자(500m)";
  $("acc-fc").hidden = !!CASE || !!A.day || !!A.moment;   // 사례에는 예상이 없다 · 단기는 전부 예보다 · '그 시각'은 한 장이다
  const h1On = h1Shown() && !A.day && !A.moment;
  $("acc-h1").hidden = !!A.day || !!A.moment;
  $("acc-h1").classList.toggle("on", h1On); $("acc-h1").setAttribute("aria-pressed", h1On);
  $("acc-fc").classList.toggle("on", fcOn); $("acc-fc").setAttribute("aria-pressed", fcOn);
  const sub = A.sub || `다우지점 · ${accSpan().label} + 예상 6시간`;
  // 설명을 누르면 누적 구간을 고른다(실황·테스트의 강수 누적만 — 단기·사례는 구간이 정해져 있다)
  $("acc-sub").classList.toggle("pick", !CASE && !A.day && !A.moment);
  $("acc-sub").textContent = fcOn ? sub : sub.replace(" + 예상 6시간", "");
  $("acc-src").textContent = A.src; $("acc-src").classList.toggle("fell", !!A.fell);
  $("acc-bt").textContent = A.bt;
  const val = r => r.sum + r.fc;
  // 예상을 끄면 예상 몫을 뺀다 — 단, '그 시각' 카드의 선 그래프 예측(초단기) 구간은 흐름 그대로 둔다
  const rows = A.rows.map(r => (fcOn || A.moment ? r : { ...r, fc: 0, fcd: [], ft: [] }));
  if (A.per > 1 && !A.sel) {
    // 시군당 n곳 — 시군끼리 묶는다(가장 많은 곳이 큰 시군부터, 시군 안은 큰 순)
    const best = {};
    for (const r of rows) best[r.sig] = Math.max(best[r.sig] ?? -Infinity, val(r));
    rows.sort((a, b) => a.sig === b.sig ? val(b) - val(a)
      : (best[b.sig] - best[a.sig]) || ORDER_GN().indexOf(a.sig) - ORDER_GN().indexOf(b.sig));
  } else rows.sort((a, b) => val(b) - val(a));
  if (!rows.length || !rows[0].dt.length) {
    body.innerHTML = (A.day && A.note ? "" : `<div class="empty-note">${A.sel ? `${A.sel} — ${A.basis === "grid" ? "읍면동" : "지점"} 자료가 없다` : "강수 자료가 아직 없다"}</div>`)
      + (A.note ? `<div class="case-note">${A.note}</div>` : "");
    A.sp = null; return;
  }
  const bh = body.clientHeight - 10 * k - (A.note ? 40 * k : 0) - 22 * k;     // 22 = 맨 아래 막대 범례
  const rh = Math.max(26 * k, Math.min(44 * k, bh / Math.max(1, rows.length)));   // 카드를 꽉 채운다
  // 시군을 골랐으면 줄을 다 그리고 카드 안에서 굴린다 — 내부망(스방)이면 한 시군에 수십 곳이다
  const n = A.sel ? rows.length : Math.max(1, Math.min(rows.length, Math.floor(bh / rh)));
  body.classList.toggle("scroll", !!A.sel);
  body.style.setProperty("--rh", rh + "px");
  const bmax = Math.max(1, ...rows.map(r => r.sum + r.fc));
  let smax = 5;
  for (const r of rows) for (const v of [...r.d, ...r.fcd]) if (typeof v === "number" && v > smax) smax = v;
  // 축 끝은 줄들 가운데 예상이 가장 멀리 간 데까지(예상이 없는 줄이 맨 위여도 다른 줄이 밖으로 새지 않게)
  const t0 = Math.min(...rows[0].dt) - 1800e3, t1 = Math.max(rows[0].dt.at(-1), ...rows.flatMap(r => r.ft));
  const SW = 150 * k, SH = rh * 0.82;
  const sx = t => (t - t0) / Math.max(1, t1 - t0) * SW, sy = v => SH - Math.min(v, smax) / smax * (SH - 3);
  // tn = 실측이 끝나는 '지금'. 단기는 전부 예보라 처음부터(마우스를 올리면 그 6시간 칸을 짚는다)
  A.sp = { t0, t1, SW, tn: A.day ? -Infinity : rows[0].dt.at(-1) };
  const sline = (ts, vs, from) => {
    let pts = ts.map((t, i) => [t, vs[i]]).filter(([, v]) => typeof v === "number");
    if (from) pts = [from, ...pts];
    if (!pts.length) return { d: "", a: "" };
    const p = pts.map(([t, v]) => `${sx(t).toFixed(1)},${sy(v).toFixed(1)}`);
    return { d: "M" + p.join("L"), a: `M${sx(pts[0][0]).toFixed(1)},${SH}L${p.join("L")}L${sx(pts.at(-1)[0]).toFixed(1)},${SH}Z` };
  };
  const tnow = NOWD().getTime(), xn = A.day ? (tnow > t0 && tnow < t1 ? sx(tnow) : -99) : sx(rows[0].dt.at(-1));
  // 다시 그리기 전 줄 자리 — 예상을 켜고 끄거나(합이 바뀐다) 시각이 바뀌어 순서가 달라지면 새 자리로 미끄러지게
  const before = new Map([...body.querySelectorAll(".ar[data-k]")].map(e => [e.dataset.k, e.getBoundingClientRect().top]));
  const lastNum = d => { for (let j = d.length - 1; j >= 0; j--) if (typeof d[j] === "number") return d[j]; return 0; };
  // 봉우리 — 줄마다 실측 중 가장 많이 온 시각. 보이는 줄 가운데 봉우리가 큰 PEAK_N 줄만 값을 적는다(1㎜ 이상)
  const PEAK_N = 5;
  const peakOf = r => r.d.reduce((a, v, j) => (typeof v === "number" && (!a || v > a[1]) ? [r.dt[j], v] : a), null);
  const peakSet = new Set(rows.slice(0, n).map(r => [r, peakOf(r)]).filter(([, p]) => p && p[1] >= 1)
    .sort((a, b) => b[1][1] - a[1][1]).slice(0, PEAK_N).map(([r]) => r));
  const peakTag = r => {
    if (!peakSet.has(r)) return "";
    const [t, v] = peakOf(r), x = sx(t), y = sy(v), fs = 10.5 * k, right = x > SW * 0.6;
    const ty = Math.max(fs * 0.8, y + fs * 0.35);
    return `<circle class="sp-pd" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2.4 * k).toFixed(1)}"/>`
      + `<text class="sp-pk" x="${(right ? x - 4 * k : x + 4 * k).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${right ? "end" : "start"}">${v.toFixed(v >= 10 ? 0 : 1)}</text>`;
  };
  // 최근 1시간 칩 — 시우량 자(SIU)로 칠한다. 막대 빗금과 같은 단추(H)로 켜고 끈다
  body.classList.toggle("h1c", h1On);
  // 막대 색 — 색조(SET.acc_tone)면 값마다 메인 지도 범례의 그 범주 색. 지도가 누적이면 그 자(자동 눈금 · 고정 눈금 · 다양한 색조 그대로),
  // '그 시각' · 단기 카드면 그 층의 자. 막대를 누르면 한 색 ↔ 색조
  const tone = !!SET.acc_tone, tk = A.day || A.moment || ACCK.has(kind) ? kind : ACC_BASIS === "grid" ? "acc" : "aws";
  const tSteps = stepsOf(tk), tHr = HOURLY.has(tk);
  const tcol = v => { const x = v * (tk === kind ? factor() : 1); return (x >= tSteps[0] && rampColor(x, tSteps, tHr)) || ""; };
  body.classList.toggle("tone", tone);
  const h1Chip = (r, v) => {
    if (r.dead) return `<span class="h1v z" title="결측">—</span>`;
    const c = v >= 0.1 ? rampColor(v, SIU, true) : null;
    if (!c) return `<span class="h1v z" title="최근 1시간 0㎜"><small>1h</small>0</span>`;
    const lv = v >= 20 ? 3 : v >= 10 ? 2 : v >= 5 ? 1 : 0;
    return `<span class="h1v l${lv}" style="--c:${c}" title="최근 1시간 ${v.toFixed(1)}㎜ — 왼쪽 막대는 시우량 색(지도 1시간 · 지금 오는 비와 같은 자), 많을수록 글자가 밝고 굵다"><small>1h</small>${v.toFixed(v >= 10 ? 0 : 1)}</span>`;
  };
  body.innerHTML = rows.slice(0, n).map((r, i) => {
    const tot = r.sum + r.fc, o = r.sum / bmax * 100, f = r.fc / bmax * 100;
    // 실측 중 최근 1시간 — 실측 막대 안의 끝 몫(합을 넘지 않게)
    const h1raw = Math.max(0, typeof r.h1 === "number" ? r.h1 : lastNum(r.d));
    const h1 = !h1On ? 0 : Math.min(r.sum, h1raw), hw = h1 / bmax * 100;
    const inside = o + f > 62;
    const vpos = inside ? `right:calc(${(100 - o - f).toFixed(1)}% + 6px)` : `left:calc(${(o + f).toFixed(1)}% + 6px)`;
    const lastObs = r.d.reduce((a, v, j) => (typeof v === "number" ? [r.dt[j], v] : a), null);
    const po = sline(r.dt, r.d), pf = sline(r.ft, r.fcd, lastObs);
    const rank = i < 3 && tot >= 0.1 ? `<span class="rk">${i + 1}</span>` : "";
    const ge = r.part ? ` title="일부 시각이 빠진 합 — 실제는 이보다 클 수 있다"` : "";
    const at = r.pos ? ` data-x="${r.pos.x}" data-y="${r.pos.y}"` : "";
    const g0 = A.per > 1 && !A.sel && i > 0 && rows[i - 1].sig !== r.sig;
    return `<div class="ar${r.det ? " det" : ""}${g0 ? " g0" : ""}${A.basis === "aws" && r.org === "kma" ? " kma" : ""}" data-s="${r.sig}" data-k="${r.sig}|${r.stn}"${at} title="${r.det ? "" : `${r.sig} — 눌러서 이 시군 ${A.basis === "grid" ? "읍면동" : "지점"} 보기`}">
      <div class="nm2">${rank}<small>${r.tag ?? r.sig}</small>${r.stn}</div>
      <div class="abar" title="막대를 누르면 색 — ${tone ? "한 색으로" : "지도 범례 색조로(값마다 그 범주 색)"}"${tone && tcol(r.sum) ? ` style="--tc:${tcol(r.sum)}"` : ""}><div class="o${A.day ? " dayb" : hw >= o - 0.05 && !r.fc ? " all" : ""}" style="width:${o.toFixed(1)}%"></div>
        ${h1 >= 0.1 ? `<div class="h${r.fc ? "" : " end"}${hw >= o - 0.05 ? " all" : ""}" style="left:${(o - hw).toFixed(1)}%;width:${hw.toFixed(1)}%" title="그중 최근 1시간 ${h1.toFixed(1)}㎜"></div>` : ""}
        ${r.fc ? `<div class="f" style="left:${o.toFixed(1)}%;width:${f.toFixed(1)}%"></div>` : ""}
        <span class="v${r.dead ? " dead" : ""}" style="${vpos}"${ge}>${r.dead ? "결측" : r.sum.toFixed(1)}${r.fc ? `<i>+${fcTxt(r.fc)}</i>` : ""}</span></div>
      <svg viewBox="0 0 ${SW.toFixed(0)} ${SH.toFixed(0)}" preserveAspectRatio="none">
        <path class="sp-a" d="${po.a}"/><path class="sp-l" d="${po.d}"/>
        <path class="sp-fa" d="${pf.a}"/><path class="sp-fl" d="${pf.d}"/>
        <line class="sp-now" x1="${xn}" x2="${xn}" y1="0" y2="${SH}"/>
        <line class="sp-head" x1="0" x2="0" y1="-2" y2="${SH + 2}" style="transform:translateX(-99px);visibility:hidden"/>
        <line class="sp-hov" x1="0" x2="0" y1="-2" y2="${SH + 2}" style="transform:translateX(-99px)"/>${peakTag(r)}</svg>${h1On ? h1Chip(r, h1raw) : ""}</div>`;
  }).join("") + (n < rows.length ? `<div class="case-note">외 ${rows.length - n}${A.basis === "grid" && A.sel ? "개 읍면동" : "곳"} — 적은 순이라 생략</div>` : "")
    + (A.note ? `<div class="case-note">${A.note}</div>` : "")
    + (A.moment ? `<div class="acc-lg">${A.basis === "aws"
          ? (rows.some(r => r.org !== "kma") ? `<span><i class="p"></i>경남 AWS</span>` : "") + (rows.some(r => r.org === "kma") ? `<span><i class="pk"></i>기상청 AWS</span>` : "")
          : `<span><i class="p"></i>격자 최대 칸</span>`}${A.spark ? `<span>선 그래프: 그 시군 최대 · 세로선 = 지도 재생 위치</span>` : ""}</div>`
      : A.day ? `<div class="acc-lg"><span><i class="d"></i>그날 예보 합(단기 PCP 매시 합 · 읍면동 최대)</span><span>선 그래프: 매시 값</span></div>`
      : `<div class="acc-lg">${A.basis === "aws"
          ? (rows.some(r => r.org !== "kma") ? `<span><i class="p"></i>경남 AWS</span>` : "") + (rows.some(r => r.org === "kma") ? `<span><i class="pk"></i>기상청 AWS</span>` : "")
          : `<span><i class="p"></i>실측</span>`}${tone ? `<span title="막대를 누르면 한 색으로"><i class="tn" style="background:linear-gradient(90deg, ${tSteps.map(v => rampColor(v, tSteps, tHr) || "transparent").join(", ")})"></i>지도 범례 색</span>` : ""}${h1On ? `<span><i class="h"></i>그중 최근 1시간</span><span><i class="c1"></i>1h · 많을수록 밝게</span>` : ""}${fcOn && rows.some(r => r.fc) ? `<span><i class="f"></i>앞으로 6시간</span>` : ""}</div>`);
  rowEvents(body);
  hovEvents(body);
  for (const b of body.querySelectorAll(".abar")) b.onclick = ev => {     // 막대 = 색 바꾸기(줄의 나머지는 그대로 시군 고르기)
    ev.stopPropagation();
    SET.acc_tone = !SET.acc_tone; saveSetting({ acc_tone: SET.acc_tone });
    renderAcc();
  };
  slideRows(body, before);
}
/* 줄 순서가 바뀌면 옛 자리에서 새 자리로 미끄러진다(FLIP). 새로 들어온 줄은 서서히 */
function slideRows(body, before) {
  if (!before.size || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const moved = [];
  for (const e of body.querySelectorAll(".ar[data-k]")) {
    const y0 = before.get(e.dataset.k), y1 = e.getBoundingClientRect().top;
    if (y0 == null) { e.style.opacity = "0"; moved.push(e); continue; }
    if (Math.abs(y0 - y1) < 1) continue;
    e.style.transform = `translateY(${(y0 - y1).toFixed(1)}px)`;
    moved.push(e);
  }
  if (!moved.length) return;
  void body.offsetHeight;                          // 옛 자리를 한 번 굳힌 뒤 풀어야 움직인다
  for (const e of moved) {
    e.style.transition = "transform .5s var(--ease), opacity .35s";
    e.style.transform = ""; e.style.opacity = "";
    setTimeout(() => { e.style.transition = ""; }, 600);
  }
}
/* 예상(앞으로 6시간)을 누적 카드에 보이나 — 서버 설정 acc_fc(기본 켬). 사례는 예상이 없다 */
const fcShown = () => !CASE && SET.acc_fc !== false;
const h1Shown = () => SET.acc_h1 !== false;
function toggleAccH1() {
  SET.acc_h1 = !h1Shown();
  saveSetting({ acc_h1: SET.acc_h1 });
  if (CARDS && !CARDS.err && CARDS.acc) renderAcc();
}
function toggleAccFc() {
  if (CASE) return;
  SET.acc_fc = !fcShown();
  saveSetting({ acc_fc: SET.acc_fc });
  if (CARDS && !CARDS.err && CARDS.acc) { renderAcc(); drawRanks(); cardsPlayhead(); }
}
/* 누적 줄 선 그래프 위를 지나가면 — 모든 줄에 그 시각 선, 예상 구간이면 예측 상위의 그 시각 열을 짚는다 */
let HOVT = null;
function hovEvents(body) {
  body.onmousemove = ev => {
    const sp = CARDS?.acc?.sp, svg = body.querySelector(".ar svg");
    if (!sp || !svg) return;
    const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
    const t = x >= 0 && x <= r.width ? sp.t0 + x / r.width * (sp.t1 - sp.t0) : null;
    if (t === HOVT) return;
    HOVT = t;
    body.classList.toggle("hovt", t != null);
    const px = t == null ? -99 : (t - sp.t0) / (sp.t1 - sp.t0) * sp.SW;
    for (const l of body.querySelectorAll(".sp-hov")) l.style.transform = `translateX(${px.toFixed(1)}px)`;
    cardsPlayhead();
  };
  body.onmouseleave = () => { HOVT = null; body.classList.remove("hovt"); cardsPlayhead(); };
}

/* 시우량 범주(㎜/h) — 지금 오는 비 · 예측 상위(초단기) · 지도 1시간 층이 **한 자**를 쓴다(종합 화면 시우량 램프와 같다).
   누적(지도 누적 층 — 자동 눈금)과는 다른 자다 — 카드 머리에 작은 범례로 따로 적는다.
   15분 값은 ×4(시간당 기세)로 이 자에 칠한다 — 15분 8㎜ 는 시간당 32㎜ 의 기세다.
   ⚠️ 예전에는 지금 오는 비가 1·5·10·20·30·50·70, 15분은 0.5·2·5·8·12·18·25 로 따로 칠해 같은 10㎜ 가 지도 · 예측 상위와 다른 색이었다 */
const SIU = STEPS.m60;
/* 카드 머리 작은 범례 — 그 자의 칸마다 색과 값. 기상청 색이면 시우량은 레이더 경계 색 */
function miniLegend(steps, label, hourly = true, tip = "") {
  return `<span class="mlg" title="${tip}"><b>${label}</b>${steps.map((v, i) => {
    const c = rampColor(v, steps, hourly), ink = kmaOn() ? inkOn(c) : inkBlue(i + 1);
    return `<i style="background:${c};color:${ink}">${v}</i>`;
  }).join("")}</span>`;
}
/* 지금 오는 비 · 예측 상위 줄 수 — 패널이 낮으면(FHD 150% = 720px 등) 줄여서 강수 누적 카드에 자리를 남긴다.
   ⚠️ 1280×720 에서 둘이 6줄씩 다 쓰자 강수 누적은 머리만 남았다(본문 11px) */
const cardRows = () => { const h = $("rail")?.clientHeight || 900; return h < 560 ? 3 : h < 800 ? 4 : 6; };
const NOW_T = { bt: "now-bt", lg: "now-lg", b: "now-b" }, FC_T = { bt: "fc-bt", lg: "fc-lg", b: "fc-b" };
const SW_T = { bt: "sw-bt", lg: "sw-lg", b: "sw-b" };     // 바다 위젯 — 같은 그림을 그 판에
function renderNow(t = NOW_T, nRows = cardRows()) {
  const N = CARDS.now;
  $(t.bt).textContent = N.tm || "—";
  const col = (list, kk, steps = SIU) => {
    const mx = Math.max(...list.map(x => x.mm), 0.1);
    if (!list.length || mx <= 0.1 && !list.some(x => x.mm > 0))
      return `<div class="empty-note">비 없음</div>`;
    return list.slice(0, nRows).map(x => {
      // 시우량 자 — 15분은 ×4 로. 사례의 '3시간'은 누적 자(steps 를 따로 준다)
      const c = rampColor(kk === 15 ? x.mm * 4 : x.mm, steps, steps === SIU) || "var(--ink-3)";
      const sm = N.det ? x.tag : x.sig, at = x.pos ? ` data-x="${x.pos.x}" data-y="${x.pos.y}"` : "";
      return `<div class="mr${N.det ? " det" : ""}" data-s="${x.sig}"${at}><span class="bg" style="width:${(x.mm / mx * 100).toFixed(0)}%;background:${c}"></span>
        <span class="nm2">${x.name && x.name !== x.sig ? `${sm ? `<small>${sm}</small>` : ""}${x.name}` : x.sig}</span><b>${x.mm.toFixed(1)}</b></div>`;
    }).join("");
  };
  const colSteps = (list, steps) => col(list, "x", steps);   // 사례 · 시군: 1시간 · 3시간(자를 직접 준다)
  $(t.lg).innerHTML = miniLegend(SIU, "시우량", true, "시우량 범주(㎜/h) — 지도 1시간 · 예측 상위와 같은 자. 15분은 ×4(시간당 기세)로 칠한다. 지도 누적 층의 자와는 다르다");
  $(t.b).innerHTML = N.cols
    ? `<div class="mn">${N.cols.map(c => `<div><h4>${c.title}<span>㎜</span></h4>${colSteps(c.list, c.steps)}</div>`).join("")}</div>`
    : `<div class="mn"><div><h4>15분<span>㎜</span></h4>${col(N.r15, 15)}</div>
    <div><h4>60분<span>㎜</span></h4>${col(N.r60, 60)}</div></div>`;
  rowEvents($(t.b));
}

/* 예측 상위 — 6시간 합 순. 칸은 지도와 같은 색 단계 */
function renderFc(t = FC_T, nRows = cardRows(), rowsIn = null) {
  const F = CARDS.fc;
  $(t.bt).textContent = F.bt;
  const rows = (rowsIn || F.rows).slice().sort((a, b) => b.sum - a.sum).slice(0, nRows);
  const day = F.mode === "day";
  if (!rows.length || rows[0].sum <= 0) {
    $(t.lg).innerHTML = "";
    $(t.b).innerHTML = `<div class="empty-note">${F.empty || "앞으로 6시간 예상 강수 없음"}</div>`;
    return;
  }
  // 칸 색 — 초단기는 시우량(1시간) 자, 단기는 6시간 합이라 하루 눈금(지도 단기 층과 같은 자)
  const steps = day ? STEPS.day : SIU;
  $(t.lg).innerHTML = day ? miniLegend(steps, "6시간 합", false, "단기 6시간 합(㎜) — 지도 단기 층과 같은 자")
    : miniLegend(steps, "시우량", true, "시우량 범주(㎜/h) — 칸은 그 시간 강수량(초단기 RN1). 지도 누적 층의 자와는 다르다");
  const cell = v => {
    if (v == null) return `<i class="na"></i>`;           // 오늘의 지난 구간(발표 앞)
    const k = stepIdx(v, steps), c = rampColor(v, steps, !day);
    const txt = v >= 1 ? (Number.isInteger(v) ? v : v.toFixed(1)) : "";
    const ink = !c ? "" : kmaOn() ? inkOn(c) : inkBlue(k);
    return `<i style="${c ? `background:${c};color:${ink}` : ""}">${txt}</i>`;
  };
  $(t.b).style.setProperty("--n", F.labels.length || 6);
  $(t.b).innerHTML = `<div class="fh"><span>${day && !F.det ? "읍면동" : "시군"}</span><div class="cells">${F.labels.map(l => `<span>${l}</span>`).join("")}</div><span style="text-align:right">합</span></div>`
    + rows.map(r => `<div class="fr${F.det ? " det" : ""}" data-s="${r.sig}"${r.pos ? ` data-x="${r.pos.x}" data-y="${r.pos.y}"` : ""}><span class="nm2">${r.label ? `${r.tag ? `<small class="pre">${r.tag}</small>` : ""}${r.label}` : `${r.sig}<small>${r.emd || ""}</small>`}</span>
      <div class="cells">${r.d.map(cell).join("")}</div><span class="sum">${(+r.sum).toFixed(r.sum % 1 ? 1 : 0)}</span></div>`).join("");
  rowEvents($(t.b));
}

/* 카드 안의 재생 위치 — 누적 줄 선 그래프의 세로선, 예측 칸의 테두리 */
function cardsPlayhead() {
  if (!CARDS || CARDS.err || !tlOn || SET.panel === "timeline") return;
  const ht = headT(), sp = CARDS.acc?.sp;
  for (const l of document.querySelectorAll(".sp-head")) {
    const x = ht != null && sp && ht >= sp.t0 && ht <= sp.t1 ? (ht - sp.t0) / (sp.t1 - sp.t0) * sp.SW : -99;
    l.style.transform = `translateX(${x.toFixed(1)}px)`;
    // ⚠️ 범위 밖이면 감춘다 — svg 가 overflow visible 이라 -99px 에 두면 막대 칸에 세로줄로 보였다
    l.style.visibility = x < 0 ? "hidden" : "";
  }
  // 예측 상위의 그 시각 열 — 누적 줄 선 그래프의 예상 구간에 마우스가 있으면 그 시각, 아니면 재생 위치가
  // 예측(초단기)일 때 그 시각. 실측 구간이면 짚지 않는다
  let j = -1;
  const fts = CARDS.fc?.ft || [];
  const near = t => { let bd = Infinity, k = -1; fts.forEach((x, i) => { const d = Math.abs(x - t); if (d < bd) { bd = d; k = i; } }); return k; };
  if (HOVT != null && CARDS.fc?.mode === "day") {
    const h = new Date(HOVT - 1).getHours();       // 끝 시각 기준 — 18:00 은 12~18시 칸
    j = Math.min(3, Math.floor(h / 6));
  } else if (HOVT != null) { if (sp && HOVT > sp.tn && fts.length) j = near(HOVT); }
  else if (kind === "vsrt" && ht != null && fts.length) j = near(ht);
  for (const r of document.querySelectorAll("#fc-b .fr, #fc-b .fh, #sw-b .fr, #sw-b .fh")) {
    const cs = r.querySelector(".cells");
    cs?.classList.toggle("has-on", j >= 0);
    r.querySelectorAll(".cells > *").forEach((c, i) => c.classList.toggle("on", i === j));
  }
}

/* 지도 위 순위 표식 — 누적 상위 셋. 시군 줄이면 시군명 왼쪽, 시군을 골랐으면 그 지점·칸 자리에 */
function drawRanks() {
  const g = $("ranks");
  if (!g) return;
  if (!tlOn || SET.panel === "timeline" || !CARDS || CARDS.err || !CARDS.acc || !V) { g.innerHTML = ""; return; }
  const det = !!CARDS.acc.sel;
  const tot = r => r.sum + (fcShown() ? r.fc : 0);
  const seen = new Set();                 // 시군당 n · 시군 무관이면 한 시군이 여러 줄 — 시군 이름 옆 원은 시군마다 한 번
  const rows = CARDS.acc.rows.slice().sort((a, b) => tot(b) - tot(a))
    .filter(r => tot(r) >= 0.1 && (det || (!seen.has(r.sig) && seen.add(r.sig)))).slice(0, 3);
  const r0 = FSN * 0.46;
  g.innerHTML = rows.map((r, i) => {
    let x, y;
    if (det) {
      if (!r.pos) return "";
      x = V.toX(r.pos.x) + r0 * 1.15; y = V.toY(r.pos.y) - r0 * 1.15;
    } else {
      const ft = FEAT.find(f => f.properties.sigun === r.sig);
      if (!ft) return "";
      x = V.toX(ft.properties.lx) - r.sig.length * FSN * 0.52 - r0 - 4; y = V.toY(ft.properties.ly);
    }
    return `<g class="rk"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r0.toFixed(1)}"/>
      <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${(FSN * 0.56).toFixed(1)}px">${i + 1}</text></g>`;
  }).join("");
}

/* 줄 ↔ 지도 연결선 — 카드 줄 왼쪽 끝에서 지도 위 그 시군 이름 오른쪽까지, 그어지듯.
   pt(칸 좌표)를 주면 그 자리(지점·누적 최대 칸)까지 긋는다. */
function link(el, sig, pt) {
  const svg = $("links");
  if (!el || !sig || !V) { svg.innerHTML = ""; return; }
  const st = $("stage").getBoundingClientRect(), r = el.getBoundingClientRect();
  const x1 = r.left - st.left - 3, y1 = r.top - st.top + r.height / 2;
  let x2, y2;
  if (pt) {
    x2 = V.toX(pt.x) * MT.sc + MT.tx; y2 = V.toY(pt.y) * MT.sc + MT.ty;
  } else {
    const ft = FEAT.find(f => f.properties.sigun === sig);
    if (!ft) { svg.innerHTML = ""; return; }
    const hw = sig.length * FSN * 0.52 * MT.sc;
    x2 = V.toX(ft.properties.lx) * MT.sc + MT.tx + hw + 8; y2 = V.toY(ft.properties.ly) * MT.sc + MT.ty;
  }
  const dx = Math.max(50, (x1 - x2) * 0.45);
  svg.innerHTML = `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} C${(x1 - dx).toFixed(1)},${y1.toFixed(1)} ${(x2 + dx).toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}"/>
    <circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="5"/>`;
  const p = svg.querySelector("path");
  p.style.setProperty("--len", p.getTotalLength().toFixed(0));
}
/* 줄이 가리키는 자리에 고리 — 지점·누적 최대 칸 */
function hot(pt) {
  const g = $("hot");
  if (!g) return;
  if (!pt || !V) { g.innerHTML = ""; return; }
  const x = V.toX(pt.x).toFixed(1), y = V.toY(pt.y).toFixed(1), r = Math.max(9, V.u * 2.4);
  g.innerHTML = `<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}"/><circle class="c" cx="${x}" cy="${y}" r="${Math.max(3, r * 0.28).toFixed(1)}"/>`;
}

/* ── 재현 사례(?case=) ────────────────────────────────────────────────
   지난 호우를 500m 격자 그대로 되돌려 본다(data/demo/map/, tools/build_map_case.py).
   층은 1시간·사례 누적, 재생은 처음부터 끝까지 매시, 카드·특보도 그 시각에 맞춘다.
   ⚠️ 특보는 **산출**이다 — 격자 3시간·12시간 합에 호우 기준. 이력 API 가 403 이라 실제 발표 내역이 없다.
   ⚠️ 격자는 관측소 값을 그대로 지나지 않는다(객관분석). 확인한 관측소 값을 누적 카드 밑에 같이 적는다. */
async function loadCase() {
  CASEM = await getJson(`/api/grid/case/${CASE}`);
  const src = "기상청 고해상도 격자(500m) · 매시 60분 — 재현";
  META.layers = [
    { id: "obs60", label: "1시간 강수량", short: "1시간", grid: "hr", src, tm: CASEM.end },
    { id: "acc", label: "사례 누적", short: "누적", grid: "hr", src: src + " · 칸마다 더함", tm: CASEM.end },
  ];
  META.collect = {};
}
function caseIdx() {
  if (!CASEM) return -1;
  const i = CASEM.frames.indexOf(CUR?.tm || OBS_TM || CASEM.end);
  return i < 0 ? CASEM.frames.length - 1 : i;
}
const CASEACC = new Map();
async function cardsFromCase() {
  const i = caseIdx(), S = CASEM.series, t = CASEM.frames[i];
  const dt = CASEM.frames.map(tOf);
  const when = `${md(t)} ${hm(t)}`;
  const from = `${md(CASEM.start)} ${String(+CASEM.start.slice(8, 10) - 1).padStart(2, "0")}:00부터`;
  let acc;
  if (ACC_BASIS === "aws") acc = caseAccAws(i, dt, from);
  else if (selOn()) acc = await caseAccGrid(i, dt, from);
  else acc = { rows: S.map(s => ({ sig: s.sigun, stn: s.accw[i] || "", d: s.h1, dt, fcd: [], ft: [], sum: s.acc[i] ?? 0, fc: 0, h1: s.h1[i] ?? 0 })),
               sub: `사례 누적 · 격자 시군 최대 칸 · ${from}`,
               note: "관측소(이틀): " + CASEM.checked.map(c => `${c.name} ${c.sum.toFixed(1)}`).join(" · ")
                     + " — 격자는 관측값을 그대로 지나지 않는다('강수 누적'을 누르면 AWS 기준)" };
  const top = (k, w) => S.map(s => ({ sig: s.sigun, name: (w && s[w][i]) || "", mm: s[k][i] ?? 0 }))
    .sort((a, b) => b.mm - a.mm).slice(0, 6);
  const rank = { warn: 2, watch: 1 };
  const crit = S.filter(s => !selOn() || isSel(s.sigun)).map(s => ({ sig: s.sigun, h3: s.h3[i] ?? 0, h12: s.h12[i] ?? 0, lv: s.lv[i] }))
    .sort((a, b) => ((rank[b.lv] || 0) - (rank[a.lv] || 0)) || (b.h12 - a.h12)).slice(0, 6);
  // 시군을 고르면 1시간·3시간도 그 시군(들) 읍면동 — 격자 그 시각 칸을 읍면동마다 최대로
  let now = { tm: when, sub: "격자 · 1시간 · 3시간",
              cols: [{ title: "1시간", list: top("h1", "h1w"), steps: SIU },
                     { title: "3시간", list: top("h3"), steps: [5, 20, 40, 60, 90, 120, 180] }] };
  if (selOn()) {
    const q = h => getJson(`/api/grid/emd?sigun=${encodeURIComponent(selQ())}&case=${CASE}&tm=${t}&hours=${h}`);
    const [a, b] = await Promise.all([q(1), q(3)]);
    now = { tm: when, det: true, sub: `${selName()} 읍면동 · 격자 1시간 · 3시간`,
            cols: [{ title: "1시간", list: emdTop(a.rows), steps: SIU },
                   { title: "3시간", list: emdTop(b.rows), steps: [5, 20, 40, 60, 90, 120, 180] }] };
  }
  return {
    acc: { H: i + 1, src: "재현", fell: false, bt: when, basis: ACC_BASIS, ...acc },
    now,
    crit: { rows: crit, bt: when },
  };
}
/* 사례 AWS 기준 — 굳혀 둔 매시 RN_HR1(meta.stations)을 그 시각까지 더한다 */
function caseAccAws(i, dt, from) {
  const h1 = CASEM.stations?.h1;
  if (!h1 || !SITES) return { rows: [], sel: selOn() ? selName() : null, sub: "이 사례에는 관측소 자료가 없다", note: "" };
  const all = SITES.stations.filter(s => h1[s.stn]).map(s => {
    const h = h1[s.stn], seg = h.slice(0, i + 1), have = seg.filter(v => v != null);
    return { sig: s.sigun, tag: selOn() ? (multi() ? `${s.sigun} ${s.emd || ""}` : (s.emd || "")) : s.sigun, stn: s.name, d: h, dt, fcd: [], ft: [], h1: h[i] ?? 0,
             sum: Math.round(sumv(seg) * 10) / 10, fc: 0, pos: { x: s.x, y: s.y }, det: selOn(),
             part: have.length > 0 && have.length < seg.length, dead: !have.length };
  });
  const note = "기상청 정시자료(awsh) 매시 1시간 강수의 합" + (all.some(r => r.part) ? " · 일부 시각이 빠진 지점은 있는 시각만 더했다(하한)" : "");
  if (selOn()) {
    const rows = all.filter(r => isSel(r.sig));
    return { rows, sel: selName(), sub: `${selName()} AWS ${rows.length}곳 · ${from}`, note };
  }
  const best = {};
  for (const r of all) if (!best[r.sig] || r.sum > best[r.sig].sum) best[r.sig] = r;
  return { rows: ORDER_GN().filter(s => best[s]).map(s => best[s]), sub: `다우지점 · ${from}`,
           note: note + " — 격자 누적보다 봉우리가 높다(격자는 관측소 사이를 메운 분석값)" };
}
async function caseAccGrid(i, dt, from) {
  const t = CASEM.frames[i], ck = `${t}|${selQ()}`;
  let j = CASEACC.get(ck);
  if (!j) {
    j = await getJson(`/api/grid/acctable?case=${CASE}&tm=${t}&sigun=${encodeURIComponent(selQ())}`);
    if (CASEACC.size > 200) CASEACC.delete(CASEACC.keys().next().value);
    CASEACC.set(ck, j);
  }
  const n = CASEM.frames.length;
  const rows = j.rows.map(r => ({ sig: r.sig, tag: multi() ? r.sig : "", stn: r.name, d: r.d.concat(Array(n - r.d.length).fill(null)), dt,
    fcd: [], ft: [], sum: r.sum ?? 0, fc: 0, det: true, pos: r.col != null ? { x: r.col, y: r.row } : null }));
  return { rows, sel: selName(), sub: `${selName()} 읍면동 ${rows.length} · 누적 최대 칸 · ${from}`, note: "" };
}
function caseAlerts() {
  const i = caseIdx(), bySig = {}, by = {};
  for (const s of CASEM.series) {
    const lv = s.lv[i];
    if (!lv) continue;
    const name = lv === "warn" ? "호우경보" : "호우주의보";
    bySig[s.sigun] = [{ name, lv, sub: "산출" }];
    (by[name] ||= { lv, name, where: [] }).where.push(s.sigun);
  }
  const land = Object.values(by).sort((a, b) => (b.lv === "warn") - (a.lv === "warn"));
  const t = CASEM.frames[i];
  return { base: `${t.slice(0, 4)}-${t.slice(4, 6)}-${t.slice(6, 8)} ${hm(t)}`, bySig, land, sea: [], pending: [], calc: true };
}
function renderCrit() {
  const C = CARDS.crit;
  $("fc-bt").textContent = C.bt;
  const W = CASEM.criteria;
  const g = (v, cap, warnAt) => {
    const w = Math.min(100, v / cap * 100), m = Math.min(100, warnAt / cap * 100);
    return `<div class="g"><i style="width:${w.toFixed(1)}%"></i><s style="left:${m.toFixed(1)}%"></s><span>${v.toFixed(1)}</span></div>`;
  };
  $("fc-b").innerHTML = `<div class="crit h"><span>시군</span><span>3시간 (경보 ${W.warn.h3})</span><span>12시간 (경보 ${W.warn.h12})</span><span style="text-align:right">산출</span></div>`
    + C.rows.slice(0, cardRows()).map(r => `<div class="crit" data-s="${r.sig}"><span class="nm2">${r.sig}</span>
        ${g(r.h3, 180, W.warn.h3)}${g(r.h12, 450, W.warn.h12)}
        <span class="lv ${r.lv || "none"}">${r.lv === "warn" ? "경보" : r.lv === "watch" ? "주의보" : "—"}</span></div>`).join("");
  rowEvents($("fc-b"));
}
/* 데모 — 실황 · 테스트(합성 격자, 비 없는 날 화면 점검) · 재현 사례(지난 호우)를 한 메뉴에.
   실황에서 테스트를 켜고 끄는 것은 다시 띄우지 않고 그 자리에서, 사례는 주소를 바꿔 띄운다. */
function setTest(on) {
  if (CASE) { location.href = on ? "/map.html?test=1" : "/map.html"; return; }
  test = !!on;
  GRIDS.clear(); STATS.clear(); CARDS = null;
  loadFlow().then(() => show());
  loadAlerts();
  if (!test) loadCards();                // 테스트는 loadFlow 가 합성 흐름으로 카드를 다시 뽑는다
}
/* 설정 › 데모 — 실황 · 테스트(합성) · 재현 사례 목록. 예전엔 머리줄에 단추가 따로 있었다 */
/* 시연 한 줄의 설명 — 시각 · 누적 구간 · 특보 · 빠진 것 · 크기 */
const ACCL = a => !a ? "" : a.from === "today" ? "오늘 0시부터" : a.from === "yesterday" ? "어제 0시부터" : `지난 ${a.hours}시간`;
function snapSub(x) {
  return [`${md(x.now)} ${hm(x.now)}`, x.acc ? "누적 " + ACCL(x.acc) : "", (x.alerts || []).join(", "),
          x.mb ? x.mb + "MB" : ""].filter(Boolean).join(" · ")
    + ((x.warn || []).length ? ` <i class="sw">${x.warn.join(" · ")}</i>` : "")
    + (x.note ? `<br>${x.note}` : "");
}
/* 지금 저장 — 서버가 뒤에서 굳힌다(수십 초). 끝날 때까지 /api/snaps 의 job 을 본다 */
async function snapSave(btn, title, acc) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "굳히는 중…";
  const post = overwrite => fetch("/api/snaps", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ title, ...(acc ? { acc } : {}), overwrite }) });
  try {
    let r = await post(false);
    if (r.status === 409) {
      const d = (await r.json().catch(() => ({}))).detail || "";
      if (!/이미 있다/.test(d) || !confirm(d + "\n덮어쓸까요?")) throw new Error(d || "저장하지 않았다");
      r = await post(true);
    }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    const t0 = Date.now();
    for (;;) {
      await new Promise(res => setTimeout(res, 1200));
      const j = await getJson("/api/snaps");
      if (!j.job || j.job.done) {
        if (j.job?.error) throw new Error(j.job.error);
        const m = j.job?.meta;

   세부는 윗첨자(둘이면 '북부·남부' — 다 들면 시군만). 경남 열여덟이 다 들면 '경남 전역' */

  const all = ORDER_GN(), sigs = all.filter(s => by[s]);
  const whole = s => by[s].has("") || (!!SUBZ[s] && SUBZ[s].every(x => by[s].has(x)));
  if (sigs.length === all.length && sigs.every(whole)) return `<span class="rg">경남 전역</span>`;
  return sigs.map(s => {
    const subs = whole(s) ? [] : [...new Set([...(SUBZ[s] || []), ...by[s]])].filter(x => x && by[s].has(x));

function parseAlerts(j) {

    if (g.sea || (g.regions || []).every(r => /바다|해상/.test(r))) { sea.push({ ...g, sea: true }); continue; }
    const where = [], regs = [];
    for (const reg of g.regions || []) {
      const [s, sub] = regSig(reg);
      if (!s) continue;
      (bySig[s] ||= []).push({ name: g.name, lv: g.lv, sub });
      where.push(sub ? `${s}(${sub})` : s);

/* 경위도 → 500m 칸(정방향). 바다 특보 글자 자리를 경위도로 두려고 쓴다 */
const LCCF = (() => {
  const D = Math.PI / 180, a = 6378137, f = 1 / 298.257222101, e = Math.sqrt(f * (2 - f));
  const m = p => Math.cos(p) / Math.sqrt(1 - e * e * Math.sin(p) ** 2);
  const t = p => Math.tan(Math.PI / 4 - p / 2) / ((1 - e * Math.sin(p)) / (1 + e * Math.sin(p))) ** (e / 2);
  const p1 = 30 * D, p2 = 60 * D, p0 = 38 * D;
  const n = (Math.log(m(p1)) - Math.log(m(p2))) / (Math.log(t(p1)) - Math.log(t(p2)));
  const AF = a * m(p1) / (n * t(p1) ** n), rho0 = AF * t(p0) ** n;
  return (lon, lat) => {
    const rho = AF * t(lat * D) ** n, th = n * (lon - 126) * D;
    return [rho * Math.sin(th) / 500 + 880, (rho0 - rho * Math.cos(th)) / 500 + 1540];
  };
})();

function drawAlerts() {
  const gl = $("walerts"), gb = $("wbadge");
  ALERTBOX = [];
  if (!gl || !gb) return;
  if (!OV.has("alerts") || !ALERTS || ALERTS.err || !V || !V.s) { gl.innerHTML = gb.innerHTML = ""; return; }
  const sc = V.u / 3.3, w = Math.max(3.5, 4.6 * sc);      // 보이는 선 굵기(안쪽 절반)
  const defs = [], lines = [], badges = [];
  for (const [sig, list] of Object.entries(ALERTS.bySig)) {
    const ft = FEAT.find(f => f.properties.sigun === sig);
    if (!ft) continue;
    const top = list.reduce((a, b) => (LVRANK[b.lv] > LVRANK[a.lv] ? b : a));
    const id = `wc${ft.properties.id}`, dClip = PATH(ft);
    defs.push(`<clipPath id="${id}"><path d="${dClip}"/></clipPath>`);
    // ⚠️ 작은 섬(4㎢ 미만 = 16칸)까지 두르면 통영·거제 바다가 점선으로 어지럽다 — 선은 큰 땅에만
    const polys = ft.geometry.type === "Polygon" ? [ft.geometry.coordinates] : ft.geometry.coordinates;
    const areaCells = ring => Math.abs(ring.reduce((s, p, i) => {
      const q = ring[(i + 1) % ring.length];

    const big = polys.filter(p => areaCells(p[0]) >= 16);
    const d = PATH({ type: "MultiPolygon", coordinates: big.length ? big : polys });
    const L = (cls, sw, dash = "") => `<path class="wl ${cls}" d="${d}" clip-path="url(#${id})" stroke-width="${(sw * 2).toFixed(1)}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
    if (top.lv === "severe") lines.push(L("severe", w * 1.3), L("gap", w * 0.85), L("severe", w * 0.45));
    else if (top.lv === "warn") lines.push(L("warn", w));

    const items = [];
    for (const it of list.slice().sort((a, b) => LVRANK[b.lv] - LVRANK[a.lv])) {
      let m = items.find(x => x.name === it.name);
      if (!m) items.push(m = { name: it.name, lv: it.lv, subs: new Set() });
      m.subs.add(it.sub || "");

    for (const it of items) {
      const whole = it.subs.has("") || (!!SUBZ[sig] && SUBZ[sig].every(x => it.subs.has(x)));
      const txt = it.name + (whole ? "" : ` · ${[...new Set([...(SUBZ[sig] || []), ...it.subs])].filter(x => x && it.subs.has(x)).join("·")}`);
      const bw = txt.length * fs * 0.95 + fs * 0.9;

        <text x="${x.toFixed(1)}" y="${(y + bh / 2).toFixed(1)}" text-anchor="middle" style="font-size:${fs.toFixed(1)}px">${txt}</text></g>`);

        y += fs2 * 1.5;

/* ── 관측소(점) — 격자와 **같은 시각**의 실측. 레이어 '관측소'(S) ─────────────────
   ⚠️ 격자(면)는 관측소 사이를 메운 분석값이라 관측소 자리에서도 값이 다르다(봉우리가 깎인다).

   ⚠️ 값이 없는 것을 셋으로 가른다: 0(속 빈 마름모) · 기상청 결측(×) · 그 시각 값을 못 받음(점선).

let SITES = null, SITEBY = new Map();

const STNC = new Map();

async function stnFetch(key, tm) {

  accParams(p, key);

  catch (e) { return { err: e.message, layer: key }; }

function loadStations() {
  if (!OV.has("stations")) { STN = null; drawStations(); renderStnLegend(); return; }
  const key = layerKey(), tm = isFcst(kind) ? null : CUR?.tm;
  const my = ++STN_SEQ;
  const done = j => { if (my !== STN_SEQ) return; STN = j; drawStations(); renderStnLegend(); };
  const p = new URLSearchParams({ layer: key });

  if (test) p.set("test", "1");
  if (CASE) p.set("case", CASE);
  const hit = STNC.get(p.toString());
  if (hit) done(hit);                    // 기억해 둔 시각은 같은 틱에 — 재생할 때 격자와 함께 넘어간다

/* 지금 그리는 격자와 같은 층·시각의 관측소 값인가 — 아니면 그리지 않는다(어긋난 시각을 나란히 두지 않는다) */
function stnFresh() {
  return !!STN && !STN.err && STN.layer === layerKey() && (STN.status === "forecast" || STN.tm === CUR?.tm);
}
function drawStations() {
  const g = $("stns");
  if (!g) return;
  if (!OV.has("stations") || !V || !V.s || !stnFresh()) { g.innerHTML = ""; drawEmdNames(LABELBOX); return; }
  const steps = stepsOf(kind), css = colsOf(kind), fac = factor(), fc = STN.status === "forecast";
  const r = STN_R = Math.max(4.5, Math.min(12, V.u * 1.05));
  const fs = Math.max(11, Math.min(26, V.u * 3.1));
  const val = s => s.v * fac;
  const has = s => !fc && (s.q === "ok" || s.q === "part");
  const dia0 = (x, y, rr) => `M${x.toFixed(1)},${(y - rr).toFixed(1)}L${(x + rr).toFixed(1)},${y.toFixed(1)}L${x.toFixed(1)},${(y + rr).toFixed(1)}L${(x - rr).toFixed(1)},${y.toFixed(1)}Z`;
  /* 기상청 AWS ◇ · 경남 AWS ○(조금 작게 — 216곳이라 붐빈다). 색 단계는 같다 */
  const circ = (x, y, rr) => `M${(x - rr).toFixed(1)},${y.toFixed(1)}a${rr.toFixed(1)},${rr.toFixed(1)} 0 1,0 ${(2 * rr).toFixed(1)},0a${rr.toFixed(1)},${rr.toFixed(1)} 0 1,0 ${(-2 * rr).toFixed(1)},0Z`;

    const x = V.toX(s.x), y = V.toY(s.y), dim = selOn() && !isSel(s.sigun) ? " dim" : "";

                   : `<g class="st z${dim}"><path d="${dia(x, y, r * 0.8)}"/></g>`);
    } else if (!fc && s.q === "off") {                     // 비활성화 — 계산에서 뺐다
      const q = r * 0.55;
      marks.push(`<g class="st off${dim}"><path d="${dia(x, y, r * 0.8)}"/>
        <line x1="${(x - q).toFixed(1)}" y1="${(y + q).toFixed(1)}" x2="${(x + q).toFixed(1)}" y2="${(y - q).toFixed(1)}"/></g>`);
    } else if (!fc && s.q === "missing") {
      const q = r * 0.42;
      marks.push(`<g class="st miss${dim}"><path d="${dia(x, y, r * 0.8)}"/>
        <line x1="${(x - q).toFixed(1)}" y1="${(y - q).toFixed(1)}" x2="${(x + q).toFixed(1)}" y2="${(y + q).toFixed(1)}"/>
        <line x1="${(x - q).toFixed(1)}" y1="${(y + q).toFixed(1)}" x2="${(x + q).toFixed(1)}" y2="${(y - q).toFixed(1)}"/></g>`);
    } else marks.push(`<g class="st none${dim}"><path d="${dia(x, y, r * 0.75)}"/></g>`);
  }
  // 값 글자 — 레이어 '지점 강수량 글자'(V)를 켰을 때만. 점만으로도 색 단계는 읽힌다(붐비지 않게 기본은 끔).
  // 센 곳부터, 시군명·특보 딱지·격자 최대 라벨·다른 점·앞 글자와 겹치지 않는 자리에만.
  // 상위 셋은 지점 이름도 단다. 시군을 골랐으면 그 시군 지점만, 이름까지.
  const wet = !OV.has("stnval") ? [] : STN.rows.filter(s => has(s) && val(s) >= steps[0] && (!selOn() || isSel(s.sigun))).sort((a, b) => b.v - a.v);
  const named = new Set(wet.slice(0, 3).map(s => s.stn));
  const placed = LABELBOX.concat(boxes), out = [];
  const hit = b => placed.some(p => b.x0 < p.x1 && b.x1 > p.x0 && b.y0 < p.y1 && b.y1 > p.y0);
  const inside = b => b.x0 >= 4 && b.y0 >= 4 && b.x1 <= V.W - 4 && b.y1 <= V.H - 4;

    const nm = selOn() || named.has(s.stn) ? s.name : "";

      style="font-size:${fs.toFixed(1)}px;stroke-width:${(fs * 0.2).toFixed(1)}px">${t}${nm ? `<tspan class="n" dx="${(fs * 0.3).toFixed(1)}">${nm}</tspan>` : ""}</text>`);

}

/* 마우스 아래 관측소(지도 좌표 mx,my 에서 가장 가까운 점, 점 크기의 1.5배 안) */
function stationAt(mx, my) {
  if (!OV.has("stations") || !stnFresh() || !V) return null;

    : s.q === "missing" ? "결측" : "값 없음";

  const diff = has && gv !== undefined && gv !== MISSING ? gv / 10 * fac - s.v * fac : null;
  const who = s.org === "gn" ? `경남 AWS · ${s.sigun}${s.place ? ` · ${s.place}` : ""}` : `기상청 AWS ${s.stn} · ${s.sigun} ${site?.emd || ""}`;
  return `<b>${s.name} ${obs}</b>${gap} · ${who}`
    + `<div class="d">그 칸 ${kind === "aws" || kind === "aws60" ? "AWS 면" : "격자"} ${grid}${diff != null ? ` (면 − 관측 ${diff >= 0 ? "+" : ""}${diff.toFixed(1)})` : ""} · 해발 ${Math.round(s.ht || 0)}m${s.addr ? ` · ${s.addr}` : ""}${STN.src ? ` · ${STN.src}` : ""}</div>`;

  const hb = META.grids.hr, c = Math.round(gx) - hb.i0, r = Math.round(gy) - hb.j0;
  if (c < 0 || r < 0 || c >= hb.w || r >= hb.h) return null;
  const sg = GEO.sigun.find(s => s.id === MSIG[r * hb.w + c]);

}
