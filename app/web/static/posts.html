<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지 · 요청 — 경남 기상지도</title>
<!-- 블로그형 게시판 — 목록(제목 · 두 줄 미리보기 · 상태 · 날짜) → 누르면 읽기 화면(#p=번호). 글쓰기는 오른쪽 위 단추. 문서 탭은 docs/ 의 마크다운(#doc=경로).
     서버는 그대로(app/posts.py · /api/posts · /api/docs). -->
<style>
  :root { --bg: #0b1017; --panel: #121a24; --line: #253244; --ink: #e8eef6; --ink-2: #a9b6c7; --ink-3: #7c8a9c; --accent: #6cb4ff;
          --warn: #ffb74d; --bad: #ff6b6b; --ok: #7ad19b; }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 64px; }
  a { color: var(--accent); }
  input, textarea, select, button { font: inherit; font-size: 14px; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 10px; }
  input, select, button { min-height: 40px; padding: 0 12px; } textarea { width: 100%; padding: 10px 12px; resize: vertical; line-height: 1.6; }
  button { cursor: pointer; font-weight: 600; } button.pri { color: var(--on); background: var(--accent); border-color: var(--accent); }
  button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); } button.ghost:hover { color: var(--ink); background: var(--btn); }
  :is(input, textarea, select, button, a, .row):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .top h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; } .top p { margin: 2px 0 0; font-size: 13px; color: var(--ink-3); }
  .top .sp { flex: 1; } .top .home { font-size: 13.5px; text-decoration: none; color: var(--ink-2); }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 2px; } .tabs button { min-height: 38px; background: transparent; border: 0; border-radius: 8px; color: var(--ink-2); font-size: 15px; }
  .tabs button[aria-selected="true"] { color: var(--ink); background: var(--btn); }
  .tabs .n { margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; background: var(--accent); color: var(--on); }
  .tabs .n:empty { display: none; }
  .bar .sp { flex: 1; } .bar input[type=search] { width: 200px; min-height: 36px; font-size: 13.5px; }
  .flt { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 0 0; }
  .flt button { min-height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 999px; background: transparent; color: var(--ink-2); }
  .flt button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 16%, transparent); }

  /* 목록 — 한 줄에 글 하나: 상태 · 제목 · 미리보기 두 줄 · 쓴 사람 · 날짜 · 답 */
  .list { list-style: none; margin: 6px 0 0; padding: 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 18px; padding: 18px 12px; margin: 0 -12px; border-radius: 12px; cursor: pointer;
    border-bottom: 1px solid color-mix(in oklab, var(--line) 70%, transparent); transition: background .15s; }
  .row:hover { background: color-mix(in oklab, var(--panel) 80%, var(--bg)); }
  .row h2 { grid-column: 1; margin: 0; font-size: 17px; line-height: 1.45; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; letter-spacing: -.01em; }
  .row .ex { grid-column: 1; margin: 0; color: var(--ink-2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .meta { grid-column: 1; }
  .row .when { grid-column: 2; grid-row: 1; align-self: start; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meta { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .meta .re { color: var(--ok); }
  .chip { padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: 0; white-space: nowrap; }
  .chip.open { color: #1a1206; background: var(--warn); } .chip.doing { color: var(--on); background: var(--accent); } .chip.done { color: #06200f; background: var(--ok); }
  .chip.no { color: var(--ink-3); background: var(--btn); } .chip.pop { color: var(--accent); border: 1px solid var(--accent); }
  .empty { padding: 48px 20px; text-align: center; color: var(--ink-2); }
  .empty button { margin-top: 12px; }

  /* 쓰기 */
  .write { margin: 18px 0 6px; padding: 18px; display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .write input#f-title { font-size: 18px; font-weight: 700; min-height: 46px; }
  .write .row2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .write .row2 .sp { flex: 1; }
  .write label.ck { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); } .write label.ck input { min-height: 0; width: 18px; height: 18px; }
  .hint { font-size: 12.5px; color: var(--ink-3); } .msg { font-size: 13px; color: var(--ok); } .msg.bad { color: var(--bad); }

  /* 읽기 */
  .read { padding-top: 8px; }
  .read .back { display: inline-flex; gap: 6px; font-size: 13.5px; text-decoration: none; color: var(--ink-2); margin-bottom: 18px; }
  .read h1 { margin: 6px 0 10px; font-size: 30px; line-height: 1.3; letter-spacing: -.02em; }
  .read .meta { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .read .body { padding: 22px 0; font-size: 16px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
  .reply { margin: 4px 0 18px; padding: 14px 18px; border-radius: 12px; background: color-mix(in oklab, var(--ok) 10%, var(--panel)); border: 1px solid color-mix(in oklab, var(--ok) 35%, var(--line)); }
  .reply b { display: block; margin-bottom: 4px; font-size: 12.5px; color: var(--ok); } .reply div { white-space: pre-wrap; }
  .adm { display: grid; gap: 10px; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; } .adm .r { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .adm h3 { margin: 0; font-size: 12.5px; color: var(--ink-3); }

  /* 문서 */
  .docs { display: grid; gap: 22px; margin-top: 18px; } .docs h3 { margin: 0 0 8px; font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .doc { padding-top: 8px; line-height: 1.8; } .doc .dh { margin: 6px 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); } .doc .dh small { color: var(--ink-3); }
  .doc .dh p { margin: 6px 0 0; color: var(--ink-2); }
  .md h2 { font-size: 22px; margin: 18px 0 8px; } .md h3 { font-size: 17px; margin: 22px 0 8px; padding-left: 10px; border-left: 3px solid var(--accent); }
  .md h4 { font-size: 15px; margin: 16px 0 6px; } .md h5 { font-size: 14px; margin: 12px 0 4px; color: var(--ink-2); }
  .md p { margin: 8px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; } .md li { margin: 3px 0; }
  .md b { color: var(--ink); } .md code { padding: 1px 5px; font: 12.5px Consolas, monospace; background: var(--field); border: 1px solid var(--line); border-radius: 4px; }
  .md pre { padding: 10px 12px; overflow: auto; background: var(--field); border: 1px solid var(--line); border-radius: 8px; } .md pre code { padding: 0; border: 0; }
  .md .tw { overflow-x: auto; margin: 10px 0; } .md table { border-collapse: collapse; min-width: 60%; font-size: 13px; }
  .md th, .md td { padding: 6px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; } .md th { background: var(--btn); color: var(--ink-2); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .md blockquote { margin: 10px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--ink-2); }
  .md .co { margin: 12px 0; padding: 8px 14px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; background: var(--field); }
  .md .co-h { font-weight: 700; color: var(--accent); } .md .co.warning, .md .co.caution, .md .co.danger { border-left-color: var(--warn); } .md .co.warning .co-h, .md .co.caution .co-h, .md .co.danger .co-h { color: var(--warn); }
  .md .co.important .co-h, .md .co.tip .co-h { color: var(--ok); } .md .co.important, .md .co.tip { border-left-color: var(--ok); }
  .md a { color: var(--accent); } .md .wk { color: #c9a6ff; border-bottom: 1px dotted #c9a6ff; }

  .fade { animation: fade .25s ease; } @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .row { transition: none; } }
  @media (max-width: 600px) {
    main { padding: 18px 16px 48px; } .top h1 { font-size: 22px; } .read h1 { font-size: 24px; }
    .bar input[type=search] { width: 100%; order: 3; }
    .row { grid-template-columns: minmax(0, 1fr); } .row .when { grid-column: 1; grid-row: auto; }
  }
</style>
<link rel="stylesheet" href="css/pages.css">
<script>try { if (localStorage.getItem("gn-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
</head>
<body>
<main>
  <div class="top"><div><h1>공지 · 요청</h1><p>바뀐 것 알림 · 고칠 것 요청 · 문서</p></div><span class="sp"></span>
    <a class="home" href="/map.html">← 지도</a><button type="button" class="pri" id="b-write">글쓰기</button></div>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="t-notice" aria-selected="true" data-k="notice">공지<span class="n" id="n-notice"></span></button>
      <button type="button" role="tab" id="t-request" aria-selected="false" data-k="request">요청<span class="n" id="n-request"></span></button>
      <button type="button" role="tab" id="t-doc" aria-selected="false" data-k="doc">문서</button>
    </div>
    <span class="sp"></span><input type="search" id="q" placeholder="제목 · 내용 찾기" aria-label="글 찾기">
  </div>
  <div class="flt" id="flt" role="group" aria-label="처리 상태" hidden></div>
  <form class="write fade" id="f" hidden>
    <input id="f-title" maxlength="100" required placeholder="제목" aria-label="제목">
    <textarea id="f-body" rows="7" maxlength="4000" placeholder="어느 화면에서 · 무엇이 · 어떻게 바뀌면 좋은지" aria-label="내용"></textarea>
    <div class="hint" id="f-hint"></div>
    <div class="row2"><label class="ck" id="f-pop-l" hidden><input type="checkbox" id="f-pop"> 지도를 열 때 팝업으로 띄우기</label>
      <span class="sp"></span><button type="button" class="ghost" id="f-x">취소</button><button class="pri" type="submit" id="f-go">올리기</button></div>
    <div class="msg" id="f-msg" role="status"></div>
  </form>
  <div id="list"></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const REPO = "https://github.com/Obsidiankorea/monitoring/issues/new";
let ME = null, D = null, DOCS = null, ST = "all", TAB = ({ request: "request", doc: "doc" })[new URLSearchParams(location.search).get("tab")] || (location.hash.startsWith("#doc=") ? "doc" : "notice");
const admin = () => ME && ME.role === "admin";
const canWrite = () => TAB === "request" || (TAB === "notice" && admin());
async function call(url, method = "GET", body) {
  const r = await fetch(url, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) location.replace("/login.html?next=/posts.html");
  if (!r.ok) throw new Error(j.detail || `오류 ${r.status}`);
  return j;
}
/* '2026-11-21 10:12' → 오늘 10:12 · 어제 · 11.19.(올해) · 2025.11.19. */
function when(s) {
  const m = String(s || "").match(/^(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d:\d\d))?/);
  if (!m) return esc(s);
  const d = new Date(+m[1], +m[2] - 1, +m[3]), t = new Date(), day = 864e5;
  const t0 = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  if (+d === +t0) return `오늘 ${m[4] || ""}`.trim();
  if (+d === t0 - day) return "어제";
  return +m[1] === t.getFullYear() ? `${+m[2]}.${+m[3]}.` : `${m[1]}.${+m[2]}.${+m[3]}.`;
}
const chip = p => p.kind === "request" ? `<span class="chip ${esc(p.status)}">${esc(p.status_name)}</span>` : p.popup ? `<span class="chip pop">팝업</span>` : "";
const postId = () => (location.hash.match(/^#p=(\d+)$/) || [])[1];

/* 문서 — 목록(묶음별) · 하나 보기(#doc=경로) */
async function drawDocs() {
  const want = decodeURIComponent((location.hash.match(/^#doc=(.+)$/) || [])[1] || "");
  if (want) {
    try {
      const d = await call(`/api/docs/view?path=${encodeURIComponent(want)}`);
      $("list").innerHTML = `<article class="doc read fade"><a class="back" href="#">← 문서 목록</a>
        <div class="dh"><small>${esc(want)}${d.updated ? ` · 고친 날 ${esc(d.updated)}` : ""}</small>${d.summary ? `<p>${esc(d.summary)}</p>` : ""}</div>
        <div class="md">${d.html}</div></article>`;
      scrollTo(0, 0);
    } catch (err) { $("list").innerHTML = `<div class="empty">문서를 열지 못했습니다 — ${esc(err.message)} <a href="#">목록으로</a></div>`; }
    return;
  }
  DOCS ||= (await call("/api/docs")).rows;
  const q = $("q").value.trim().toLowerCase(), rows = DOCS.filter(x => !q || `${x.title} ${x.summary || ""}`.toLowerCase().includes(q));
  const groups = [...new Set(rows.map(x => x.group))];
  $("list").innerHTML = rows.length ? `<div class="docs fade">${groups.map(g => `<section><h3>${esc(g)}</h3><ul class="list">${rows.filter(x => x.group === g).map(x =>
    `<li class="row" tabindex="0" data-doc="${esc(x.path)}"><h2>${esc(x.title)}</h2>${x.summary ? `<p class="ex">${esc(x.summary)}</p>` : ""}<span class="when">${x.updated ? esc(when(x.updated)) : ""}</span></li>`).join("")}</ul></section>`).join("")}</div>`
    : `<div class="empty">찾는 문서가 없습니다</div>`;
}

/* 글 하나 읽기(#p=번호) */
function drawPost(p) {
  const adm = admin() ? `<div class="adm"><h3>관리</h3><div class="r">
      ${p.kind === "request" ? `<select data-a="status" aria-label="처리 상태">${Object.entries(D.status).map(([k, n]) => `<option value="${k}"${k === p.status ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>
        <button type="button" data-a="gh" title="저장소가 공개라 자동으로 올리지 않는다 — 내용이 채워진 쓰기 창을 열면 다듬어서 올린다(쓴 사람 이름은 넣지 않는다)">GitHub 이슈로</button>`
        : `<button type="button" data-a="pop">${p.popup ? "팝업 끄기" : "팝업 켜기"}</button>`}
      <span style="flex:1"></span><button type="button" data-a="hide">숨기기</button></div>
      ${p.kind === "request" ? `<textarea data-a="reply" rows="3" placeholder="답(쓴 사람이 봅니다)" aria-label="답">${esc(p.reply)}</textarea><div class="r"><span style="flex:1"></span><button type="button" class="pri" data-a="save">답 저장</button></div>` : ""}
    </div>` : "";
  $("list").innerHTML = `<article class="read fade" data-id="${p.id}"><a class="back" href="#">← ${TAB === "request" ? "요청" : "공지"} 목록</a>
    <div>${chip(p)}</div><h1>${esc(p.title)}</h1>
    <div class="meta"><span>${esc(p.author)}</span><span>${esc(p.created)}</span>${p.updated !== p.created ? `<span>고침 ${esc(p.updated)}</span>` : ""}</div>
    <div class="body">${p.body ? esc(p.body) : `<span class="hint">내용 없음</span>`}</div>
    ${p.reply ? `<div class="reply"><b>관리자 답</b><div>${esc(p.reply)}</div></div>` : ""}${adm}</article>`;
}

function draw() {
  for (const k of ["notice", "request", "doc"]) $(`t-${k}`).setAttribute("aria-selected", String(k === TAB));
  for (const k of ["notice", "request"]) $(`n-${k}`).textContent = D ? (k === "request" ? D.request.filter(x => x.status === "open").length || "" : "") : "";
  $("b-write").hidden = !canWrite();
  $("q").placeholder = TAB === "doc" ? "문서 찾기" : "제목 · 내용 찾기";
  $("flt").hidden = TAB !== "request" || !D || !!postId();
  if (TAB === "request" && D) $("flt").innerHTML = [["all", "전체"], ...Object.entries(D.status)].map(([k, n]) => {
    const c = k === "all" ? D.request.length : D.request.filter(x => x.status === k).length;
    return `<button type="button" data-st="${k}" aria-pressed="${ST === k}">${esc(n)} ${c}</button>`; }).join("");
  if (TAB === "doc") { $("f").hidden = true; return void drawDocs(); }
  $("f-pop-l").hidden = TAB !== "notice";
  $("f-hint").textContent = TAB === "request" ? "고칠 것 · 바랄 것을 적어 주세요. 관리자가 읽고 처리 상태와 답을 남깁니다. 연락처 · 개인정보는 적지 마세요." : "공지는 관리자만 씁니다. '팝업'을 켜면 지도를 열 때 한 번 뜹니다.";
  if (!D) return void ($("list").innerHTML = `<div class="empty">불러오는 중…</div>`);
  const id = postId(), p = id && D[TAB].find(x => String(x.id) === id);
  if (p) { $("f").hidden = true; return drawPost(p); }
  const q = $("q").value.trim().toLowerCase();
  const rows = D[TAB].filter(x => (TAB !== "request" || ST === "all" || x.status === ST) && (!q || `${x.title} ${x.body}`.toLowerCase().includes(q)));
  $("list").innerHTML = rows.length ? `<ul class="list fade">${rows.map(p => `<li class="row" tabindex="0" data-p="${p.id}">
      <h2>${chip(p)}${esc(p.title)}</h2>${p.body ? `<p class="ex">${esc(p.body)}</p>` : ""}
      <div class="meta"><span>${esc(p.author)}</span>${p.reply ? `<span class="re">답 있음</span>` : ""}</div><span class="when" title="${esc(p.created)}">${esc(when(p.created))}</span></li>`).join("")}</ul>`
    : `<div class="empty">${q || ST !== "all" ? "조건에 맞는 글이 없습니다" : TAB === "request" ? "아직 요청이 없습니다" : "공지가 없습니다"}${canWrite() && !q ? `<br><button type="button" class="pri" data-w>글쓰기</button>` : ""}</div>`;
}
async function load() { D = await call("/api/posts"); draw(); }
function openWrite(on) { $("f").hidden = !on; $("f-msg").textContent = ""; if (on) { $("f-title").focus(); } }

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  TAB = b.dataset.k; ST = "all"; $("q").value = ""; openWrite(false);
  history.replaceState(null, "", TAB === "notice" ? location.pathname : `?tab=${TAB}`); draw();
});
$("flt").addEventListener("click", e => { const b = e.target.closest("[data-st]"); if (b) { ST = b.dataset.st; draw(); } });
$("q").addEventListener("input", () => { if (postId()) history.replaceState(null, "", location.pathname + location.search); draw(); });
$("b-write").addEventListener("click", () => { if (postId()) location.hash = ""; openWrite($("f").hidden); });
$("f-x").addEventListener("click", () => openWrite(false));
addEventListener("hashchange", () => { if (location.hash.startsWith("#doc=") && TAB !== "doc") TAB = "doc"; draw(); scrollTo(0, 0); });
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("f-msg"); m.className = "msg"; m.textContent = "";
  try {
    await call("/api/posts", "POST", { kind: TAB, title: $("f-title").value, body: $("f-body").value, popup: $("f-pop").checked });
    $("f").reset(); openWrite(false); await load();
  } catch (err) { m.className = "msg bad"; m.textContent = `올리지 못했습니다 — ${err.message}`; }
});
const open = el => { if (el.dataset.p) location.hash = `p=${el.dataset.p}`; else if (el.dataset.doc) location.hash = `doc=${encodeURIComponent(el.dataset.doc)}`; };
$("list").addEventListener("keydown", e => { const r = e.target.closest(".row"); if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(r); } });
$("list").addEventListener("click", async e => {
  if (e.target.closest("[data-w]")) return openWrite(true);
  const r = e.target.closest(".row"); if (r) return open(r);
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const art = b.closest("[data-id]"), id = art.dataset.id, p = D[TAB].find(x => String(x.id) === id);
  try {
    if (b.dataset.a === "gh") {
      const body = `${p.body}\n\n---\n대시보드 요청 게시판 #${p.id} (${p.created})`;
      window.open(`${REPO}?title=${encodeURIComponent(p.title)}&body=${encodeURIComponent(body)}`, "_blank", "noopener");
      return;
    }
    if (b.dataset.a === "hide") {
      if (!confirm(`'${p.title}' 글을 숨길까요? 기록은 서버에 남습니다.`)) return;
      await call(`/api/posts/${id}`, "PUT", { gone: true }); location.hash = ""; return void load();
    }
    const data = b.dataset.a === "pop" ? { popup: !p.popup } : { reply: art.querySelector('[data-a="reply"]').value };
    await call(`/api/posts/${id}`, "PUT", data); await load();
  } catch (err) { alert(`바꾸지 못했습니다 — ${err.message}`); }
});
$("list").addEventListener("change", async e => {
  const s = e.target.closest('select[data-a="status"]'); if (!s) return;
  try { await call(`/api/posts/${s.closest("[data-id]").dataset.id}`, "PUT", { status: s.value }); await load(); }
  catch (err) { alert(`바꾸지 못했습니다 — ${err.message}`); }
});
(async () => {
  try { const m = await call("/api/auth/me"); ME = m.user || { role: "admin" }; } catch { ME = null; }
  draw(); await load();
})();
</script>
